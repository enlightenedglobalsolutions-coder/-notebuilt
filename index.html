<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- EGS-STD:coldopen-version -->
<!-- test deploy 2026-08-22: confirms the swUpdateBlocked() fix on device -->
<script>window.EGS_VERSION = '2026.08.22-1222 (31305a5)';</script>
<title>Notebuilt</title>
<!-- EGS-STD:themes — §2 row 13. This script runs BEFORE the stylesheet on
     purpose: it stamps the chosen mode on <html> so the very first paint is
     already the right theme. Read only — it never writes, so the "nothing at
     startup writes preferences" law holds. 'system' is stamped as itself and
     left for the CSS media query to follow, which is why a live OS switch
     needs no JavaScript. The status-bar colours live here, in one place, so
     the toggle later cannot drift from what the first frame used. -->
<script>window.NB_THEME_BAR={dark:'#15181D',light:'#F6F3EC'};
(function(){var m='system';
  try{var s=localStorage.getItem('notebuilt.theme');if(s==='light'||s==='dark')m=s;}catch(e){}
  document.documentElement.setAttribute('data-theme',m);
  var dark=(m==='dark')||(m==='system'&&!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches));
  var t=document.querySelector('meta[name="theme-color"]');
  if(t)t.setAttribute('content',dark?window.NB_THEME_BAR.dark:window.NB_THEME_BAR.light);})();</script>
<style>
  /* ---- Design tokens: a leather field-notebook holding spec-stamp pages ----
     EGS-STD:themes — §2 row 13 lives here, on the block it describes.

     THE ROLE RULE, because this is the one that bites: --ink is always the
     GROUND and --paper is always the TEXT ON IT. The names describe roles,
     not brightnesses, and the values swap ends of the scale between themes.
     Read every rule below as a role and it stays correct in both. Read one
     as a colour — "--paper is the light one" — and it inverts in daylight.

     The accent is split for the same reason, and the two halves always
     appear together: --brass is the accent you READ (it deepens on paper or
     it fails contrast), --brass-fill is the gold PLATE, and --on-brass is
     the only thing ever written on that plate. Never put --paper or --ink on
     a brass fill; --on-brass is what that is for.

     Every text-on-ground pairing here was measured, not eyeballed, and
     clears 4.5:1 in BOTH themes. --paper-faint, --doing and --danger were
     lifted from their launch values, which did not: --paper-faint sat at
     2.70:1 on a card while drawing the version stamp, to-do meta lines and
     completed to-dos. The lift is the smallest hue-preserving step that
     clears the bar, so the night theme still looks like itself. */
  :root{
    /* Night — the shipped identity, and the base every theme falls back to. */
    --ink:#15181D;        /* GROUND: notebook cover / app shell */
    --ink-2:#1C2027;      /* raised surface */
    --ink-3:#252A33;      /* card */
    --line:#333A45;       /* hairline rule (blueprint) — DECORATIVE */
    --line-soft:#2A2F39;
    /* An outline that IS the control, where nothing else marks it: the
       empty to-do punch, an unfilled PIN dot, the dashed add-photo tile.
       >=3:1 on every ground, because that outline is information. Card
       borders deliberately stay on --line and stay subtle. */
    --line-strong:#67758B;
    --paper:#ECE6D8;      /* TEXT on the ground */
    --paper-dim:#A7A294;  /* secondary text */
    --paper-faint:#949186;/* tertiary — was #6E6B61, 2.70:1 on a card */
    --brass:#D7A94B;      /* accent you READ */
    --brass-fill:#D7A94B; /* accent as a PLATE */
    --on-brass:#231A07;   /* the only ink that goes on that plate */
    --doing:#7194B9;      /* slate blue — was #6E92B8, 4.44:1 on a card */
    --done:#7E9D63;       /* sage */
    --danger:#D07A64;     /* was #C8654B, 3.72:1 on a card */
    --done-wash:rgba(126,157,99,.14);
    --nav-bg:rgba(20,24,29,.92);
    --scrim:rgba(0,0,0,.55);
    --shadow-pop:0 8px 22px rgba(0,0,0,.45);
    --shadow-card:0 8px 24px rgba(0,0,0,.4);
    --radius:14px;
    --radius-sm:10px;
    --tap:46px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  /* ---- Daylight: a spec sheet on a job-site table ----
     Not an inversion of the night theme. Warm drafting paper, graphite
     rules, the same brass — Notebuilt in a bright cab or out on a deck,
     where a dark screen is a mirror. Elevation still runs the same
     direction as at night (raised = further from the ground colour), so
     every existing rule reads correctly without being rewritten.

     ORDER MATTERS BELOW. The media block is guarded so an explicit choice
     of night wins over a daylight phone, and the [data-theme="light"] block
     is written AFTER it because the two have identical specificity — source
     order is the only thing separating them. Moving either one breaks a
     mode without breaking anything a quick look would catch. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#F6F3EC; --ink-2:#FBF9F3; --ink-3:#FFFFFF;
      --line:#998F78; --line-soft:#C9C0AC; --line-strong:#8B8069;
      --paper:#1E222A; --paper-dim:#55595F; --paper-faint:#68655C;
      --brass:#855E11; --brass-fill:#D7A94B; --on-brass:#231A07;
      --doing:#35608A; --done:#4A6B33; --danger:#A83E27;
      --done-wash:rgba(74,107,51,.13);
      --nav-bg:rgba(251,249,243,.92);
      --scrim:rgba(38,32,20,.44);
      --shadow-pop:0 8px 22px rgba(58,48,30,.20);
      --shadow-card:0 8px 24px rgba(58,48,30,.15);
    }
  }
  :root[data-theme="light"]{
    --ink:#F6F3EC; --ink-2:#FBF9F3; --ink-3:#FFFFFF;
    --line:#998F78; --line-soft:#C9C0AC; --line-strong:#8B8069;
    --paper:#1E222A; --paper-dim:#55595F; --paper-faint:#68655C;
    --brass:#855E11; --brass-fill:#D7A94B; --on-brass:#231A07;
    --doing:#35608A; --done:#4A6B33; --danger:#A83E27;
    --done-wash:rgba(74,107,51,.13);
    --nav-bg:rgba(251,249,243,.92);
    --scrim:rgba(38,32,20,.44);
    --shadow-pop:0 8px 22px rgba(58,48,30,.20);
    --shadow-card:0 8px 24px rgba(58,48,30,.15);
  }

  /* ---- Surfaces that are dark BY NATURE, in either theme ----
     A photograph and a live lens are content, not chrome. They are judged
     against a dark ground in daylight exactly as at night, the way every
     photo app on the phone does it — so these four layers re-declare the
     role tokens to their night values instead of inheriting the page's.

     This is a scope, not a list of overrides, and that is the point: every
     rule inside these layers already speaks in roles, so pinning the roles
     once fixes all of them at a stroke. Without it, daylight paints dark
     text onto near-black — #viewer .v-count is var(--paper-dim), and it
     would simply disappear.

     #vault is NOT here: the ceremony screen is chrome, and follows. Only
     #vault-busy, the veil drawn over it while keys derive, is pinned. */
  #viewer,#annotate,#camera,#vault-busy{
    --ink:#15181D; --ink-2:#1C2027; --ink-3:#252A33;
    --line:#333A45; --line-soft:#2A2F39; --line-strong:#67758B;
    --paper:#ECE6D8; --paper-dim:#A7A294; --paper-faint:#949186;
    --brass:#D7A94B; --brass-fill:#D7A94B; --on-brass:#231A07;
    --doing:#7194B9; --done:#7E9D63; --danger:#D07A64;
    color:var(--paper);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-size:16px;line-height:1.45;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--paper)}
  ::placeholder{color:var(--paper-faint)}

  /* ---- App frame ---- */
  #app{
    min-height:100%;
    padding:calc(var(--safe-t) + 4px) 0 calc(var(--tap) + var(--safe-b) + 78px);
    max-width:680px;margin:0 auto;
  }
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px 12px;
  }
  .topbar h1{
    font-family:var(--serif);font-weight:600;
    font-size:25px;letter-spacing:.2px;margin:0;flex:1;
  }
  .topbar .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--brass);display:block;margin-bottom:1px;
  }
  .icon-btn{
    width:var(--tap);height:var(--tap);border-radius:12px;
    display:grid;place-items:center;color:var(--paper-dim);
    background:var(--ink-2);
  }
  .icon-btn:active{background:var(--ink-3)}
  .icon-btn svg{width:22px;height:22px}

  .wrap{padding:0 16px}
  .muted{color:var(--paper-dim)}
  .faint{color:var(--paper-faint)}
  .mono{font-family:var(--mono)}
  /* EGS-STD:coldopen-version — one look for the stamp, wherever it is drawn. */
  .ver-stamp{font-family:var(--mono);text-align:center;font-size:10.5px;letter-spacing:.12em;
    color:var(--paper-faint);margin:20px 0 4px}
  #lock .ver-stamp{margin:18px 0 0}

  /* ---- Cards ---- */
  .card{
    background:var(--ink-3);border:1px solid var(--line-soft);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  .card:active{border-color:var(--line)}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- Section heading w/ blueprint rule ---- */
  .sec-head{
    display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;
  }
  .sec-head .label{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-dim);white-space:nowrap;
  }
  .sec-head .rule{flex:1;height:1px;background:var(--line)}
  .sec-head .count{font-family:var(--mono);font-size:11px;color:var(--paper-faint)}

  /* ---- Info markers ----
     EGS-STD:infomode — §2 row 14 lives here, on the block it describes.

     ONE RULE switches every marker off: the [data-guide="off"] line at the
     bottom of this block. No screen, no render function and no handler ever
     asks which mode the app is in — they all draw the marker and the
     stylesheet decides whether it is seen. That is deliberate. The moment a
     render function starts branching on the mode, expert becomes a second
     layout to test rather than the same layout with something hidden, and
     the two drift the first time one of them is edited alone.

     ZERO REFLOW BETWEEN MODES is the other half, and it is why there are
     exactly three hosts and no others:

       * inside a .sec-head, straight after .label — .rule is flex:1 and
         swallows the marker's width, so the label does not move and neither
         does the count or button on the right. 15px is under the 11px
         label's own 15.95px line box, so the row does not grow either.
       * inline at the end of a SHORT, FIXED topbar <h1> — "To Do",
         "Projects", "Notes", "Calculator". 15px sits inside a 25px serif
         line box without raising it, and none of those four can wrap.
       * .help-corner, absolute in a sheet's top-right — out of flow
         entirely, so a sheet title of any length is untouched by it.

     A variable-length title never gets an inline marker. It could wrap in
     beginner and not in expert, and a line that appears and disappears is
     precisely the reflow this rule exists to forbid.

     Colours are roles, not picks. The border is --line-strong because here
     the outline IS the control — the same reason the empty to-do punch and
     the unfilled PIN dot use it, and it is the token measured to clear 3:1
     on every ground. The glyph is --paper-dim, the secondary text role,
     measured past 4.5:1 in both themes. audit_contrast.py reads both out of
     this file, so neither can drift quietly. */
  .help-i{
    flex:none;align-self:center;position:relative;
    width:15px;height:15px;padding:0;border-radius:50%;
    border:1px solid var(--line-strong);background:none;
    color:var(--paper-dim);font-family:var(--serif);
    font-size:10px;font-style:italic;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    vertical-align:-2px;
  }
  .help-i:active{border-color:var(--brass);color:var(--brass)}
  /* A 46px-ish tap target bought without one pixel of layout: an invisible
     pad overflowing the 15px dot. Biased right, into the .sec-head rule,
     which is inert — reaching further left would start stealing taps from
     labels that are themselves buttons (Site Notes is one). */
  .help-i::after{content:'';position:absolute;top:-11px;bottom:-11px;left:-6px;right:-14px}
  .sec-head .help-i{margin-left:-2px}
  /* The Calculator's host. .cclear is one button packed right, so an auto
     margin parks the marker at the far left and the gap between them does the
     absorbing — Clear does not move when the marker goes, and the row's
     height is the button's 46px either way. This exists because the title
     could not take the marker: at 320px the ft/in toggle leaves .grow 133.5px
     and "Calculator" is already 133.5px of it, so the h1 wrapped in beginner
     and not in expert. Measured, at width, not eyeballed at desktop. */
  .cclear .help-i{margin-right:auto}
  .sheet{position:relative}
  .help-corner{position:absolute;top:9px;right:12px;z-index:1}
  /* Symmetric and short, because .sheet is overflow:auto — a pad reaching
     past the padding box on the right would invent a horizontal scrollbar. */
  .help-corner::after{left:-11px;right:-11px}
  /* THE ONE RULE. Expert mode is this line and nothing else. */
  :root[data-guide="off"] .help-i{display:none}

  /* ---- Status chip (the punch) ---- */
  .chip{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;padding:4px 9px;border-radius:999px;
    border:1px solid currentColor;white-space:nowrap;
  }
  .chip.todo{color:var(--paper-faint)}
  .chip.doing{color:var(--doing)}
  .chip.done{color:var(--done)}
  .chip.status-active{color:var(--brass)}
  /* CHUNK19_CATEGORY_SYSTEM */
  .chip-filter{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line-soft);
    background:var(--ink-2);color:var(--paper-dim);white-space:nowrap;
  }
  .chip-filter.active{background:var(--brass-fill);color:var(--on-brass);border-color:var(--brass-fill)}
  .cat-badge{font-size:15px;line-height:1;flex:none}
  .chip.status-quoting{color:var(--doing)}
  .chip.status-done{color:var(--done)}

  /* ---- Task row ---- */
  .task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px}
  /* --line-strong, not --line: until it is ticked this box is empty —
     no fill, no glyph, no label — so the outline is the whole control.
     The doing/done states below override the colour anyway. */
  .punch{
    flex:none;width:30px;height:30px;border-radius:8px;margin-top:1px;
    border:1.5px solid var(--line-strong);display:grid;place-items:center;
    color:var(--paper-faint);transition:.12s;
  }
  .punch.doing{border-color:var(--doing);color:var(--doing)}
  .punch.done{border-color:var(--done);color:var(--done);background:var(--done-wash)}
  .punch:active{transform:scale(.92)}
  .punch svg{width:16px;height:16px}
  .task .body{flex:1;min-width:0}
  .task .ttext{line-height:1.35}
  .task.is-done .ttext{color:var(--paper-faint);text-decoration:line-through}
  .task .meta{font-family:var(--mono);font-size:11px;color:var(--paper-faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .task .meta .h-tag{color:var(--brass)}

  /* ---- House card ---- */
  .house-card{padding:0;overflow:hidden}
  .house-cover{
    height:118px;background:var(--ink-2);position:relative;
    display:grid;place-items:center;color:var(--paper-faint);
    background-size:cover;background-position:center;
  }
  .house-cover .blueprint{
    position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .house-cover svg{width:34px;height:34px;position:relative}
  /* ===== SORTED ENGINE — picker grid ===== */
  .sorted-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    margin-top:12px;max-height:60vh;overflow-y:auto;padding-bottom:4px;
  }
  .sorted-cell{
    position:relative;aspect-ratio:1/1;border-radius:var(--radius-sm);
    background:var(--ink-2) center/cover no-repeat;border:1px solid var(--line);
    padding:0;cursor:pointer;overflow:hidden;
  }
  .sorted-cell.is-current{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
  /* Raw and dark on purpose, in both themes: this plate sits on a photo
     thumbnail, and a photo is not chrome. Tokenising it would make the
     badge pale-on-photo in daylight and lose the star. */
  .sorted-star{
    position:absolute;top:5px;right:5px;display:grid;place-items:center;
    width:26px;height:26px;border-radius:50%;
    background:rgba(21,24,29,.72);color:#D7A94B;
  }
  .sorted-star svg{width:16px;height:16px}
  .house-card .hc-body{padding:12px 14px}
  .house-card .hc-name{font-family:var(--serif);font-size:18px;font-weight:600}
  .house-card .hc-addr{font-size:13px;color:var(--paper-dim);margin-top:1px}

  /* ---- Spec stamp ---- */
  .spec-cat{margin-bottom:6px}
  .spec-row{
    display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft);
    align-items:baseline;
  }
  .spec-row:last-child{border-bottom:none}
  .spec-room{
    font-family:var(--mono);font-size:11px;color:var(--paper-dim);
    flex:none;width:74px;text-transform:uppercase;letter-spacing:.06em;
    padding-top:1px;
  }
  .spec-main{flex:1;min-width:0}
  .spec-label{font-size:14px}
  .spec-val{font-family:var(--mono);font-size:13px;color:var(--brass);margin-top:1px;word-break:break-word}
  .spec-note{font-size:12px;color:var(--paper-dim);margin-top:2px}

  /* ---- Photo grid ---- */
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .photo-grid .ph{
    aspect-ratio:1;border-radius:8px;background:var(--ink-2);
    background-size:cover;background-position:center;position:relative;
  }
  /* Also on a photo, also raw in both themes — see .sorted-star. */
  .photo-grid .ph .x{
    position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;
    background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff;
  }
  .photo-grid .ph .x svg{width:14px;height:14px}
  /* CHUNK2_PHOTO_LIBRARY */
  /* The dashes are the affordance here, so they are information too. */
  .photo-add{
    aspect-ratio:1;border:1.5px dashed var(--line-strong);border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--paper-dim);
  }
  .photo-add svg{width:24px;height:24px}
  .photo-add span{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase}

  /* ---- Inputs ---- */
  .field{margin-bottom:12px}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:5px}
  .input,textarea.input,select.input{
    width:100%;background:var(--ink-2);border:1px solid var(--line-soft);
    border-radius:var(--radius-sm);padding:12px 13px;color:var(--paper);
    outline:none;
  }
  .input:focus,textarea.input:focus,select.input:focus{border-color:var(--brass)}
  textarea.input{resize:vertical;min-height:96px;line-height:1.5}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:var(--tap);padding:0 18px;border-radius:12px;font-weight:600;
    background:var(--ink-3);color:var(--paper);border:1px solid var(--line-soft);
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brass-fill);color:var(--on-brass);border-color:var(--brass-fill)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.block{display:flex;width:100%}
  .btn.sm{min-height:38px;padding:0 13px;font-size:14px}
  .btn svg{width:18px;height:18px}

  /* ---- FAB ---- */
  .fab{
    position:fixed;right:18px;z-index:30;
    bottom:calc(var(--tap) + var(--safe-b) + 92px);
    width:58px;height:58px;border-radius:18px;background:var(--brass-fill);color:var(--on-brass);
    display:grid;place-items:center;box-shadow:var(--shadow-pop);
  }
  .fab:active{transform:translateY(1px)}
  .fab svg{width:26px;height:26px}

  /* ---- Bottom nav ---- */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:var(--nav-bg);backdrop-filter:blur(12px);
    border-top:1px solid var(--line-soft);
    padding-bottom:var(--safe-b);
    display:flex;
  }
  .nav button{
    flex:1;min-height:var(--tap);padding:9px 0 7px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--paper-faint);font-size:10.5px;letter-spacing:.04em;
  }
  .nav button.active{color:var(--brass)}
  .nav button svg{width:23px;height:23px}

  /* ---- Sheet / modal ---- */
  /* 80 clears #viewer (60) and #annotate (70), which sheets are legitimately
     opened from, and stays below #lock (100), #vault (110), #camera (115) and
     #vault-busy (120) — the surfaces that must never have a sheet over them. */
  .scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end}
  .sheet{
    background:var(--ink-2);width:100%;max-width:680px;margin:0 auto;
    border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:8px 16px calc(18px + var(--safe-b));max-height:90vh;overflow:auto;
    animation:rise .18s ease-out;
  }
  @keyframes rise{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
  .sheet h2{font-family:var(--serif);font-size:21px;margin:0 0 14px}

  /* ---- Empty states ---- */
  .empty{text-align:center;padding:46px 24px;color:var(--paper-dim)}
  .empty svg{width:40px;height:40px;color:var(--line);margin-bottom:12px}
  /* CHUNK12_STAR_OUTLINE */
  .note-star{display:inline-flex;flex:none;vertical-align:-2px}
  .note-star svg{width:15px;height:15px;display:block}
  /* CHUNK15_CHEVRON_SIZE */
  .chev{display:inline-flex;flex:none;color:var(--paper-faint)}
  .chev svg{width:18px;height:18px;display:block}
  .empty .t{font-family:var(--serif);font-size:18px;color:var(--paper);margin-bottom:4px}

  /* ---- Lock screen ---- */
  #lock{
    position:fixed;inset:0;z-index:100;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;gap:6px;
    /* PIN_STEADY — a centred column that outgrows the viewport pushes its top
       out of reach, and nothing can scroll to it. 'safe center' falls back to
       flex-start exactly when that would happen; the overflow pair keeps the
       scrolling inside this layer instead of the page behind it. */
    overflow-y:auto; overscroll-behavior:contain;
    justify-content:safe center;
  }
  #lock .mark{margin-bottom:10px}
  #lock .mark svg{width:58px;height:58px}
  #lock .name{font-family:var(--serif);font-size:24px}
  #lock .hint{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:18px}
  .dots{display:flex;gap:14px;margin:8px 0 6px}
  /* An unfilled dot is only its outline, and counting the unfilled ones
     is how you know how many digits you have entered. */
  .dots .d{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
  .dots .d.on{background:var(--brass);border-color:var(--brass)}
  .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:14px}
  .keypad button{
    height:72px;border-radius:50%;background:var(--ink-2);font-family:var(--mono);
    font-size:24px;color:var(--paper);border:1px solid var(--line-soft);
    /* PIN_STEADY — manipulation drops the double-tap-zoom gesture, and with it
       the 300ms tap delay and the viewport shuffle that comes with it. */
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
  }
  .keypad button:active{background:var(--ink-3)}
  .keypad button.blank{background:none;border:none}
  /* PIN_STEADY_ERRLINE — min-height:18px reserved the row but fell 0.84px short
     of the 13px/1.45 line box, so the row grew the moment a message appeared and
     the centred column split the growth above and below. Pinning line-height to
     the same 19px the empty box reserves makes the height unconditional. */
  #lock .err{color:var(--danger);font-size:13px;min-height:19px;line-height:19px;margin-top:6px}

  /* PIN_RECOVERY */
  .lock-link{
    margin-top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--paper-dim);text-decoration:underline;
    text-underline-offset:4px;padding:10px 12px;touch-action:manipulation;
  }
  .lock-copy{font-size:14px;line-height:1.62;color:var(--paper-dim);max-width:340px;text-align:center}
  .lock-copy b{color:var(--paper)}
  #lock .lock-field{width:min(340px,86vw)}
  .lock-actions{width:min(340px,86vw);display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .reco-code{
    font-family:var(--mono);font-size:19px;letter-spacing:.16em;color:var(--brass);
    background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;
    padding:15px 12px;margin:14px 0 2px;text-align:center;word-break:break-all;
    -webkit-user-select:all;user-select:all;
  }

  /* CHUNK18_INSTALL_PROMPT */
  #install-banner{
    position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:40;
    background:var(--ink-3);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 10px 12px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow-card);
  }
  #install-banner .txt{flex:1;font-size:13px;line-height:1.4;color:var(--paper-dim)}
  #install-banner .txt b{color:var(--paper);display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}

  /* CHUNK21_BACKUP_NUDGE */
  #backup-banner{
    position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:40;
    background:var(--ink-3);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 10px 12px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow-card);
  }
  #backup-banner .txt{flex:1;font-size:13px;line-height:1.4;color:var(--paper-dim)}
  #backup-banner .txt b{color:var(--paper);display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}


  /* ---- Toast ---- */
  #toast{
    position:fixed;left:50%;transform:translateX(-50%);z-index:200;
    bottom:calc(var(--tap) + var(--safe-b) + 96px);
    background:var(--brass-fill);color:var(--on-brass);font-weight:600;font-size:14px;
    padding:11px 18px;border-radius:12px;box-shadow:var(--shadow-card);
    opacity:0;transition:.2s;pointer-events:none;max-width:84%;text-align:center;
  }
  #toast.show{opacity:1}

  /* CHUNK3_PHOTO_VIEWER */
  #viewer{
    position:fixed;inset:0;z-index:60;background:rgba(6,8,10,.96);
    display:flex;flex-direction:column;
  }
  #viewer .v-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(var(--safe-t) + 10px) 12px 10px;flex:none;
  }
  #viewer .icon-btn{background:rgba(255,255,255,.08)}
  /* CHUNK4_ROTATE_PHOTO */
  #viewer .icon-btn.danger{color:var(--danger)}
  #viewer .v-actions{display:flex;gap:8px}

  /* CHUNK6_PHOTO_ANNOTATE */
  #annotate{
    position:fixed;inset:0;z-index:70;background:rgba(6,8,10,.97);
    display:flex;flex-direction:column;
  }
  #annotate .icon-btn{background:rgba(255,255,255,.08)}
  #annotate .a-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(var(--safe-t) + 10px) 12px 8px;flex:none;

  #annotate .a-title{font-family:var(--serif);font-size:16px;color:var(--paper)}
  #annotate .a-tools{
    display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none;overflow-x:auto;
  }
  .a-tool{
    width:44px;height:44px;border-radius:10px;background:var(--ink-2);color:var(--paper-dim);
    display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none;
  }
  .a-tool.active{background:var(--brass-fill);color:var(--on-brass)}
  .a-tool svg{width:20px;height:20px}
  .a-swatches{display:flex;align-items:center;gap:8px;margin:0 4px;flex:none}
  .a-swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;flex:none}
  .a-swatch.active{border-color:var(--paper)}
  /* CHUNK7_CALLOUT_ANNOTATE */
  .a-shapes .a-tool{font-size:19px}
  #annotate .a-hint{
    text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--paper-faint);padding:8px 12px calc(var(--safe-b) + 10px);flex:none;
  }
  #annotate .a-stage{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;padding:16px;
  }
  #annotate .a-stage canvas{touch-action:none;background:#000;border-radius:4px}
  #viewer .v-count{font-family:var(--mono);font-size:12px;color:var(--paper-dim);letter-spacing:.06em}
  #viewer .v-stage{
    flex:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  #viewer .v-stage img{
    max-width:100%;max-height:100%;object-fit:contain;
    user-select:none;-webkit-user-drag:none;will-change:transform;
    transform:translate(0px,0px) scale(1);
  }
  #viewer .v-hint{
    text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--paper-faint);padding:8px 0 calc(var(--safe-b) + 10px);flex:none;
  }

  /* VAULT_CEREMONY */
  #vault{
    position:fixed;inset:0;z-index:110;background:var(--ink);
    display:flex;flex-direction:column;overflow-y:auto;
    padding:calc(var(--safe-t) + 26px) 22px calc(var(--safe-b) + 26px);
    max-width:680px;margin:0 auto;
  }
  #vault .v-mark{display:grid;place-items:center;color:var(--brass);margin-bottom:14px}
  #vault .v-mark svg{width:46px;height:46px}
  #vault h2{font-family:var(--serif);font-size:23px;margin:0 0 14px;text-align:center}
  #vault .v-copy{font-size:15px;line-height:1.62;color:var(--paper-dim);margin-bottom:20px}
  #vault .v-copy b{color:var(--paper)}
  #vault .v-steps{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--paper-faint);text-align:center;margin-bottom:18px;
  }
  #vault .v-actions{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
  .v-err{color:var(--danger);font-size:13px;min-height:19px;margin:2px 0 6px}
  .v-check{
    display:flex;align-items:flex-start;gap:12px;cursor:pointer;font-size:14px;line-height:1.5;
    background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;
  }
  .v-check input{width:24px;height:24px;flex:none;accent-color:var(--brass);margin-top:1px}
  /* VAULT_EYE — resting and revealed are a deliberate contrast pair, pinned to
     the app's own tokens rather than to inherited or system colours. */
  .pw-wrap{position:relative;display:block}
  .pw-wrap .input{padding-right:52px}
  .pw-eye{
    position:absolute;right:3px;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
    background:none;color:var(--paper-dim);
  }
  .pw-eye:active{background:var(--ink-3)}
  .pw-eye svg{width:20px;height:20px;display:block}
  .pw-eye[aria-pressed="true"]{color:var(--brass)}
  .btn[disabled]{opacity:.38;pointer-events:none}
  .lock-chip{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);
    border-radius:999px;padding:4px 9px;white-space:nowrap;
  }
  .lock-chip svg{width:12px;height:12px}
  .lock-hero{display:inline-grid;place-items:center;color:var(--brass)}
  .lock-hero svg{width:46px;height:46px}
  #vault-busy{
    position:fixed;inset:0;z-index:120;background:rgba(10,12,15,.94);display:flex;

  /* VAULT_CAMERA — in-app viewfinder */
  #camera{
    position:fixed;inset:0;z-index:115;background:#05070a;
    display:flex;flex-direction:column;
  }
  #camera .cam-top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(var(--safe-t) + 10px) 12px 8px;flex:none;

  #camera .cam-title{font-family:var(--serif);font-size:16px;color:var(--paper)}
  #camera .icon-btn{background:rgba(255,255,255,.09)}
  #camera .cam-stage{
    flex:1;position:relative;overflow:hidden;background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  #camera video,#camera .cam-still{
    max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#000;

  #camera .cam-controls{flex:none;padding:10px 12px calc(var(--safe-b) + 14px)}

  }
  .cam-chip.on{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass)}

  .cam-flash{
    width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--paper-dim);
  }
  .cam-flash.on{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass)}
  /* Continuous light gets its own colour as well as its own glyph. */
  .cam-flash.torch{background:var(--paper);border-color:var(--paper);color:var(--ink)}
  .cam-flash svg{width:22px;height:22px}
  #camera .cam-shutter-row{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:4px}
  .cam-shutter{
    width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);
    flex:none;box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .cam-shutter:active{transform:scale(.94)}
  #camera .cam-msg{
    padding:26px 22px;color:var(--paper-dim);font-size:14px;line-height:1.65;
    max-width:560px;margin:0 auto;
  }
  #camera .cam-msg b{color:var(--paper);display:block;font-family:var(--serif);font-size:18px;margin-bottom:8px}
  #camera .cam-warn{
    border-left:2px solid var(--danger);padding-left:12px;margin:14px 0;color:var(--paper-dim);font-size:13px;

    text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--paper-faint);padding-top:8px;
  }

  .hidden{display:none!important}
  hr.div{border:none;border-top:1px solid var(--line-soft);margin:14px 0}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- Measurement widget ---- */
  .meas{display:flex;gap:8px}
  .meas-cell{flex:1;display:flex;flex-direction:column;align-items:center}
  .meas-cell input.meas-box{text-align:center;width:100%}
  .meas-cell label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);margin-top:4px}
  .unit-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
  .unit-toggle button{background:transparent;color:var(--paper-dim);border:0;padding:5px 12px;font-size:12px;font-family:var(--mono);cursor:pointer}
  /* --on-brass, NOT --ink: --ink is the GROUND role, and in daylight the
     ground is the pale one — this read as dark-on-gold only because night
     was the only theme. This single line is the whole role-token lesson. */
  .unit-toggle button.on{background:var(--brass-fill);color:var(--on-brass)}
  /* ---- Calculator ---- */
  .cecho{display:block;font-family:var(--mono);font-size:12px;color:var(--brass);margin-top:5px;min-height:15px}
  .crow{display:flex;gap:8px;margin:4px 0 12px}
  .crow .btn{flex:1;justify-content:center;font-size:20px;padding:8px}
  .cclear{display:flex;justify-content:flex-end;margin:0 0 12px}
  .cresult{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:8px;text-align:center}
  .cresult .muted{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .cbig{font-family:var(--serif);font-size:32px;color:var(--paper);margin-top:6px;line-height:1.1}
  /* ---- Crop editor ---- */
  #crop-stage{cursor:grab}
  #crop-stage:active{cursor:grabbing}
</style>
</head>

/* ---------- storage: localStorage JSON ---------- */
/* EGS durability guard: persist + backup + self-heal + empty-overwrite protection */
(function(){
  const CRIT = ['notebuilt.houses','notebuilt.tasks','notebuilt.notes','notebuilt.settings'];
  const boot = Date.now();
  let _set, _get;
  try { _set = localStorage.setItem.bind(localStorage); _get = localStorage.getItem.bind(localStorage); } catch(e){ return; }
  const blank = v => v==null || v==='' || v==='[]' || v==='{}' || v==='null' || v==='undefined';
  /* self-heal before the app loads its data */
  try { for (const k of CRIT){ const cur=_get(k), bak=_get(k+'_bak'); if (blank(cur) && !blank(bak)) _set(k, bak); } } catch(e){}
  /* guarded saves */
  try {
    localStorage.setItem = function(key, val){
      try {
        if (CRIT.includes(key)){
          const existing = _get(key);
          if (blank(val) && !blank(existing) && (Date.now()-boot) < 8000){
            console.warn('Durability: blocked empty overwrite of '+key+' at startup');
            return;
          }
          if (!blank(val)) { try { _set(key+'_bak', val); } catch(e){} }
        }
      } catch(e){}
      return _set(key, val);
    };
  } catch(e){}
  /* ask the browser not to evict our data (covers IndexedDB photos too) */
  try {
    if (navigator.storage && navigator.storage.persist){
      navigator.storage.persisted().then(p => { if(!p) navigator.storage.persist(); }).catch(()=>{});
    }
  } catch(e){}
})();
const K = { houses:'notebuilt.houses', tasks:'notebuilt.tasks', notes:'notebuilt.notes', settings:'notebuilt.settings', categories:'notebuilt.categories' };
function load(key,fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function save(key,val){ localStorage.setItem(key,JSON.stringify(val)); }
let houses = load(K.houses,[]);
houses.forEach(h=>{ if(!h.category) h.category='construction'; });
let tasks  = load(K.tasks,[]);
let notes  = load(K.notes,[]);
let pendingNoteHouseId=null;
/* settings carries the vault salt and verifier, the PIN, the recovery
   credential and the unlock — the four things in this app that cannot be
   reconstructed from anything else. So an unreadable settings blob must
   never be quietly swapped for defaults: the next write would put those
   defaults over the only copy, which is precisely how a bad launch turns
   into permanent deletion. Missing is a fresh install. Unparseable is an
   emergency, and the two are not the same. */
let settingsUnreadable=false;
function loadSettings(){
  let raw=null;
  try{ raw=localStorage.getItem(K.settings); }catch(e){}
  if(raw==null||raw==='') return { pinHash:null, pinSalt:null };   /* fresh install */
  try{ return JSON.parse(raw); }catch(e){}
  /* The durability guard has been mirroring every good write into a twin.
     Nothing writes settings at startup any more, so that twin is still the
     last good copy at this point rather than a casualty of this launch. */
  try{
    const bak=localStorage.getItem(K.settings+'_bak');
    if(bak){ const v=JSON.parse(bak); console.warn('Notebuilt: settings recovered from the backup copy'); return v; }
  }catch(e){}
  /* Both copies unreadable. Keep what is on disk exactly as it is — it is
     the only remaining evidence — and refuse to write over it. */
  settingsUnreadable=true;
  return { pinHash:null, pinSalt:null };
}
let settings = loadSettings();
if(!settings.sortHouses) settings.sortHouses='updated';
if(!settings.units) settings.units='imperial';

/* ---------- storage schema: a number written, and actually read ----------
   EGS-STD:schema — the §2 row lives here, on the block it describes.

   Two version systems live in this file, and confusing them is the whole
   risk, so they are named apart at every site they appear:

     * NB_SCHEMA_VERSION — the shape of what is IN localStorage on THIS
       device. Written into settings by an ordinary save, read here at
       load, climbed by the ladder below.
     * a backup file's `version` (2 or 3) — the shape of an EXPORTED .json.
       Read by backupManifest(). It describes the FILE, never the device.

   They are never compared and never assigned across. A number written but
   never read is not versioning, it is decoration; this one is read on the
   last line of this block and branched on. */
const NB_SCHEMA_VERSION = 2;

/* The ladder. The key is the version being migrated TO, and the function
   takes the stored shape from key-1 up to key, in place. A rung must be
   safe to run twice. Every future change to what this app writes into
   localStorage MUST add a rung here — that registration is the point of
   the object, not the machinery around it. */
/* A rung runs in memory, because nothing about startup may write. So the
   store it changed has to be written down by the same ordinary save that
   stamps the number, or the number goes out describing a shape that is
   not on disk yet — and the rung, now skipped, never gets another chance.
   A rung that changed something names its store here. `settings` must
   never be named: persist.settings IS the save doing the flushing. */
const nbSchemaDirty=new Set();

const NB_MIGRATIONS = {
  /* 1 -> 2: every project carries a category. Projects made before
     categories existed have none and answer "Uncategorized". The
     unconditional backfill up at `let houses` still stands and is not
     replaced by this: a restore assigns houses directly and never passes
     a load, so removing it would strip the only pass those projects get.
     Which means on today's data this rung finds the work already done —
     it is here as the first real rung, and as the shape the next one
     copies, not as a placeholder. */
  2: function(){
    let changed=0;
    houses.forEach(h=>{ if(!h.category){ h.category='construction'; changed++; } });
    if(changed) nbSchemaDirty.add('houses');
  }
};

/* Absent means the pre-schema shape, v1 — what every device was carrying
   before this build. Anything that is not a sane number reads the same
   way: the conservative answer, never a guess upward. */
function nbSchemaOf(o){
  const v=o&&o.schemaVersion;
  return (typeof v==='number' && isFinite(v) && v>=1) ? Math.floor(v) : 1;
}

/* nbSchemaReached is what the stamp will write: the version the data is
   actually IN, not the one this build aspires to. A rung that throws
   leaves the shape half-done, and stamping that "current" would hide the
   damage from every load afterwards. */
let nbSchemaReached=1;
let schemaFromFuture=false;
function nbApplySchema(from){
  schemaFromFuture = from>NB_SCHEMA_VERSION;
  nbSchemaReached = from;
  /* Newer than this build understands. The rungs that would bring it
     forward do not exist here, so nothing is migrated and nothing is
     converted — the data is left exactly as the newer version left it,
     and its number is carried through untouched so that version still
     recognises its own shape when it comes back. */
  if(schemaFromFuture) return;
  for(let v=from+1; v<=NB_SCHEMA_VERSION; v++){
    try{ const rung=NB_MIGRATIONS[v]; if(rung) rung(); nbSchemaReached=v; }
    catch(e){ console.warn('Notebuilt: migration to schema v'+v+' did not complete',e); break; }
  }
}
/* Read at load. It migrates in memory only — nothing about startup may
   write, so the number waits for the next ordinary save to be stamped. */
nbApplySchema(nbSchemaOf(settings));
/* Omission is not deletion. `unlock` is a purchase and `vault` is the only
   way back into protected projects; neither may be dropped by a write that
   simply did not know about it. An explicit null still switches either off,
   so turning the vault off and restoring a vault-less backup both behave as
   before — only a field that is absent entirely gets carried forward. */
function saveSettings(){
  if(settingsUnreadable) return;          /* never overwrite the damaged original */
  let prev=null;
  try{ prev=JSON.parse(localStorage.getItem(K.settings)||'null'); }catch(e){}
  if(prev){
    if(settings.unlock===undefined && prev.unlock && prev.unlock.activationId) settings.unlock=prev.unlock;
    if(settings.vault===undefined  && prev.vault)  settings.vault =prev.vault;
  }
  /* Whatever a rung changed in memory gets written down BEFORE the number
     that describes it — the stamp follows the data, it never leads it. If
     one of these writes fails, the stamp is held back and this save does
     nothing at all: a number claiming v2 over data still shaped v1 turns a
     retryable failure into a rung skipped forever, which is the one
     outcome worth losing a save to avoid. */
  if(nbSchemaDirty.size){
    try{ for(const name of nbSchemaDirty){ if(name!=='settings' && persist[name]) persist[name](); } }
    catch(e){ console.warn('Notebuilt: migrated data would not persist — the schema number is held back',e); return; }
    nbSchemaDirty.clear();
  }
  /* THE STAMP — here and nowhere else. This function is only ever reached
     from something a person did, which is what keeps the number out of
     startup without needing a guard of its own.

     It writes `nbSchemaReached` and nothing else. That value is derived
     from the data actually in hand — at load, and again at every restore —
     so it is already the truth about the shape being saved. Deferring
     instead to whatever number storage happened to hold a moment ago is
     what left a restored device stuck at a version its data was never in:
     a restore replaces the shape outright, and the old number describes
     data that no longer exists. Downgrade protection does not depend on
     that deferral — when the data really did come from a newer build,
     nbApplySchema read the higher number off the data itself. */
  settings.schemaVersion=nbSchemaReached;
  save(K.settings,settings);
}
const persist = { houses:()=>save(K.houses,houses), tasks:()=>save(K.tasks,tasks),
                  notes:()=>save(K.notes,notes), settings:saveSettings,
                  categories:()=>save(K.categories,categories) };

/* ============================================================
   UNLOCK — the free cap, and the key that lifts it.
   Strings and ids live in UNLOCK (search UNLOCK_CONFIG). This is the
   behaviour, and it is the only part of the app that touches a network.
   ============================================================ */

/* Unlocked means an activation completed — not that a key is present.
   A key typed with no signal leaves the app free, which is what makes the
   retry path safe: there is no half-unlocked state to get stuck in. */
function unlockIsOn(){ return !!(settings.unlock && settings.unlock.activationId); }

/* What this device held the first time the capped build ran, written
   once and never again. Someone already past the cap did not ignore a
   limit — the app changed under them, and the pitch owes them different
   words than a new user gets. Riding settings, it travels in a backup,
   so their standing survives a restore onto a new phone. */
function unlockPriorProjects(){
  if(typeof settings.priorProjects==='number') return settings.priorProjects;
  settings.priorProjects=houses.length; persist.settings();
  return settings.priorProjects;
}

/* Creation only. A restore, a backup import and a shared project all push
   onto houses directly without ever routing through openHouseSheet, so
   they are uncapped by construction rather than by a flag someone has to
   remember. Getting your own data back is not a purchase decision. */
function unlockCanCreateProject(){ return unlockIsOn() || houses.length < UNLOCK.FREE_PROJECTS; }

function unlockActivatedOn(){
  const t=settings.unlock&&settings.unlock.activatedAt;
  if(!t) return '';
  try{ return new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return ''; }
}

/* Forgiving the way the recovery code is forgiving: case and spacing are
   how a human copies something off a screen, and neither counts. Dashes
   are the exception — they are part of the key, so they are rebuilt into
   the canonical shape rather than dropped. Stripping them would turn a
   correct key into a 404. One request goes out, never a fan of guesses. */
function unlockNormalizeKey(s){
  const up=String(s==null?'':s).toUpperCase().replace(/\s+/g,'');
  const core=up.replace(/[^A-Z0-9]/g,'');
  const pre=String(UNLOCK.KEY_PREFIX||'').toUpperCase();
  const group=t=>t.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5');
  /* Typed with the prefix, however the dashes fell. */
  if(pre && core.length===pre.length+32 && core.indexOf(pre)===0) return pre+'-'+group(core.slice(pre.length));
  /* Typed without it — every key this product issues has one, so put it
     back rather than send a request that can only ever be refused. */
  if(core.length===32) return (pre?pre+'-':'')+group(core);
  return up;
}

function unlockErrorDetail(b){
  if(!b) return '';
  if(typeof b.detail==='string') return b.detail;
  if(Array.isArray(b.detail)&&b.detail.length&&b.detail[0]&&b.detail[0].msg) return String(b.detail[0].msg);
  return typeof b.error==='string'?b.error:'';
}

/* A spend that outlived its session. Its own tiny key: settings is the
   write that fails first under pressure, and the durability guard mirrors
   every CRIT key into a `_bak` twin, so putting this there would double
   exactly the cost that is already too high. */
const UNLOCK_SPENT_KEY='notebuilt.unlockSpent';
function unlockSpentBefore(){
  try{ const v=JSON.parse(localStorage.getItem(UNLOCK_SPENT_KEY)||'null'); return (v&&v.at)?v:null; }
  catch(e){ return null; }
}

/* The endpoint that fits a key carrying no activation limit. Polar refuses
   /activate outright for such a key, and validation is what its own docs
   point at instead. Returns the license record only when the server states
   the key is granted, so nothing here is taken on trust: a disabled or
   revoked key answers with some other status and unlocks nothing.
   increment_usage is deliberately absent — a key with a usage allowance
   must not have it spent down by unlocking. */
async function unlockValidate(key){
  let res;
  try{
    res=await fetch(UNLOCK.API_BASE+'/v1/customer-portal/license-keys/validate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ key:key, organization_id:UNLOCK.ORG_ID })
    });
  }catch(e){ return null; }
  if(!res.ok) return null;
  let b=null; try{ b=await res.json(); }catch(e){}
  if(b && b.status==='granted') return b;
  return null;
}

/* Set the moment the server returns a 2xx, and never cleared. One
   activation can be spent per session; the UI may be wrong about what
   happened, but the money cannot be spent twice on account of it. */
let unlockSpent=false;

/* Both copies of settings were unreadable. The app is running on defaults
   and refusing to save any of them, so nothing is being made worse — but
   the vault, the PIN and the unlock are all in that file, and staying quiet
   about it is how someone discovers it months later. */
if(settingsUnreadable){
  /* Noticed at all, without blocking the app the way a modal at launch
     would. The lasting surface is the card in Settings below — this state
     does not go away until a backup is restored, so the notice should not
     either. */
  setTimeout(()=>{ try{ toast('Saved settings could not be read \u2014 see Settings'); }catch(e){} }, 1800);
}

/* The data was written by a newer Notebuilt than this one. Nothing was
   migrated and nothing was stamped down — but this build may not show
   everything the newer one stored, and that is not a thing to stay quiet
   about. Same shape of notice as above: a toast now, and a card in
   Settings that lasts as long as the state does. The two cannot both be
   true — unreadable settings carry no version to be from the future. */
if(schemaFromFuture){
  setTimeout(()=>{ try{ toast('This data is from a newer Notebuilt \u2014 see Settings'); }catch(e){} }, 1800);
}

/* Write it, then read it straight back. A settings write that throws, or
   that silently fails to land, must never pass for a recorded purchase:
   the activation behind it is already spent and cannot be spent twice. The
   reason is carried out verbatim, because "it did not save" is a support
   ticket and "QuotaExceededError" is a fix. */
function unlockPersistVerified(){
  try{ persist.settings(); }
  catch(e){ return {ok:false, why:(e&&e.name)||'the write failed'}; }
  try{
    const back=JSON.parse(localStorage.getItem(K.settings)||'null');
    if(!(back && back.unlock && back.unlock.activationId)) return {ok:false, why:'it did not persist'};
  }catch(e){ return {ok:false, why:(e&&e.name)||'it could not be read back'}; }
  return {ok:true};
}

/* THE ONLY NETWORK CALL IN THIS APP. It happens when a person taps
   Activate, and at no other moment — not at launch, not on a timer, not
   to re-check afterwards. Nothing about the person or their data is sent:
   the body is the key, the organisation id, and a fixed label. */
async function unlockActivate(rawKey){
  const key=unlockNormalizeKey(rawKey);
  if(!key) return {ok:false, kind:'empty'};
  /* An activation has already been spent in this session. Whatever the
     screen says, another request can only spend another one. */
  if(unlockSpent) return {ok:false, kind:'spent'};
  /* Asked while plainly offline, say so without a doomed request first. */
  if(navigator.onLine===false) return {ok:false, kind:'offline'};
  let res;
  try{
    res=await fetch(UNLOCK.API_BASE+'/v1/customer-portal/license-keys/activate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ key:key, organization_id:UNLOCK.ORG_ID, label:UNLOCK.LABEL })
    });
  }catch(e){ return {ok:false, kind:'offline'}; }
  let body=null; try{ const raw=await res.text(); body=raw?JSON.parse(raw):null; }catch(e){}
  /* A 2xx means the server has already spent one of the activations. That
     is the fact that matters and it is true whatever the body turns out to
     look like, so success is decided on the status and the id is dug out
     afterwards, best effort. Deciding it on a field name instead is how a
     paid activation gets discarded and the customer invited to buy the
     next one with another slot. */
  if(res.ok){
    /* Latched before anything below can throw, because from here a slot is
       gone whether or not the rest of this function succeeds. */
    unlockSpent=true;
    /* Before the settings write, and independent of whether that survives:
       this is the record that stops the next launch spending another. */
    try{ localStorage.setItem(UNLOCK_SPENT_KEY, JSON.stringify({at:now()})); }catch(e){}
    const id=(body && (body.id || body.activation_id || (body.activation && body.activation.id))) || null;
    settings.unlock={ key:key, activationId:(id || 'unrecorded-'+now()), activatedAt:now() };
    if(!id) settings.unlock.idMissing=true;
    /* Kept in memory above whatever happens below: the session was paid
       for and works now, even if this device refuses to remember it. */
    const wrote=unlockPersistVerified();
    if(!wrote.ok) return {ok:false, kind:'unstored', why:wrote.why};
    return {ok:true, idMissing:!id};
  }
  const det=unlockErrorDetail(body);
  const t=det.toLowerCase();
  /* Status only where it means one thing on its own. */
  if(res.status===404) return {ok:false, kind:'unknown'};
  if(res.status===422) return {ok:false, kind:'malformed', detail:det};
  if(res.status>=500)  return {ok:false, kind:'server', detail:det, status:res.status};
  /* Polar answers 403 NotPermitted for a whole family of refusals — a spent
     key, a disabled one, a revoked benefit. Reading the status alone told a
     customer with a GRANTED 0/3 key that they were out of devices, and told
     them to stop trying. So the limit message is reachable only when the
     server actually says limit. */
  if(/activation limit|limit already reached|limit reached/.test(t))
    return {ok:false, kind:'limit', detail:det};
  /* Not a limit. The most likely reason by far is that this key carries no
     activation limit at all, in which case /activate was never the right
     call and validation is. Ask the server directly rather than guessing
     from the wording: it unlocks only if it answers "granted", so a
     disabled or revoked key falls through to the honest message below. */
  const lic=await unlockValidate(key);
  if(lic){
    settings.unlock={ key:key, activationId:'validated-'+(lic.id||now()),
                      activatedAt:now(), viaValidation:true };
    const wrote=unlockPersistVerified();
    if(!wrote.ok) return {ok:false, kind:'unstored', why:wrote.why};
    return {ok:true, viaValidation:true};
  }
  if(/revoked|disabled|not active|inactive|no longer valid|expired/.test(t))
    return {ok:false, kind:'inactive', detail:det};
  /* Refused for a reason we have not learned to name. Say so, and show what
     was said, rather than reaching for the nearest message that fits. */
  return {ok:false, kind:'refused', detail:det, status:res.status};
}

function unlockErrorText(r){
  if(r.kind==='empty')   return 'Enter the key from your email.';
  if(r.kind==='offline') return 'Activating needs the internet for a moment — the one time Notebuilt ever asks. Your key is still here: tap Try again once you are back online.';
  if(r.kind==='unknown') return 'That key was not recognised. Copy the whole line out of the email, dashes and all.';
  if(r.kind==='malformed') return 'The server could not read that as a key. Copy the whole line out of the email — it should look like '+((UNLOCK.KEY_PREFIX?UNLOCK.KEY_PREFIX+'-':'')+'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX')+'. Nothing was used up.';
  if(r.kind==='server')   return 'The activation server is having trouble right now (error '+(r.status||'5xx')+')'+(r.detail?' — '+r.detail:'')+'. Nothing was used up. Try again in a minute.';
  if(r.kind==='inactive') return 'The server says this key is not currently active'+(r.detail?' \u2014 \u201c'+r.detail+'\u201d':'')+'. Nothing was used up. If it was just re-enabled, give it a moment and tap again; if it stays this way, contact EGS with the email you bought it with.';
  if(r.kind==='refused')  return 'The server refused the activation'+(r.status?' (error '+r.status+')':'')+(r.detail?' \u2014 \u201c'+r.detail+'\u201d':'')+'. Nothing was used up. Tap again if you like; if it keeps saying this, send that message to EGS and it will be diagnosed from it.';
  if(r.kind==='spent')    return 'An activation was already used a moment ago, so Notebuilt will not send another — that would spend a second one for nothing. Close the app, reopen it, and look at Settings: if the Unlock row says Unlocked, you are done. If it still says Free, write your key down and contact EGS.';
  if(r.kind==='unstored') return 'Your key worked — the server accepted it and this device is unlocked now. But it could not be saved here ('+(r.why||'unknown reason')+'), so it may not survive closing the app. Do NOT tap Activate again: that would spend another activation for nothing. Write your key down, then reopen and check Settings — if it still says Free, contact EGS before trying again.';
  if(r.kind==='crashed')  return 'Something went wrong after the request was sent, so it is not certain whether an activation was used'+(r.detail?' ('+r.detail+')':'')+'. Do not tap again yet. Close this, open Settings, and look at the Unlock row — if it says Unlocked, you are done.';
  if(r.kind==='limit')   return 'This key has already been activated on all of its devices. You do not need a second one — restoring a Notebuilt backup carries the unlock across without using a slot.';
  /* Nothing routes here any more — every refusal is named above — but a
     future kind must not inherit a reassuring sentence by accident. */
  return 'Could not activate just now'+(r.detail?' — '+r.detail:(r.status?' (error '+r.status+')':''))+'. Nothing was used up; your key is still here.';
}

/* Where to come back to when the privacy page is closed: the view that was
   underneath, what the person was in the middle of, and anything they had
   already typed. Cleared by go(), so walking off via the nav bar drops it
   rather than reopening a sheet somewhere it does not belong. */
let _unlockReturn=null;
function unlockOpenPrivacy(resume){
  const key=(function(){ const el=$mr.querySelector('#u-key'); return el?el.value:''; })();
  const from={ name:view.name, param:view.param };
  closeSheet();
  go('privacy');
  _unlockReturn={ from, resume:!!resume, key:key||'' };   /* set AFTER go(), which clears it */
}
function unlockReturnFromPrivacy(){
  const r=_unlockReturn; if(!r) return false;
  _unlockReturn=null;
  go(r.from.name, r.from.param);
  /* Typed text outranks the pitch: if they had a key in hand, put them back
     in front of it. The link only exists on the pitch today, so this is
     dormant until it is not. */
  if(r.key) unlockKeySheet(r.key, r.resume); else unlockPitch(r.resume);
  return true;
}

/* resume=true means they were stopped mid-action at the cap, so finishing
   the unlock should hand back the thing they were trying to do. */
function unlockPitch(resume){
  const free=UNLOCK.FREE_PROJECTS;
  const grand=unlockPriorProjects()>free;
  const head=grand?'Your projects are yours — free, forever':'Unlock unlimited projects';
  const lead=grand
    ? 'You have <b style="color:var(--paper)">'+houses.length+' projects</b>, from before Notebuilt had a limit. They stay yours forever, free — nothing here locks, hides or expires.<br><br>'
      +'Unlocking removes the '+free+'-project cap on new ones.'
    : 'Notebuilt is free for '+free+' projects'+(houses.length===free?', and you are using all '+free+'.':', and you have '+houses.length+'.')+'<br><br>'
      +'Unlocking gives you as many as you like. Everything else — photos, the vault, backups, the calculator — is already yours and always was.';
  sheet('<h2>'+head+'</h2>'
    +'<div class="muted" style="font-size:13.5px;line-height:1.62">'+lead+'<br><br>'
      +'<b style="color:var(--paper)">'+esc(UNLOCK.PRICE)+', once.</b> No subscription, no account \u2014 just an email at checkout so your key can reach you.<br><br>'
      +'Activating asks the internet for a moment, one time. After that Notebuilt never contacts anything again — it is not re-checked at launch, or ever.<br><br>'
      +'Your key is kept in your settings, so it travels inside your backup. Restore that onto your next phone and it is still unlocked.'
    +'</div>'
    /* Tertiary on purpose: body size, muted, and not a fourth button
       competing with the three real choices below it. */
    +'<button type="button" data-unlock-privacy style="display:block;margin:12px 0 0;padding:0;border:0;background:none;'
    +'font:inherit;font-size:13.5px;color:var(--paper-dim);text-decoration:underline;cursor:pointer">'
    +'Read the full privacy promise \u2192</button>'
    +(UNLOCK.EXTERNAL_PURCHASE
        ? '<a class="btn primary block" style="margin-top:14px;text-decoration:none" href="'+esc(UNLOCK.CHECKOUT_URL)+'" target="_blank" rel="noopener noreferrer">Unlock — '+esc(UNLOCK.PRICE)+'</a>'
        : '')
    +'<button class="btn block" data-unlock-key style="margin-top:10px">I already have a key</button>'
    +'<button class="btn block" data-unlock-later style="margin-top:10px">Not now</button>');
  $mr.querySelector('[data-unlock-key]').onclick=()=>unlockKeySheet('',resume);
  $mr.querySelector('[data-unlock-later]').onclick=()=>closeSheet();
  $mr.querySelector('[data-unlock-privacy]').onclick=()=>unlockOpenPrivacy(resume);
}

function unlockKeySheet(prefill,resume){
  /* An activation already went out from this device and was never recorded.
     Say so before the tap, not after it. */
  const spent=(!unlockIsOn() && unlockSpentBefore());
  let spentOn='';
  if(spent){ try{ spentOn=new Date(spent.at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){} }
  sheet('<h2>Enter your key</h2>'
    +(spent?'<div class="card" style="background:var(--ink-2);margin-bottom:12px"><div class="muted" style="font-size:13px;line-height:1.6">An activation was already used from this device'+(spentOn?' on '+esc(spentOn):'')+', but it was never saved here. Your key has a limited number of activations, and tapping Activate will spend another one.<br><br>If Settings still shows <b style="color:var(--paper)">Free</b>, contact EGS before spending it — the used one can be released instead.</div></div>':'')
    +'<div class="muted" style="font-size:13px;line-height:1.6;margin-bottom:12px">It arrives by email as soon as you buy. Capitals, spaces and dashes do not matter.</div>'
    +'<div class="field"><input class="input" id="u-key" placeholder="'+(UNLOCK.KEY_PREFIX?UNLOCK.KEY_PREFIX+'-':'')+'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" value="'+esc(prefill||'')+'"></div>'
    +'<div class="err" id="u-err"></div>'
    +'<button class="btn primary block" id="u-go" style="margin-top:12px">Activate</button>'
    +'<button class="btn block" id="u-back" style="margin-top:10px">Back</button>');
  const inp=$mr.querySelector('#u-key'), err=$mr.querySelector('#u-err'), go=$mr.querySelector('#u-go');
  setTimeout(()=>inp.focus(),50);
  $mr.querySelector('#u-back').onclick=()=>unlockPitch(resume);
  go.onclick=async()=>{
    err.textContent='';
    go.disabled=true; go.textContent='Activating\u2026';
    /* Nothing below may throw its way out of this handler. An exception
       here leaves the button stuck mid-spin with no message, which reads as
       a dead tap — and a dead tap is what makes a person close the sheet
       and spend another activation. */
    let r;
    try{ r=await unlockActivate(inp.value); }
    catch(e){ r={ok:false, kind:'crashed', detail:(e&&(e.name||e.message))||'unexpected error'}; }
    if(r.ok){
      /* A render fault must not make a stored, paid unlock look like
         nothing happened. */
      try{ closeSheet(); render(); }catch(e){}
      unlockThanks(resume,r);
      return;
    }
    /* A refusal that never reached a successful activation is safe to
       retry, and still offers it. One that did is not: the slot is already
       spent, so the button is retired instead of re-armed. */
    if(r.kind==='unstored' || r.kind==='crashed' || r.kind==='spent'){
      go.disabled=true; go.textContent='Do not tap again';
      err.textContent=unlockErrorText(r);
      return;
    }
    /* The typed key stays in the field. Losing it to an error message is
       how a person gives up on a thing they have already paid for. */
    go.disabled=false; go.textContent=(r.kind==='offline')?'Try again':'Activate';
    err.textContent=unlockErrorText(r);
    inp.focus();
  };
}

function unlockThanks(resume,info){
  /* Recorded, working, and honest about the one thing that was odd. */
  const quirk=(info&&info.idMissing)
    ? '<br><br>Recorded on this device, though the server did not send back an activation reference. Worth mentioning to EGS if you ever need support.'
    : '';
  sheet('<h2>Unlocked</h2>'
    +'<div class="muted" style="font-size:13.5px;line-height:1.62">'
      +'Unlimited projects, from now on.<br><br>'
      +'That was the only time Notebuilt will contact anything. It will not check again — not at launch, not ever.<br><br>'
      +'Your key sits in your settings, so your next backup carries it. Restore that onto a new phone and it stays unlocked, without spending an activation.<br><br>'
      +'Thank you — this is what keeps EGS building.'+quirk
    +'</div>'
    +'<button class="btn primary block" id="u-done" style="margin-top:14px">'+(resume?'New project':'Done')+'</button>');
  $mr.querySelector('#u-done').onclick=()=>{ closeSheet(); if(resume) openHouseSheet(); };
}

/* Deliberately NOT called at startup. It writes, and a write at startup is
   what turned an unreadable settings blob into a deleted one: the fallback
   defaults have no priorProjects, so this fired on the first bad launch and
   persisted them over the real record. It stamps lazily instead — from the
   pitch, which is user-initiated, and from importData for a restored file.
   Nothing about the app's startup may write settings. */

const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const now = ()=> Date.now();
const todayKey = (d=new Date())=> d.toISOString().slice(0,10);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   EGS-STD:themes — day, night, and follow-the-phone
   ============================================================
   The <head> script did the part that matters for the first frame. Nothing
   in this block runs early enough to prevent a flash of the wrong theme;
   this half is the toggle, and keeping the status bar in step.

   nbThemeMode() is a pure read and is safe to call at any time. The only
   writer is nbSetTheme below, and only a tap reaches it — startup never
   does. A fix-script guard pins that: the name may appear exactly twice in
   the file, its definition and its one call site. */
const NB_THEME_KEY='notebuilt.theme';
function nbThemeMode(){
  try{ const m=localStorage.getItem(NB_THEME_KEY); return (m==='light'||m==='dark')?m:'system'; }
  catch(e){ return 'system'; }
}
const NB_THEME_LABEL={light:'Day',dark:'Night',system:'Auto'};
/* What the phone would show right now, which is only the same as the mode
   when the mode is not 'system'. Absent matchMedia, night — the identity. */
function nbThemeIsDark(){
  const m=nbThemeMode();
  if(m!=='system') return m==='dark';
  return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}
/* Colours come from the CSS; the status bar is the one thing that cannot,
   so it is set here from the same NB_THEME_BAR the first frame used. */
function nbApplyTheme(){
  document.documentElement.setAttribute('data-theme',nbThemeMode());
  const bar=window.NB_THEME_BAR||{dark:'#15181D',light:'#F6F3EC'};
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', nbThemeIsDark()?bar.dark:bar.light);
}
function nbSetTheme(mode){
  if(mode!=='light'&&mode!=='dark') mode='system';
  try{ localStorage.setItem(NB_THEME_KEY,mode); }catch(e){}
  nbApplyTheme();
}
/* Following a live OS switch is the stylesheet's job — data-theme stays
   'system' and the media query re-evaluates on its own. This listener is
   here only for the status bar, which no media query can reach. */
if(window.matchMedia){
  const nbMQ=window.matchMedia('(prefers-color-scheme: light)');
  const nbOnSystemChange=()=>{ if(nbThemeMode()==='system') nbApplyTheme(); };
  if(nbMQ.addEventListener) nbMQ.addEventListener('change',nbOnSystemChange);
  else if(nbMQ.addListener) nbMQ.addListener(nbOnSystemChange);
}

/* ============================================================
   EGS-STD:infomode — beginner ⇄ expert, and the (i) markers
   ============================================================
   The stylesheet does the hiding (search .help-i for why). This half is the
   preference, the markers, the sheet they open, and the copy itself.

   Its own key, not settings, for the same reason the theme has one: this
   describes the PHONE, not the data. A backup restored onto a mate's tablet
   should not decide whether he gets the explanations. Absent means ON, which
   is what makes "existing installs default to beginner too" free — there is
   nothing to migrate, because there was never anything written.

   Startup reads and never writes. nbGuideApply() sets a DOM attribute, which
   is not storage; the only writers are nbGuideSet and the notice's dismiss,
   and a tap is the only way to either. */
const NB_GUIDE_KEY='notebuilt.beginner';
const NB_GUIDE_NOTICE_KEY='notebuilt.guideNoticeSeen';
function nbGuideOn(){
  try{ return localStorage.getItem(NB_GUIDE_KEY)!=='off'; }catch(e){ return true; }
}
function nbGuideApply(){
  document.documentElement.setAttribute('data-guide', nbGuideOn()?'on':'off');
}
function nbGuideSet(on){
  try{ localStorage.setItem(NB_GUIDE_KEY, on?'on':'off'); }catch(e){}
  nbGuideNoticeDismiss(true);      /* they found the switch; stop pointing at it */
  nbGuideApply();
}
nbGuideApply();

/* One line, once, for the phones that already had Notebuilt before markers
   existed. A fresh install never sees it — beginner mode IS the fresh
   install, and being told about a change you did not experience is noise.
   In flow, inside the page, so it can never stack with the install banner or
   the backup nudge, which are both fixed to the bottom of the screen. */
function nbGuideNoticeDue(){
  if(!nbGuideOn()) return false;
  try{
    if(localStorage.getItem(NB_GUIDE_NOTICE_KEY)) return false;
    if(localStorage.getItem(NB_GUIDE_KEY)) return false;   /* already chose, once */
  }catch(e){ return false; }
  return !!(houses.length||notes.length||tasks.length);     /* an existing install */
}
function nbGuideNoticeHtml(){
  if(!nbGuideNoticeDue()) return '';
  return '<div class="wrap"><div class="card row" style="margin:12px 0 0;align-items:flex-start">'
    +'<div class="grow muted" style="font-size:13px;line-height:1.55">New here: the small '
    +'<b style="color:var(--paper)">i</b> marks explain what each part of the app does. '
    +'Turn them off any time — Settings, under Guide.</div>'
    +'<button class="icon-btn" data-guide-notice-x aria-label="Got it" style="width:36px;height:36px;flex:none">'+I.x+'</button>'
    +'</div></div>';
}
function nbGuideNoticeDismiss(silent){
  try{ localStorage.setItem(NB_GUIDE_NOTICE_KEY,'1'); }catch(e){}
  if(!silent) render();
}

/* The marker. Two shapes, one behaviour — nbHelpMark goes in flow where the
   host has slack, nbHelpCorner is pinned in a sheet's corner where it does
   not. Both carry the key and nothing else; the copy is looked up at tap. */
function nbHelpMark(key){
  return '<button type="button" class="help-i" data-help="'+esc(key)+'" aria-label="What is this?">i</button>';
}
function nbHelpCorner(key){
  return '<button type="button" class="help-i help-corner" data-help="'+esc(key)+'" aria-label="What is this?">i</button>';
}
/* Called with $app from bind(), and with $mr from sheet(). Nowhere else has
   markers, and nothing else needs to know they exist. */
function nbHelpBind(root){
  if(!root) return;
  root.querySelectorAll('.help-i[data-help]').forEach(b=>b.onclick=ev=>{
    /* Half these markers sit on hosts that are themselves buttons — the Site
       Notes heading, a settings row that navigates. The marker wins its own
       tap and the host never sees it. */
    ev.preventDefault(); ev.stopPropagation();
    nbHelpSheet(b.dataset.help);
  });
}
/* Layered, not swapped. $mr holds exactly one sheet, so drawing help through
   sheet() would destroy the sheet the marker was tapped in — you would ask
   what Share does and lose the share screen answering it. This appends its
   own scrim above whatever is there and removes only its own node. */
function nbHelpSheet(key){
  const copy=HELP_COPY[key]; if(!copy) return;
  const el=document.createElement('div');
  el.className='scrim help-scrim';
  el.style.zIndex='81';                    /* one above .scrim, under the lock */
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'
    +'<h2>'+esc(HELP_TITLE[key]||'About this')+'</h2>'
    +'<div class="muted" style="font-size:13.5px;line-height:1.62">'
    +esc(copy).replace(/\n\n/g,'<br><br>')+'</div>'
    +'<button class="btn block" data-help-close style="margin-top:16px">Got it</button></div>';
  document.body.appendChild(el);
  const close=()=>{ if(el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener('click',ev=>{ if(ev.target===el) close(); });
  el.querySelector('[data-help-close]').onclick=close;
}

/* ---------- the copy ----------
   Moved here from the recovery-code section, where the first four entries
   were parked with a note saying they were "planted now so info mode
   inherits it". This is the inheritance.

   Two of them are read by things that are not markers and must keep their

   'photo-send' is the long version of the two lines the send sheet already
   shows. Both are reached by a marker as well.

   Plain paragraphs, split on a blank line. No markup: nbHelpSheet escapes
   every entry before it draws it, so a stray < in a future edit cannot turn
   into a tag. */
const HELP_TITLE={

  'projects':'Projects',
  'categories':'Categories',
  'photos':'Photos',
  'photo-send':'Sending a photo out',
  'notes':'Notes',
  'calc':'Calculator',
  'applock':'App lock',
  'pin-recovery':'If you forget your PIN',
  'vault':'Protected projects',
  'backup':'Backup, export and restore',
  'import-project':'Import a shared project',
  'share':'Share a project',
  'theme':'Theme',
  'unlock':'Free, and unlocking'
};
