/* ---------- IndexedDB for photos (blobs, never uploaded) ---------- */
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('notebuilt',1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'}); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
async function photoPut(rec){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').put(rec); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function photoGet(id){ const d=await db(); return new Promise((res,rej)=>{ const r=d.transaction('photos','readonly').objectStore('photos').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function photoDel(id){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function photoAll(){ const d=await db(); return new Promise((res,rej)=>{ const out=[]; const c=d.transaction('photos','readonly').objectStore('photos').openCursor(); c.onsuccess=e=>{const cur=e.target.result; if(cur){out.push(cur.value);cur.continue();}else res(out);}; c.onerror=()=>rej(c.error); }); }

/* downscale to <=1000px longest edge, JPEG ~0.8, return Blob */
/* VAULT_CAMERA — capture presets. The preset governs only how big the single
   stored blob is allowed to be; the storage model is unchanged. Standard is
   the ceiling this app has always used. */
const PHOTO_PRESETS = {
  standard:{ label:'Standard', maxEdge:1000,     quality:0.8,
             hint:'Everyday job documentation. Small files, quick backups.' },
  max:     { label:'Max',      maxEdge:Infinity, quality:0.92,
             hint:'The most the device will give. Much larger files.' }
};
function photoPresetKey(){ return PHOTO_PRESETS[settings.photoPreset] ? settings.photoPreset : 'standard'; }

/* maxEdge/quality default to the original hardcoded values, so every existing
   caller behaves exactly as before. */
function downscale(file, maxEdge, quality){
  const cap = maxEdge || 1000;
  const q   = quality || 0.8;
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>cap||h>cap){ const s=cap/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?res(b):rej(new Error('encode failed')); },'image/jpeg',q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

/* One place that decides how a captured or imported image is sized before it
   goes down the write path. alreadyJpeg is true for our own canvas/ImageCapture
   output, which at Max is passed through untouched rather than re-encoded. */
async function preparePhotoBlob(src, presetKey, alreadyJpeg){
  const p = PHOTO_PRESETS[presetKey] || PHOTO_PRESETS.standard;
  if(p.maxEdge===Infinity && alreadyJpeg) return src;
  return downscale(src, p.maxEdge, p.quality);
}
const _objUrls=new Map();

/* ============================================================
   VAULT_CORE — Protected Projects
   A protected project's contents are encrypted at rest under a passphrase
   that is NOT the app PIN. The key exists only in memory, only while the
   vault is unlocked. There is no recovery and no backdoor — by design.
   ============================================================ */
const VAULT_ITER = 600000;                          /* PBKDF2 rounds */
const VAULT_VERIFIER_TEXT = 'notebuilt-vault-ok';
const VAULT_IDLE_MS = 15*60*1000;                   /* idle auto-relock */
const VAULT_MIN_PASS = 8;

let _vaultKey = null;             /* CryptoKey — memory only, never persisted */
let _vaultCache = new Map();      /* iv -> plaintext. Wiped on relock. */
let _vaultUrlIds = new Set();     /* photo ids whose object URL came from ciphertext */
let _vaultIdleTimer = null;
let _vaultLoading = null;

/* ---------- base64 <-> bytes (chunked: a 1000px JPEG blows the arg limit) ---------- */
function b64FromBytes(buf){
  const b = (buf instanceof Uint8Array) ? buf : new Uint8Array(buf);
  let s='';
  for(let i=0;i<b.length;i+=8192) s += String.fromCharCode.apply(null, b.subarray(i,i+8192));
  return btoa(s);
}
function bytesFromB64(s){
  const bin=atob(s); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}

/* An encrypted value is an OBJECT where a STRING used to be. That makes the
   test unambiguous, and it makes a half-migrated project self-describing —
   which is what lets an interrupted encrypt-in-place simply be re-run. */
function isEnc(v){ return !!v && typeof v==='object' && v.enc===1 && typeof v.iv==='string'; }
function isEncPhoto(rec){ return !!rec && rec.enc===1 && !!rec.ct; }

function vaultUnlocked(){ return !!_vaultKey; }
function vaultExists(){ return !!(settings.vault && settings.vault.salt && settings.vault.verifier); }
function isProtected(houseId){ const h=houseById(houseId); return !!(h && h.protected); }

async function vaultDeriveKey(pass, saltB64){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:bytesFromB64(saltB64), iterations:VAULT_ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}

/* A fresh random IV on EVERY write. Never reused. */
async function vaultSealBytes(bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _vaultKey, bytes);
  return { iv:b64FromBytes(iv), ct };
}
async function vaultOpenBytes(ivB64, ct){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:bytesFromB64(ivB64)}, _vaultKey, ct);
}
async function vaultSealText(str){
  const r = await vaultSealBytes(new TextEncoder().encode(str==null?'':String(str)));
  return { enc:1, iv:r.iv, ct:b64FromBytes(r.ct) };
}
async function vaultOpenText(rec){
  return new TextDecoder().decode(await vaultOpenBytes(rec.iv, bytesFromB64(rec.ct)));
}
/* Seal only what isn't sealed already — the idempotence that makes resume safe. */
async function vaultSealField(v){ return isEnc(v) ? v : vaultSealText(v==null?'':String(v)); }
async function vaultOpenField(v){ return isEnc(v) ? vaultOpenText(v) : (v==null?'':String(v)); }

/* BACKUP_V3 — the same seal and open, against a key handed in rather than the
   one in memory. A restore has to hold TWO vault keys at once — the backup
   file's and this device's — and neither may disturb _vaultKey, because what
   is on screen still belongs to the data set being replaced. */
async function vaultOpenTextWith(key, rec){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytesFromB64(rec.iv)}, key, bytesFromB64(rec.ct));
  return new TextDecoder().decode(pt);
}
async function vaultSealTextWith(key, str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
                new TextEncoder().encode(str==null?'':String(str)));
  return { enc:1, iv:b64FromBytes(iv), ct:b64FromBytes(ct) };
}
/* Resolves to a CryptoKey iff the passphrase opens THAT vault block — the
   backup's or the device's, whichever is passed. A wrong passphrase is an
   answer, not an exception. */
async function vaultKeyFor(pass, block){
  if(!block || !block.salt || !block.verifier) return null;
  try{
    const k = await vaultDeriveKey(pass, block.salt);
    if(await vaultOpenTextWith(k, block.verifier) !== VAULT_VERIFIER_TEXT) return null;
    return k;
  }catch(e){ return null; }
}

/* ---------- reading encrypted text from synchronous renderers ----------
   The renderers are synchronous string builders; decryption is not. Rather
   than rewrite them, warm a cache for one project and re-render — the same
   shape hydratePhotos() already uses. Keyed by IV, which is unique per record
   per write, so the cache self-invalidates the moment a value is re-encrypted. */
function vt(v){
  if(!isEnc(v)) return v==null?'':v;
  const hit=_vaultCache.get(v.iv);
  return hit==null?'':hit;
}
function vaultNeeds(v){ return isEnc(v) && !_vaultCache.has(v.iv); }
function vaultPendingFor(houseId){
  const h=houseById(houseId); if(!h) return false;
  return vaultNeeds(h.address) || vaultNeeds(h.notes)
    || (h.specs||[]).some(s=>vaultNeeds(s.room)||vaultNeeds(s.label)||vaultNeeds(s.value)||vaultNeeds(s.note))
    || notes.some(n=>n.houseId===houseId && (vaultNeeds(n.title)||vaultNeeds(n.body)))
    || tasks.some(t=>t.houseId===houseId && vaultNeeds(t.text));
}
/* Decrypt ONE project's text on demand. Never a bulk decrypt of the vault. */
async function vaultLoadProject(houseId){
  if(!vaultUnlocked()) return;
  const h=houseById(houseId); if(!h) return;
  const vals=[];
  const collect=v=>{ if(vaultNeeds(v)) vals.push(v); };
  collect(h.address); collect(h.notes);
  (h.specs||[]).forEach(s=>{ collect(s.room); collect(s.label); collect(s.value); collect(s.note); });
  notes.forEach(n=>{ if(n.houseId===houseId){ collect(n.title); collect(n.body); } });
  tasks.forEach(t=>{ if(t.houseId===houseId) collect(t.text); });
  for(const v of vals){
    try{ _vaultCache.set(v.iv, await vaultOpenText(v)); }
    catch(e){ _vaultCache.set(v.iv, ''); }
  }
}
/* Safe to call on every render: warms the screen we're about to paint, then repaints. */
function vaultEnsureProject(houseId){
  if(!vaultUnlocked() || !isProtected(houseId)) return;
  if(_vaultLoading===houseId || !vaultPendingFor(houseId)) return;
  _vaultLoading=houseId;
  vaultLoadProject(houseId).then(()=>{ _vaultLoading=null; render(); })
                           .catch(()=>{ _vaultLoading=null; });
}

/* ---------- lock / unlock lifecycle ---------- */
async function vaultUnlock(pass){
  if(!vaultExists()) return false;
  const prev=_vaultKey;
  try{
    _vaultKey = await vaultDeriveKey(pass, settings.vault.salt);
    if(await vaultOpenText(settings.vault.verifier) !== VAULT_VERIFIER_TEXT) throw new Error('bad passphrase');
  }catch(e){ _vaultKey=prev; return false; }
  vaultTouch();
  vaultResumeMigration();   /* VAULT_TOGGLE — finish anything that was interrupted */
  vaultAfterUnlock();       /* VAULT_ENVELOPE — bootstrap keys, then reseal captures */
  return true;
}
function vaultRelock(silent){
  const wasOpen = !!_vaultKey;
  _vaultKey=null; _vaultPriv=null; _vaultCache.clear(); _vaultLoading=null;
  clearTimeout(_vaultIdleTimer); _vaultIdleTimer=null;
  /* Revoke every object URL built from ciphertext — otherwise a decrypted
     image stays reachable in memory after the vault is locked. */
  for(const id of _vaultUrlIds){
    const u=_objUrls.get(id);
    if(u){ URL.revokeObjectURL(u); _objUrls.delete(id); }
  }
  _vaultUrlIds.clear();
  window.egsApplyPendingUpdateIfReady();   /* VAULT_SW_GATE — relock may be the last thing blocking a deferred update */
  if(!wasOpen) return;
  try{ if(vw && vw.houseId && isProtected(vw.houseId)) closeViewer(); }catch(e){}
  try{ if(an && an.houseId && isProtected(an.houseId)) closeAnnotate(); }catch(e){}
  try{ if($mr && $mr.innerHTML) closeSheet(); }catch(e){}
  if(!silent){ try{ render(); }catch(e){} }
}
function vaultTouch(){
  if(!_vaultKey) return;
  clearTimeout(_vaultIdleTimer);
  _vaultIdleTimer=setTimeout(()=>{ vaultRelock(); toast('Protected projects locked'); }, VAULT_IDLE_MS);
}

/* ============================================================
   THE photo choke point — decoy-proof rule, one place only.
   Every enumeration of photo ids in this app goes through these.
   scopeHouseId is the project whose OWN screen is being painted; pass null
   for any cross-project surface (project list, pickers, search, exports).
   ============================================================ */
function photoAllowedFor(houseId, scopeHouseId){
  const h=houseById(houseId);
  if(!h || !h.protected) return true;         /* not protected: unchanged, zero cost */
  if(scopeHouseId !== houseId) return false;  /* never outside its own project. ever. */
  return vaultUnlocked();
}
function photosFor(houseId, scopeHouseId){
  const h=houseById(houseId); if(!h) return [];
  return photoAllowedFor(houseId, scopeHouseId) ? (h.photos||[]) : [];
}
function coverFor(houseId, scopeHouseId){
  const h=houseById(houseId); if(!h || !h.cover) return null;
  return photoAllowedFor(houseId, scopeHouseId) ? h.cover : null;
}

/* The ONE photo write path: encrypts iff the project is protected. */
/* ============================================================
   VAULT_ENVELOPE — a write-only vault
   ------------------------------------------------------------
   A photo taken into a protected project has to be written the instant it
   exists, because the page may not survive the next second — Android evicts
   it during a long camera wait, and anything held in memory dies with it.
   So capture is made not to need the vault key at all.

   A random AES-GCM key encrypts the photo; that key is wrapped with an
   RSA-OAEP public key kept in the clear. Writing needs only the public half,
   which is always there. Reading needs the private half, which is sealed under
   the vault passphrase like everything else. Locked, unlocked, mid-grace, or
   freshly rebuilt: no difference, and nothing is ever held waiting for a key.
   ============================================================ */
const VAULT_RSA_GEN    = { name:'RSA-OAEP', modulusLength:2048,
                           publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' };
const VAULT_RSA_IMPORT = { name:'RSA-OAEP', hash:'SHA-256' };
let _vaultPriv = null;      /* CryptoKey — memory only, dropped on relock */
let _resealing = false;

function isEnvPhoto(rec){ return !!rec && rec.env===1 && !!rec.ct && typeof rec.ek==='string'; }

/* Usages are wrapKey/unwrapKey, NOT encrypt/decrypt: WebCrypto refuses
   wrapKey() on a key imported for 'encrypt' with InvalidAccessError. */
async function vaultImportPub(b64){
  return crypto.subtle.importKey('spki', bytesFromB64(b64), VAULT_RSA_IMPORT, false, ['wrapKey']);
}
async function vaultImportPriv(b64){
  return crypto.subtle.importKey('pkcs8', bytesFromB64(b64), VAULT_RSA_IMPORT, false, ['unwrapKey']);
}

/* Fresh data key per photo, wrapped to the public key. Textbook envelope. */
async function vaultEnvelopeSeal(bytes, pubB64){
  const pub = await vaultImportPub(pubB64);
  const dek = await crypto.subtle.generateKey({name:'AES-GCM',length:256}, true, ['encrypt','decrypt']);
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM', iv}, dek, bytes);
  const ek  = await crypto.subtle.wrapKey('raw', dek, pub, {name:'RSA-OAEP'});
  return { ek:b64FromBytes(ek), iv:b64FromBytes(iv), ct };
}
async function vaultEnvelopeOpen(rec){
  if(!_vaultPriv) throw new Error('vault locked');
  const dek = await crypto.subtle.unwrapKey('raw', bytesFromB64(rec.ek), _vaultPriv,
                {name:'RSA-OAEP'}, {name:'AES-GCM',length:256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:bytesFromB64(rec.iv)}, dek, rec.ct);
}

/* Vaults created before the envelope existed get their keypair on the next
   unlock — the only moment we hold the key needed to seal the private half. */
async function vaultEnsureEnvelopeKeys(){
  if(!vaultUnlocked() || !settings.vault) return false;
  if(settings.vault.pub && settings.vault.priv){
    if(!_vaultPriv){
      try{ _vaultPriv = await vaultImportPriv(await vaultOpenText(settings.vault.priv)); }
      catch(e){ return false; }
    }
    return true;
  }
  const pair = await crypto.subtle.generateKey(VAULT_RSA_GEN, true, ['wrapKey','unwrapKey']);
  const pubB64  = b64FromBytes(await crypto.subtle.exportKey('spki',  pair.publicKey));
  const privB64 = b64FromBytes(await crypto.subtle.exportKey('pkcs8', pair.privateKey));
  settings.vault.pub  = pubB64;
  settings.vault.priv = await vaultSealText(privB64);
  persist.settings();
  _vaultPriv = await vaultImportPriv(privB64);
  return true;
}

/* Envelope records are already safe; this converts them to the ordinary
   symmetric shape so there is one form at rest. Per record and idempotent, so
   an interruption just leaves a mix — and both shapes read fine. */
async function vaultResealEnvelopes(){
  if(!vaultUnlocked() || !_vaultPriv || _resealing) return 0;
  _resealing = true;
  let converted = 0;
  try{
    for(const rec of await photoAll()){
      if(!isEnvPhoto(rec)) continue;
      try{
        const pt = await vaultEnvelopeOpen(rec);
        const sealed = await vaultSealBytes(new Uint8Array(pt));
        const out = { id:rec.id, enc:1, iv:sealed.iv, ct:sealed.ct,
                      type:rec.type||'image/jpeg', houseId:rec.houseId, createdAt:rec.createdAt };
        if(rec.cropped) out.cropped = true;
        await photoPut(out);
        const stale=_objUrls.get(rec.id);
        if(stale){ URL.revokeObjectURL(stale); _objUrls.delete(rec.id); _vaultUrlIds.delete(rec.id); }
        converted++;
      }catch(e){ /* leave it as an envelope — still readable, still safe */ }
    }
  } finally { _resealing = false; }
  if(converted) render();
  return converted;
}

async function vaultAfterUnlock(){
  try{
    if(await vaultEnsureEnvelopeKeys()) await vaultResealEnvelopes();
  }catch(e){}
}

/* A photo reaches IndexedDB before the project's photo list is saved, so a
   death in that gap leaves a record nothing points at. The record knows which
   project it belongs to, so re-attach it rather than orphan it. */
async function recoverOrphanPhotos(){
  let re=0;
  try{
    for(const rec of await photoAll()){
      if(!rec.houseId) continue;
      const h=houseById(rec.houseId); if(!h) continue;
      h.photos=h.photos||[];
      if(h.photos.indexOf(rec.id)>=0) continue;
      h.photos.push(rec.id);
      if(!h.cover) h.cover=rec.id;
      re++;
    }
  }catch(e){ return 0; }
  if(re){ persist.houses(); try{ render(); }catch(e){} }
  return re;
}

/* The ONE photo write path. Never throws for want of a key: protected and
   unlocked seals symmetrically, protected and locked envelopes it, and either
   way the bytes are on disk before this returns. */
async function photoPutFor(houseId, rec){
  const stale=_objUrls.get(rec.id);
  if(stale){ URL.revokeObjectURL(stale); _objUrls.delete(rec.id); _vaultUrlIds.delete(rec.id); }
  const h=houseById(houseId);
  if(!(h && h.protected)) return photoPut(rec);
  const bytes=new Uint8Array(await rec.blob.arrayBuffer());
  const type=(rec.blob.type||'image/jpeg');
  if(vaultUnlocked()){
    const sealed=await vaultSealBytes(bytes);
    const out={ id:rec.id, enc:1, iv:sealed.iv, ct:sealed.ct, type,
                houseId:rec.houseId, createdAt:rec.createdAt };
    if(rec.cropped) out.cropped=true;
    return photoPut(out);
  }
  if(!(settings.vault && settings.vault.pub)) throw new Error('no capture key');
  const env=await vaultEnvelopeSeal(bytes, settings.vault.pub);
  const out={ id:rec.id, env:1, ek:env.ek, iv:env.iv, ct:env.ct, type,
              houseId:rec.houseId, createdAt:rec.createdAt };
  if(rec.cropped) out.cropped=true;
  return photoPut(out);
}

async function photoURL(id){
  if(_objUrls.has(id)) return _objUrls.get(id);
  const rec=await photoGet(id); if(!rec) return '';
  let blob=rec.blob;
  if(isEncPhoto(rec)){
    if(!_vaultKey) return '';                 /* locked: no pixels reach the screen */
    try{
      const pt=await vaultOpenBytes(rec.iv, rec.ct);
      blob=new Blob([pt],{type:rec.type||'image/jpeg'});
    }catch(e){ return ''; }
    _vaultUrlIds.add(id);
  } else if(isEnvPhoto(rec)){
    /* VAULT_ENVELOPE — captured while locked and not yet resealed. */
    if(!_vaultPriv) return '';
    try{
      const pt=await vaultEnvelopeOpen(rec);
      blob=new Blob([pt],{type:rec.type||'image/jpeg'});
    }catch(e){ return ''; }
    _vaultUrlIds.add(id);
  }
  if(!blob) return '';
  const u=URL.createObjectURL(blob); _objUrls.set(id,u); return u;
}

/* PHOTO_SHARE — the bytes, decrypted in memory, for a share payload or a
   download the person has asked for. Deliberately NOT routed through
   photoURL()'s object-URL cache: this hands the plaintext to another app,
   so it is written out explicitly here rather than borrowing a handle that
   exists for putting pixels on screen. Same lock rules as photoURL: a
   sealed photo needs the vault open, and a photo captured while locked and
   not yet resealed needs the envelope key. Nothing plaintext is persisted
   anywhere by this function. */
async function photoBlobFor(id){
  const rec=await photoGet(id); if(!rec) return null;
  if(isEncPhoto(rec)){
    if(!_vaultKey) return null;
    try{ const pt=await vaultOpenBytes(rec.iv, rec.ct);
         return new Blob([pt],{type:rec.type||'image/jpeg'}); }catch(e){ return null; }
  }
  if(isEnvPhoto(rec)){
    if(!_vaultPriv) return null;
    try{ const pt=await vaultEnvelopeOpen(rec);
         return new Blob([pt],{type:rec.type||'image/jpeg'}); }catch(e){ return null; }
  }
  return rec.blob||null;
}

let _leavingView=null;
function autosaveOpenNote(){
  // If a note editor is on screen, quietly persist any edits before we leave it.
  const titleEl=$app.querySelector('#note-title'); const bodyEl=$app.querySelector('#note-body');
  if(!titleEl||!bodyEl) return;
  if(!_leavingView || _leavingView.name!=='note') return;
  const id=_leavingView.param;
  const title=titleEl.value.trim(); const body=bodyEl.value;
  const houseSel=$app.querySelector('#note-house'); const houseId=houseSel?houseSel.value||null:null;
  const impEl=$app.querySelector('#note-important'); const important=impEl?impEl.checked:false;
  if(!title && !body.trim()) return;               // nothing worth saving
  /* VAULT_TOGGLE — into a protected project, seal before persisting. This runs
     synchronously from render(), so the write is deferred to the seal's promise
     rather than being made async: a crash mid-edit loses the edit, never leaks it. */
  const saveNoteRec=(n)=>{
    if(isProtected(n.houseId)) vaultAlignRecord(n,['title','body'],n.houseId).then(ok=>{ if(ok) persist.notes(); });
    else persist.notes();
  };
  if(id==='new'){
    // promote the new note to a saved one so we don't duplicate on next autosave
    const nn={id:uid(),title,body,houseId,important,createdAt:now(),updatedAt:now()};
    notes.push(nn); _lastAutosavedNewId=nn.id; saveNoteRec(nn);
  } else {
    const n=notes.find(x=>x.id===id);
    if(n){ n.title=title; n.body=body; n.houseId=houseId; n.important=important; n.updatedAt=now(); saveNoteRec(n); }
  }
}

   the update?" without navigating into Settings first. That is not the first

  return `<div class="topbar">
    <button class="icon-btn" data-back aria-label="Back">${I.back}</button>
    <div class="grow"><input class="input" id="q" placeholder="Search projects, notes, to-dos…" autocomplete="off"></div>
  </div><div class="wrap" id="results"><div class="empty faint" style="padding-top:30px">Type to search everything on this device.</div></div>`;
}
function runSearch(q){
  const res=document.getElementById('results'); q=q.trim().toLowerCase();
  if(!q){ res.innerHTML=`<div class="empty faint" style="padding-top:30px">Type to search everything on this device.</div>`; return; }
  const hits=[];
  /* VAULT_RENDER — protected projects are not searchable, locked or unlocked.
     Contents live inside the project or nowhere. Same rule as photos. */
  houses.forEach(h=>{ if(h.protected) return;
    const hay=[h.name,h.address,h.notes,...(h.specs||[]).flatMap(s=>[s.label,s.value,s.room,s.note])].join(' ').toLowerCase();
    if(hay.includes(q)) hits.push({t:'Project',title:h.name,sub:h.address||'',go:()=>go('house',h.id)}); });
  notes.forEach(n=>{ if(isProtected(n.houseId)) return;
    if((n.title+' '+n.body).toLowerCase().includes(q)) hits.push({t:'Note',title:n.title||'Untitled',sub:(n.body||'').slice(0,60),go:()=>go('note',n.id)}); });
  tasks.forEach(t=>{ if(isProtected(t.houseId)) return;
    if((t.text||'').toLowerCase().includes(q)){ const h=houseById(t.houseId); hits.push({t:'To-do',title:t.text,sub:(h?h.name+' · ':'')+STATUS_LABEL[t.status],go:()=> h?go('house',h.id):go('todo')}); } });
  if(!hits.length){ res.innerHTML=`<div class="empty faint" style="padding-top:30px">No matches for "${esc(q)}".</div>`; return; }
  res.innerHTML=hits.map((x,i)=>`<div class="card" data-hit="${i}"><div class="meta mono" style="color:var(--brass);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase">${x.t}</div>
    <div style="margin-top:3px">${esc(x.title)}</div>${x.sub?`<div class="muted truncate" style="font-size:13px">${esc(x.sub)}</div>`:''}</div>`).join('');
  res.querySelectorAll('[data-hit]').forEach(c=>c.onclick=()=>hits[+c.dataset.hit].go());
}

   ============================================================ */
/* ============================================================
   MEASUREMENT WIDGET (shared ft/in/frac + metric)
   ============================================================ */
// ============================================================================
//  EGS Measurement Widget — shared across Notebuilt + Stagger
//  Stores INCHES internally (all engines speak inches). The unit mode only
//  changes how the boxes render and how we read them back. Nothing downstream
//  ever sees anything but inches.
//
//  Imperial: three boxes  ft | in | fraction(typed, e.g. 1/4)
//  Metric:   two boxes     m  | cm
//  Unit mode: global default (settings.units) + optional per-field override.
// ============================================================================

var MEAS_MODE_DEFAULT = "imperial";  // host overrides from settings

// ---- conversions (inch is the canonical unit) ----
function inchesToImperial(inches){
  var neg = inches < 0; inches = Math.abs(inches);
  var totalSix = Math.round(inches * 16);
  var ft = Math.floor(totalSix / (12*16)); totalSix -= ft*12*16;
  var inch = Math.floor(totalSix / 16); var fr = totalSix - inch*16;
  var fracStr = "";
  if (fr > 0){ var n=fr, d=16; while(n%2===0 && d>1){ n/=2; d/=2; } fracStr = n + "/" + d; }
  return { ft: (neg?-ft:ft), in: inch, frac: fracStr };
}
function imperialToInches(ftStr, inStr, fracStr){
  var ft = parseFloat(ftStr); if (isNaN(ft)) ft = 0;
  var inch = parseFloat(inStr); if (isNaN(inch)) inch = 0;
  var frac = 0;
  if (fracStr && String(fracStr).trim()){
    var m = String(fracStr).trim().match(/^(\d+)\s*\/\s*(\d+)$/);
    if (m){ var dd=+m[2]; if(!dd) return null; frac = (+m[1])/dd; }
    else if (/^\d*\.?\d+$/.test(fracStr.trim())) { frac = parseFloat(fracStr); } // tolerate a decimal
    else return null; // unreadable fraction
  }
  var sign = ft < 0 ? -1 : 1;
  return sign * (Math.abs(ft)*12 + inch + frac);
}
var MM_PER_INCH = 25.4;
function inchesToMetric(inches){
  var mm = inches * MM_PER_INCH;
  var m = Math.floor(mm / 1000);
  var cm = Math.round((mm - m*1000) / 10 * 10) / 10;  // cm to 1 decimal
  if (cm >= 100){ m += 1; cm -= 100; }
  return { m: m, cm: cm };
}
function metricToInches(mStr, cmStr){
  var m = parseFloat(mStr); if (isNaN(m)) m = 0;
  var cm = parseFloat(cmStr); if (isNaN(cm)) cm = 0;
  var mm = m*1000 + cm*10;
  return mm / MM_PER_INCH;
}

// ---- read a widget's DOM back to inches (null if unreadable) ----
function measRead(rootEl){
  var mode = rootEl.getAttribute("data-mode") || MEAS_MODE_DEFAULT;
  if (mode === "metric"){
    var m = rootEl.querySelector('[data-meas-m]').value;
    var cm = rootEl.querySelector('[data-meas-cm]').value;
    if (String(m).trim()==="" && String(cm).trim()==="") return null;
    return metricToInches(m, cm);
  } else {
    var ft = rootEl.querySelector('[data-meas-ft]').value;
    var inch = rootEl.querySelector('[data-meas-in]').value;
    var frac = rootEl.querySelector('[data-meas-frac]').value;
    if (String(ft).trim()==="" && String(inch).trim()==="" && String(frac).trim()==="") return null;
    return imperialToInches(ft, inch, frac);
  }
}

// ---- render a widget (returns HTML string). id must be unique on screen. ----
function measWidget(id, inches, mode){
  mode = mode || MEAS_MODE_DEFAULT;
  var box = 'class="input meas-box" inputmode="decimal" autocomplete="off"';
  if (mode === "metric"){
    var v = (inches!=null) ? inchesToMetric(inches) : {m:"",cm:""};
    return '<div class="meas" data-meas="'+id+'" data-mode="metric">'
      + '<span class="meas-cell"><input '+box+' data-meas-m value="'+v.m+'" placeholder="0"><label>m</label></span>'
      + '<span class="meas-cell"><input '+box+' data-meas-cm value="'+v.cm+'" placeholder="0"><label>cm</label></span>'
      + '</div>';
  } else {
    var w = (inches!=null) ? inchesToImperial(inches) : {ft:"",in:"",frac:""};
    return '<div class="meas" data-meas="'+id+'" data-mode="imperial">'
      + '<span class="meas-cell"><input '+box+' data-meas-ft value="'+w.ft+'" placeholder="0"><label>ft</label></span>'
      + '<span class="meas-cell"><input '+box+' data-meas-in value="'+w.in+'" placeholder="0"><label>in</label></span>'
      + '<span class="meas-cell"><input class="input meas-box" autocomplete="off" data-meas-frac value="'+w.frac+'" placeholder="0"><label>frac</label></span>'
      + '</div>';
  }
}

// ---- the echo string (what the value reads as, in the OTHER unit for cross-check) ----
function measEcho(inches, mode){
  if (inches==null) return "";
  mode = mode || MEAS_MODE_DEFAULT;
  if (mode === "metric"){
    var w = inchesToImperial(inches);
    var s = (w.ft?w.ft+"'-":"") + w.in + (w.frac?" "+w.frac:"") + '"';
    return "= " + s + " imperial";
  } else {
    var mm = Math.round(inches*MM_PER_INCH);
    return "= " + mm + " mm";
  }
}

function measMode(){ return (settings.units==='metric')?'metric':'imperial'; }

/* ============================================================
   CONSTRUCTION CALCULATOR  (feet-inch-fraction native)
   ============================================================ */
// Parse tape notation to inches: 21'-10 1/4, 21' 10 1/4", 10 1/4, 5/8, 21-10-1/4, 8'
function calcParse(str){
  if(str==null) return null;
  var s=String(str).trim().toLowerCase();
  if(!s) return null;
  s=s.replace(/[\u2032\u2019]/g,"'").replace(/[\u2033\u201d]/g,'"');
  s=s.replace(/ft\b/g,"'").replace(/in\b/g,'"');
  s=s.replace(/\s*-\s*/g," ").replace(/\s+/g," ").trim();
  var feet=0, sawFeet=false, sawInch=/"/.test(s);
  s=s.replace(/"/g,"");
  var fm=s.match(/^(\d+(?:\.\d+)?)\s*'/);
  if(fm){ feet=parseFloat(fm[1]); sawFeet=true; s=s.slice(fm[0].length).trim(); }
  var inches=0;
  if(s){
    var parts=s.split(" ");
    var whole=0, frac=0, ok=true;
    if(parts.length===1){
      if(parts[0].indexOf("/")>=0){ frac=calcFrac(parts[0]); ok=frac!=null; }
      else { whole=parseFloat(parts[0]); ok=!isNaN(whole); }
    } else if(parts.length===2 && parts[1].indexOf("/")>=0){
      whole=parseFloat(parts[0]); frac=calcFrac(parts[1]); ok=!isNaN(whole)&&frac!=null;
    } else ok=false;
    if(!ok) return null;
    inches=whole+(frac||0);
  }
  if(sawFeet) return feet*12+inches;
  if(sawInch) return inches;
  return inches; // bare number on the calc = inches
}
function calcFrac(t){ var m=t.match(/^(\d+)\/(\d+)$/); if(!m) return null; var d=+m[2]; return d?(+m[1])/d:null; }
// inches -> tape string, rounded to nearest 1/16
function calcFmt(inch){
  if(inch==null||isNaN(inch)) return "\u2014";
  var neg=inch<0; inch=Math.abs(inch);
  var totalSix=Math.round(inch*16);          // round once, in sixteenths of an inch
  var f=Math.floor(totalSix/(12*16)); totalSix-=f*12*16;
  var w=Math.floor(totalSix/16), fr=totalSix-w*16;
  var fs="";
  if(fr>0){ var n=fr,d=16; while(n%2===0&&d>1){n/=2;d/=2;} fs=" "+n+"/"+d; }
  var out=(neg?"\u2212":"");
  if(f>0) out+=f+"'-"+w+fs+'"';
  else out+=w+fs+'"';
  return out;
}
/* CALC_OP_PER_MODE — Add/Subtract and Multiply/Divide keep SEPARATE operator
   slots. They shared one, and because each compute read it through a two-way
   ternary, an operator from the other mode did not fail — it took the else arm.
   Cold open leaves op "+", so tapping Multiply/Divide and entering 10" x 3 read
   3 5/16": a division, with neither button lit and the field labelled "Divide
   by" under a tab named Multiply. The mirror ran the other way, a "*" reaching
   tape and quietly subtracting. One slot per mode, and both computes below name
   their two operators outright rather than treating "not this one" as the other. */
var CALC={mode:"tape", a:null, b:null, op:"+", opmd:"*", num:"", bf_t:null, bf_w:null, bf_l:null, ar_w:null, ar_l:null, sq_a:null, sq_b:null};
/* The operator in force for a mode — the ONE place that mapping is written, so
   the compute, the button highlight and the field label cannot disagree. */
function calcOpFor(m){ return m==="md" ? CALC.opmd : CALC.op; }

// Format an inches value for display in the ACTIVE unit mode.
function calcShow(inch){
  if(inch==null||isNaN(inch)) return "\u2014";
  if(measMode()==="metric"){ var mm=Math.round(inch*25.4); return (mm>=1000?(Math.round(mm/10)/100)+" m":mm+" mm"); }
  return calcFmt(inch);
}
/* CALC_STEADY — the result block for a mode, as HTML, or '' when the fields are
   not all in yet. ONE definition, called by the full render AND by the surgical
   repaint below, so the two can never drift. That matters more than it looks:
   the alternative is the board-feet formula existing in two places. */
function calcResultBlock(m){
  var mode=measMode();
  if(m==="tape"||m==="md"){
    var A=CALC.a, res=null;
    if(A!=null){
      var op=calcOpFor(m);
      if(m==="tape"){ if(CALC.b!=null){ if(op==="+") res=A+CALC.b; else if(op==="-") res=A-CALC.b; } }
      else { var n=parseFloat(CALC.num); if(!isNaN(n)&&String(CALC.num).trim()!==""){ if(op==="*") res=A*n; else if(op==="/") res=(n!==0?A/n:null); } }
    }
    return calcResult(res);          /* always present: reads "\u2014" when empty */
  }
  if(m==="bf"){
    if(CALC.bf_t==null||CALC.bf_w==null||CALC.bf_l==null) return '';
    var bf=(CALC.bf_t*CALC.bf_w*CALC.bf_l)/144;
    return '<div class="cresult"><div class="muted">Board feet</div><div class="cbig">'+(Math.round(bf*100)/100)+' bf</div></div>';
  }
  if(m==="area"){
    if(CALC.ar_w==null||CALC.ar_l==null) return '';
    var sqin=CALC.ar_w*CALC.ar_l, sqft=sqin/144, sqm=sqin*0.00064516;
    return '<div class="cresult"><div class="muted">Area</div><div class="cbig">'+(mode==="metric"?(Math.round(sqm*100)/100)+' m\u00b2':(Math.round(sqft*100)/100)+' sq ft')+'</div><div class="muted" style="margin-top:4px">'+(mode==="metric"?(Math.round(sqft*100)/100)+' sq ft':(Math.round(sqm*100)/100)+' m\u00b2')+'</div></div>';
  }
  if(m==="sq"){
    if(CALC.sq_a==null||CALC.sq_b==null) return '';
    var diag=Math.sqrt(CALC.sq_a*CALC.sq_a+CALC.sq_b*CALC.sq_b);
    return '<div class="cresult"><div class="muted">Diagonal</div><div class="cbig">'+calcShow(diag)+'</div></div>';
  }
  return '';
}

/* CALC_STEADY — which CALC slot each measurement widget writes to. ONE map,
   read by the recompute AND by Clear, so a field cannot be added to one and
   forgotten in the other. Same reason calcResultBlock has a single definition:
   the alternative is this table existing twice and drifting. */
var CALC_SLOT_OF={ "c-a":"a","c-b":"b","bf_t":"bf_t","bf_w":"bf_w","bf_l":"bf_l","ar_w":"ar_w","ar_l":"ar_l","sq_a":"sq_a","sq_b":"sq_b" };

function calcRecompute(){
  var wrap=$app.querySelector('.wrap'); if(!wrap) return;
  wrap.querySelectorAll('.meas').forEach(function(root){
    var slot=CALC_SLOT_OF[root.getAttribute("data-meas")]; if(!slot) return;
    var echo=root.parentNode.querySelector('.cecho'); if(echo){ var v=CALC[slot]; echo.textContent=(v!=null)?measEcho(v,measMode()):""; }
  });
  /* CALC_STEADY — repaint ONLY the result block.
     This used to call render() for bf/area/sq, because in those modes .cresult
     is absent until every field is filled and there was nothing to replaceWith.
     A full render rebuilds $app, which demolished the input under the user's
     finger: focus fell to <body> and the phone keyboard dismissed on every
     digit. Create, replace or remove the one block in place and the boxes are
     never touched. */
  var m=CALC.mode, html=calcResultBlock(m), old=wrap.querySelector('.cresult');
  if(!html){ if(old) old.remove(); return; }
  var tmp=document.createElement('div'); tmp.innerHTML=html;
  var node=tmp.firstChild;
  if(old){ old.replaceWith(node); return; }
  /* First moment it can be shown: it belongs after the last measurement field,
     ahead of the trailing hint that closes .wrap. */
  var fields=wrap.querySelectorAll('.field');
  if(fields.length) fields[fields.length-1].insertAdjacentElement('afterend', node);
  else wrap.appendChild(node);
}
/* CALC_CLEAR — empty the ACTIVE mode's boxes and its result in one tap.
   Only the active mode's fields are ever in the DOM, so clearing what is
   rendered clears that mode and nothing else — no per-mode list to keep in
   step with renderCalc.
   Left alone on purpose: CALC.mode, the ft/in<->metric toggle, and both
   operator slots. Clearing the numbers must not reset how someone works.
   No confirm, and nothing to confirm: these boxes hold typed input, not saved
   data, and there is no running tape to lose. If one is ever added, its
   confirm goes in with it.
   The values are blanked on the EXISTING inputs and the repaint goes through
   calcRecompute, so a clear takes the same surgical path as a keystroke —
   no full render, and the boxes are never rebuilt. */
function calcClear(){
  var wrap=$app.querySelector('.wrap'); if(!wrap) return;
  wrap.querySelectorAll('.meas').forEach(function(root){
    var slot=CALC_SLOT_OF[root.getAttribute("data-meas")]; if(slot) CALC[slot]=null;
    root.querySelectorAll('input').forEach(function(inp){ inp.value=""; });
  });
  var cnum=wrap.querySelector('#c-num'); if(cnum){ CALC.num=""; cnum.value=""; }
  calcRecompute();
}
function renderCalc(){
  var m=CALC.mode, mode=measMode();
  var unitTog='<div class="unit-toggle"><button class="'+(mode==="imperial"?"on":"")+'" data-units-set="imperial">ft/in</button><button class="'+(mode==="metric"?"on":"")+'" data-units-set="metric">metric</button></div>';
  var tabs=[["tape","Add / Subtract"],["md","Multiply / Divide"],["bf","Board Feet"],["area","Area"],["sq","Square-up"]];
  var tabhtml=tabs.map(function(t){return '<button class="btn sm '+(m===t[0]?'primary':'')+'" data-calc-mode="'+t[0]+'" style="margin:0 6px 6px 0">'+t[1]+'</button>';}).join("");
  var body="";
  if(m==="tape"||m==="md"){
    var ops = m==="tape" ? [["+","+"],["\u2212","-"]] : [["\u00d7","*"],["\u00f7","/"]];
    body=''
    +'<div class="field"><label>'+(m==="tape"?"First measurement":"Measurement")+'</label>'+measWidget("c-a",CALC.a,mode)+'<span class="cecho">'+(CALC.a!=null?measEcho(CALC.a,mode):"")+'</span></div>'
    +'<div class="crow">'+ops.map(function(o){return '<button class="btn '+(calcOpFor(m)===o[1]?'primary':'')+'" data-calc-op="'+o[1]+'">'+o[0]+'</button>';}).join("")+'</div>'
    +(m==="tape"
       ? '<div class="field"><label>Second measurement</label>'+measWidget("c-b",CALC.b,mode)+'<span class="cecho">'+(CALC.b!=null?measEcho(CALC.b,mode):"")+'</span></div>'
       : '<div class="field"><label>'+(calcOpFor(m)==="*"?"Times (number)":"Divide by (number)")+'</label><input class="input" id="c-num" inputmode="decimal" value="'+esc(CALC.num)+'" placeholder="3" autocomplete="off"></div>')
    +calcResultBlock(m);
  } else if(m==="bf"){
    body=''
    +'<p class="muted" style="font-size:13px;margin:0 0 10px">Board feet = thickness \u00d7 width \u00d7 length \u00f7 144.</p>'
    +calcMField("bf_t","Thickness",CALC.bf_t,mode)
    +calcMField("bf_w","Width",CALC.bf_w,mode)
    +calcMField("bf_l","Length",CALC.bf_l,mode)
    +calcResultBlock("bf");
  } else if(m==="area"){
    body=''
    +'<p class="muted" style="font-size:13px;margin:0 0 10px">Area from width \u00d7 length.</p>'
    +calcMField("ar_w","Width",CALC.ar_w,mode)
    +calcMField("ar_l","Length",CALC.ar_l,mode)
    +calcResultBlock("area");
  } else if(m==="sq"){
    body=''
    +'<p class="muted" style="font-size:13px;margin:0 0 10px">Diagonal (3-4-5 square check) \u2014 what a square layout should measure corner to corner.</p>'
    +calcMField("sq_a","Side A",CALC.sq_a,mode)
    +calcMField("sq_b","Side B",CALC.sq_b,mode)
    +calcResultBlock("sq");
  }
  /* Clear sits directly under the tab strip — the one position identical in
     all five modes. Anything below the fields moves: Board Feet has three
     fields where the others have two, and bf/area/sq draw no result block
     until every field is in. Plain .btn, the same class as the operator keys,
     so the target is the 46px --tap one and gloves find it by feel. */
  var clearRow='<div class="cclear">'+nbHelpMark('calc')+'<button class="btn" data-calc-clear>Clear</button></div>';
  return '<div class="topbar"><div class="grow"><span class="eyebrow">'+esc(APP_NAME)+'</span><h1>Calculator</h1></div>'+unitTog+'</div>'
    +'<div class="wrap"><div style="display:flex;flex-wrap:wrap;margin-bottom:10px">'+tabhtml+'</div>'+clearRow+body
    +'<p class="muted" style="font-size:12px;margin-top:16px;line-height:1.5">Enter measurements in the boxes. Switch ft/in \u2194 metric anytime \u2014 values convert automatically.</p></div>';
}
function calcMField(id,label,inchVal,mode){
  return '<div class="field"><label>'+label+'</label>'+measWidget(id,inchVal,mode)+'<span class="cecho">'+(inchVal!=null?measEcho(inchVal,mode):"")+'</span></div>';
}
function calcResult(res){
  return '<div class="cresult"><div class="muted">Result</div><div class="cbig">'+calcShow(res)+'</div>'
    +(res!=null?'<div class="muted" style="margin-top:4px">'+(measMode()==="metric"?calcFmt(res)+" imperial":Math.round(res*25.4)+" mm")+'</div>':"")+'</div>';
}

const $mr=document.getElementById('modal-root');
function closeSheet(){ $mr.innerHTML=''; }
/* EGS-STD:infomode — the optional second argument is a HELP_COPY key, and
   the marker it draws is pinned to the sheet's corner rather than put in the
   title. Sheet titles carry project names, and a name long enough to wrap
   would wrap differently with a marker than without it. */
function sheet(html,helpKey){
  $mr.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${helpKey?nbHelpCorner(helpKey):''}${html}</div></div>`;
  $mr.querySelector('[data-scrim]').addEventListener('click',e=>{ if(e.target.hasAttribute('data-scrim')) closeSheet(); });
  nbHelpBind($mr);
}

/* VAULT_RENDER — a cross-project picker never offers a protected project.
   The only exception is the one an item already belongs to, so editing an item
   from inside an unlocked protected project still shows where it lives. */
function pickableHouses(currentId){ return houses.filter(h=>!h.protected || h.id===currentId); }

    <button class="btn primary block" id="t-save">Add to today</button>`);
  const inp=$mr.querySelector('#t-text'); setTimeout(()=>inp.focus(),50);

    const hid=$mr.querySelector('#t-house').value||null;
    const nt={id:uid(),text,status:'todo',houseId:hid,createdAt:now(),updatedAt:now(),doneAt:null,dueDate:null};

    persist.tasks(); closeSheet(); render(); toast('Added to Today'); };
  $mr.querySelector('#t-save').onclick=submit;

}

async function doShareHouse(houseId,opts){
  const h=houseById(houseId); if(!h || h.protected)return;
  closeSheet();
  toast('Preparing share…');
  try{
    const project={
      name:h.name, status:h.status, jobType:h.jobType||'',
      specs:(h.specs||[]).map(s=>({category:s.category,room:s.room,label:s.label,value:s.value,note:s.note}))
    };
    if(opts.address) project.address=h.address||'';
    if(opts.notes) project.notes=h.notes||'';
    if(opts.tasks){
      project.tasks=tasks.filter(t=>t.houseId===houseId).map(t=>({text:t.text,status:t.status}));
    }
    if(opts.photos && (h.photos||[]).length){
      const photoData={};
      for(const pid of photosFor(houseId,houseId)){
        const rec=await photoGet(pid);
        if(rec) photoData[pid]={b64:await blobToB64(rec.blob)};
      }
      project.photos=photoData;
    }
    const dump={ app:'notebuilt-project-share', version:1, exportedAt:now(), project };
    const json=JSON.stringify(dump);
    const filename='notebuilt-'+(h.name||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'-'+todayKey()+'.json';
    const file=new File([json],filename,{type:'application/json'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Notebuilt project: '+h.name});
      toast('Shared');
    }else{
      const blob=new Blob([json],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=filename; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      toast('Downloaded');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ toast('Share cancelled'); return; }
    toast('Could not share project');
  }
}

    ${edit?`<div class="card" style="background:var(--ink-2);margin:4px 0 14px">
      <div class="row"><div class="grow">
        <div>${edit.protected?'Protected':'Protect this project'}</div>
        <div class="muted" style="font-size:12.5px;line-height:1.5;margin-top:2px">${edit.protected
          ? 'Its contents are encrypted behind your vault passphrase.'
          : 'Encrypt its notes, to-dos, specs and photos behind a passphrase of their own.'}</div>
      </div><button class="btn sm ${edit.protected?'':'primary'}" id="h-protect">${edit.protected?'Turn off':'Turn on'}</button></div>
    </div>`:''}
    <button class="btn primary block" id="h-save">${edit?'Save':'Create project'}</button>
    ${edit?`<button class="btn danger block" id="h-del" style="margin-top:10px">${I.trash} Delete project</button>`:''}`);
  setTimeout(()=>$mr.querySelector('#h-name').focus(),50);
  $mr.querySelector('#h-category').onchange=()=>{
    const show=$mr.querySelector('#h-category').value==='construction';
    $mr.querySelector('#h-jobtype-field').style.display=show?'':'none';
  };
  if(edit) $mr.querySelector('#h-protect').onclick=()=>{
    closeSheet();
    if(edit.protected) vaultProtectOff(edit.id); else vaultProtectOn(edit.id);
  };
  $mr.querySelector('#h-save').onclick=async()=>{
    const name=$mr.querySelector('#h-name').value.trim(); if(!name){$mr.querySelector('#h-name').focus();return;}
    const category=$mr.querySelector('#h-category').value;
    const addr=$mr.querySelector('#h-addr').value.trim(), st=$mr.querySelector('#h-status').value, jt=$mr.querySelector('#h-jobtype').value;
    if(edit){ edit.name=name; edit.category=category; edit.address=addr; edit.status=st; edit.jobType=jt; edit.updatedAt=now();
      /* VAULT_TOGGLE — seal before it reaches storage, never after. */
      if(!(await vaultAlignRecord(edit,['address'],edit.id))){ toast('Unlock the vault to save that'); return; }
      persist.houses(); closeSheet(); render(); toast('Saved'); }
    else{ const nh={id:uid(),name,category,address:addr,status:st,jobType:jt,specs:[],photos:[],cover:null,notes:'',createdAt:now(),updatedAt:now()};
      houses.push(nh); persist.houses(); closeSheet(); go('house',nh.id); toast('Project added'); }
  };
  if(edit) $mr.querySelector('#h-del').onclick=()=>{
    /* A protected project's notes and to-dos are unreadable ciphertext — unlinking
       them would strand it. Route to the escape hatch, which deletes them. */
    if(edit.protected){ closeSheet(); vaultDeleteLocked(edit.id); return; }
    if(!confirm(`Delete "${edit.name}" and its specs? Photos and to-dos for it stay but unlink.`)) return;
    (edit.photos||[]).forEach(pid=>photoDel(pid).catch(()=>{}));
    houses=houses.filter(x=>x.id!==edit.id);
    tasks.forEach(t=>{ if(t.houseId===edit.id) t.houseId=null; });
    notes.forEach(nn=>{ if(nn.houseId===edit.id) nn.houseId=null; });
    persist.houses(); persist.tasks(); persist.notes(); closeSheet(); go('houses'); toast('Project deleted');
  };
}

function categoryRowsHtml(){
  return categories.map((c,i)=>`<div class="card" style="margin-bottom:8px;padding:10px">
    <div class="row" style="gap:8px;align-items:center">
      <input class="input" style="width:50px;text-align:center;padding:8px;flex:none" value="${esc(c.icon)}" data-cat-icon="${esc(c.id)}" maxlength="4">
      <input class="input grow" value="${esc(c.label)}" data-cat-label="${esc(c.id)}">
    </div>
    <div class="row" style="gap:8px;margin-top:8px;justify-content:flex-end">
      <button class="btn sm" data-cat-up="${c.id}" ${i===0?'disabled':''}>\u2191</button>
      <button class="btn sm" data-cat-down="${c.id}" ${i===categories.length-1?'disabled':''}>\u2193</button>
      <button class="btn sm danger" data-cat-del="${c.id}">${I.trash} Delete</button>
    </div>
  </div>`).join('');
}
function wireCategoryRows(){
  $mr.querySelectorAll('[data-cat-icon]').forEach(inp=>{
    inp.onblur=()=>{ const c=categoryById(inp.dataset.catIcon); if(c){ c.icon=inp.value.trim()||'\ud83c\udff7\ufe0f'; persist.categories(); render(); } };
  });
  $mr.querySelectorAll('[data-cat-label]').forEach(inp=>{
    inp.onblur=()=>{ const c=categoryById(inp.dataset.catLabel); if(c && inp.value.trim()){ c.label=inp.value.trim(); persist.categories(); render(); } };
  });
  $mr.querySelectorAll('[data-cat-up]').forEach(b=>b.onclick=()=>moveCategory(b.dataset.catUp,-1));
  $mr.querySelectorAll('[data-cat-down]').forEach(b=>b.onclick=()=>moveCategory(b.dataset.catDown,1));
  $mr.querySelectorAll('[data-cat-del]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.catDel));
}
function moveCategory(id,dir){
  const i=categories.findIndex(c=>c.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=categories.length)return;
  [categories[i],categories[j]]=[categories[j],categories[i]];
  persist.categories(); render(); openManageCategories();
}
function deleteCategory(id){
  const affected=houses.filter(h=>h.category===id).length;
  const msg=affected?`Delete this category? ${affected} project${affected===1?'':'s'} using it will show as Uncategorized \u2014 nothing is deleted.`:'Delete this category?';
  if(!confirm(msg)) return;
  categories=categories.filter(c=>c.id!==id);
  houses.forEach(h=>{ if(h.category===id) h.category=null; });
  if(categoryFilter===id) categoryFilter='all';
  persist.categories(); persist.houses(); render(); openManageCategories();
}
function openManageCategories(){
  sheet(`<h2>Categories</h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">Rename, change the emoji, reorder, or remove categories. Projects in a deleted category show as Uncategorized instead of disappearing.</div>
    <div id="cat-list">${categoryRowsHtml()}</div>
    <div class="card" style="margin-top:4px;background:var(--ink-2)">
      <div class="row" style="gap:8px;align-items:center">
        <input class="input" style="width:50px;text-align:center;padding:8px;flex:none" placeholder="\ud83c\udff7\ufe0f" id="cat-new-icon" maxlength="4">
        <input class="input grow" placeholder="New category name" id="cat-new-label">
      </div>
      <button class="btn primary block sm" id="cat-new-save" style="margin-top:8px">${I.plus} Add category</button>
    </div>`,'categories');
  wireCategoryRows();
  $mr.querySelector('#cat-new-save').onclick=()=>{
    const label=$mr.querySelector('#cat-new-label').value.trim(); if(!label)return;
    const icon=$mr.querySelector('#cat-new-icon').value.trim()||'\ud83c\udff7\ufe0f';
    categories.push({id:uid(),label,icon});
    persist.categories(); render();
    openManageCategories();
  };
}

function openSpecSheet(houseId){

    <div class="field"><label>Category</label><select class="input" id="s-cat">${SPEC_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>

  $mr.querySelector('#s-save').onclick=async()=>{

/* ============================================================
   BIND (event wiring per view)
   ============================================================ */
function bind(){
  $app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $app.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);

  /* Today / task rows */
  $app.querySelectorAll('[data-punch]').forEach(b=>b.onclick=()=>{
    const t=tasks.find(x=>x.id===b.dataset.punch); if(!t)return;
    t.status=STATUS_NEXT[t.status]; t.updatedAt=now(); t.doneAt=t.status==='done'?now():null;
    persist.tasks(); render();
  });
  $app.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>openEditTask(b.dataset.editTask));

  /* Houses */
  $app.querySelectorAll('[data-house]').forEach(c=>c.onclick=()=>go('house',c.dataset.house));
  $app.querySelectorAll('[data-vault-open]').forEach(b=>b.onclick=()=>vaultUnlockSheet({
    title:'Unlock this project',
    body:'Enter your vault passphrase. This is not your app PIN, and there is no way to recover it.'
  }));
  const vLockNow=$app.querySelector('[data-vault-lock-now]');
  if(vLockNow) vLockNow.onclick=()=>{ vaultRelock(); toast('Locked'); };
  $app.querySelectorAll('[data-vault-del]').forEach(b=>b.onclick=()=>vaultDeleteLocked(b.dataset.vaultDel));
  $app.querySelectorAll('[data-edit-house]').forEach(b=>b.onclick=()=>openHouseSheet(houseById(b.dataset.editHouse)));
  $app.querySelectorAll('[data-share-house]').forEach(b=>b.onclick=()=>openShareSheet(b.dataset.shareHouse));
  const sortBtn=$app.querySelector('[data-sort-houses]'); if(sortBtn) sortBtn.onclick=openSortSheet;
  $app.querySelectorAll('[data-cat-filter]').forEach(b=>b.onclick=()=>{ categoryFilter=b.dataset.catFilter; render(); });
  $app.querySelectorAll('[data-manage-categories]').forEach(b=>b.onclick=openManageCategories);
  $app.querySelectorAll('[data-open-cat-picker]').forEach(b=>b.onclick=()=>openCategoryPicker(b.dataset.openCatPicker));
  const addSpec=$app.querySelector('[data-add-spec]'); if(addSpec) addSpec.onclick=()=>openSpecSheet(view.param);
  /* CHUNK5_CONFIRM_DELETES */
  $app.querySelectorAll('[data-del-spec]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this spec?'))return;
    const h=houseById(view.param); h.specs=h.specs.filter(s=>s.id!==b.dataset.delSpec); h.updatedAt=now(); persist.houses(); render();
  });
  const addHT=$app.querySelector('[data-add-house-task]'); if(addHT) addHT.onclick=()=>openTaskSheet(view.param);
  const addNoteH=$app.querySelector('[data-add-note-house]'); if(addNoteH) addNoteH.onclick=()=>{ pendingNoteHouseId=addNoteH.dataset.addNoteHouse; go('note','new'); };
  $app.querySelectorAll('[data-open-house-notes]').forEach(el=>el.onclick=()=>go('housenotes',el.dataset.openHouseNotes));
  const hnFull=$app.querySelector('[data-house-notes-full]');
  if(hnFull){
    const hnId=hnFull.dataset.houseNotesFull;
    /* VAULT_TOGGLE — seal first, persist second. If we die in between, the edit
       is lost rather than written to disk in the clear. */
    const saveHn=()=>{ const h=houseById(hnId); if(!h) return;
      h.notes=hnFull.value; h.updatedAt=now();
      if(isProtected(hnId)) vaultAlignRecord(h,['notes'],hnId).then(ok=>{ if(ok) persist.houses(); });
      else persist.houses(); };
    let hnTimer=null;
    hnFull.oninput=()=>{ clearTimeout(hnTimer); hnTimer=setTimeout(saveHn,400); };
    hnFull.onblur=()=>{ clearTimeout(hnTimer); saveHn(); };
  }

  /* Photos */
  /* VAULT_CAPTURE — this click is about to hand us to the camera or the picker,
     which backgrounds the app. Flag it so the background relock stands down. */
  $app.querySelectorAll('[data-add-photo]').forEach(el=>{
    el.onclick=()=>captureBegin();
    el.onchange=e=>handlePhoto(e,view.param);
  });
  /* VAULT_CAMERA — a protected project never hands off to the camera app. */
  $app.querySelectorAll('[data-open-camera]').forEach(b=>b.onclick=()=>openCamera(b.dataset.openCamera));
  $app.querySelectorAll('[data-del-photo]').forEach(b=>b.onclick=async ev=>{ ev.stopPropagation();
    if(!confirm('Delete this photo?'))return;
    const pid=b.dataset.delPhoto, h=houseById(view.param);
    await photoDel(pid).catch(()=>{}); h.photos=(h.photos||[]).filter(x=>x!==pid);
    if(h.cover===pid) h.cover=null; h.updatedAt=now(); persist.houses(); render();
  });
  $app.querySelectorAll('.photo-grid .ph[data-photo]').forEach(el=>el.onclick=()=>openViewer(view.param, el.dataset.photo));
  $app.querySelectorAll('[data-edit-cover]').forEach(el=>el.onclick=()=>openCoverPicker(el.dataset.editCover));

  /* Calculator */
  $app.querySelectorAll('[data-calc-mode]').forEach(b=>b.onclick=()=>{ CALC.mode=b.dataset.calcMode; render(); });
  $app.querySelectorAll('[data-calc-op]').forEach(b=>b.onclick=()=>{ var o=b.dataset.calcOp; if(o==="*"||o==="/") CALC.opmd=o; else CALC.op=o; render(); });
  $app.querySelectorAll('[data-calc-clear]').forEach(b=>b.onclick=()=>calcClear());
  /* Its own key, not settings — so this deliberately does NOT go through
     persist.settings(). See the EGS-STD:themes block for why. */
  $app.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{ nbSetTheme(b.dataset.themeSet); render(); toast('Theme: '+NB_THEME_LABEL[nbThemeMode()]); });
  /* EGS-STD:infomode — its own key too, and for the same reason as the theme
     above: it describes this phone, not the data, so persist.settings() is
     deliberately not involved. */
  $app.querySelectorAll('[data-guide-set]').forEach(b=>b.onclick=()=>{ nbGuideSet(b.dataset.guideSet==='on'); render(); toast(nbGuideOn()?'Beginner mode on':'Expert mode on'); });
  const gnX=$app.querySelector('[data-guide-notice-x]'); if(gnX) gnX.onclick=()=>nbGuideNoticeDismiss(false);
  nbHelpBind($app);
  $app.querySelectorAll('[data-units-set]').forEach(b=>b.onclick=()=>{ settings.units=b.dataset.unitsSet; persist.settings(); render(); });
  $app.querySelectorAll('[data-photo-preset]').forEach(b=>b.onclick=()=>{ settings.photoPreset=b.dataset.photoPreset; persist.settings(); render(); toast('Capture size: '+PHOTO_PRESETS[photoPresetKey()].label); });
  function calcBindWidget(id, slot){
    var root=$app.querySelector('[data-meas="'+id+'"]'); if(!root) return;
    root.querySelectorAll('input').forEach(function(inp){ inp.oninput=()=>{ CALC[slot]=measRead(root); calcRecompute(); }; });
  }
  calcBindWidget('c-a','a'); calcBindWidget('c-b','b');
  calcBindWidget('bf_t','bf_t'); calcBindWidget('bf_w','bf_w'); calcBindWidget('bf_l','bf_l');
  calcBindWidget('ar_w','ar_w'); calcBindWidget('ar_l','ar_l');
  calcBindWidget('sq_a','sq_a'); calcBindWidget('sq_b','sq_b');
  var cnum=$app.querySelector('#c-num'); if(cnum) cnum.oninput=()=>{ CALC.num=cnum.value; calcRecompute(); };

  /* Clear all done to-dos (in the To Do screen) */
  var clearDone=$app.querySelector('[data-clear-done]');
  if(clearDone) clearDone.onclick=()=>{
    var doneTasks=tasks.filter(t=>t.status==='done');
    if(!doneTasks.length) return;
    if(!confirm('Clear '+doneTasks.length+' completed to-do'+(doneTasks.length>1?'s':'')+'? This can\u2019t be undone.')) return;
    tasks=tasks.filter(t=>t.status!=='done'); persist.tasks(); render(); toast('Cleared '+doneTasks.length+' done');
  };

  /* Notes */
  $app.querySelectorAll('[data-note]').forEach(c=>c.onclick=()=>go('note',c.dataset.note));
  const saveNote=$app.querySelector('[data-save-note]'); if(saveNote) saveNote.onclick=()=>doSaveNote(saveNote.dataset.saveNote);
  const delNote=$app.querySelector('[data-del-note]'); if(delNote) delNote.onclick=()=>{
    if(!confirm('Delete this note?'))return; notes=notes.filter(n=>n.id!==delNote.dataset.delNote); persist.notes(); go('notes'); toast('Note deleted');
  };

  /* Search */
  const q=$app.querySelector('#q'); if(q){ q.oninput=()=>runSearch(q.value); setTimeout(()=>q.focus(),60); }

  /* Settings */
  const pin=$app.querySelector('[data-pin]'); if(pin) pin.onclick=()=>setupPin();
  const pinOff=$app.querySelector('[data-pin-off]'); if(pinOff) pinOff.onclick=()=>{ if(confirm('Turn off the app lock?')){ settings.pinHash=null; settings.pinSalt=null; persist.settings(); render(); toast('App lock off'); } };
  /* PIN_RECOVERY — issuing a new code retires the old one, so say so first. */
  const recoNew=$app.querySelector('[data-reco-new]');
  if(recoNew) recoNew.onclick=async()=>{
    if(recoveryExists() && !confirm('Issue a new recovery code?\n\nThe one you wrote down before will stop working.')) return;
    settings.recoveryOfferedAt=now();
    recoveryCodeSheet(await recoverySet(), false);
  };
  const vLock=$app.querySelector('[data-vault-lock]'); if(vLock) vLock.onclick=()=>{ vaultRelock(); toast('Protected projects locked'); };
  const unlockOpen=$app.querySelector('[data-unlock-open]'); if(unlockOpen) unlockOpen.onclick=()=>unlockPitch(false);
  const exp=$app.querySelector('[data-export]'); if(exp) exp.onclick=exportData;
  const imp=$app.querySelector('[data-import]'); if(imp) imp.onchange=importData;
  const impProj=$app.querySelector('[data-import-project]'); if(impProj) impProj.onchange=importSharedProject;
  $app.querySelectorAll('[data-share-app]').forEach(b=>b.onclick=doShareApp);
  $app.querySelectorAll('[data-pay-tab]').forEach(b=>b.onclick=()=>{
    supportTab=b.dataset.payTab;
    $app.querySelectorAll('[data-pay-tab]').forEach(x=>x.classList.toggle('primary',x.dataset.payTab===supportTab));
    const detail=document.getElementById('pay-detail'); if(detail){ detail.innerHTML=paymentDetailHtml(supportTab); bindCopyButtons(detail); }
  });
  bindCopyButtons($app);
}

function goBack(){
  /* Came here from the unlock pitch: put it back, with what was in it. */
  if(view.name==='privacy' && unlockReturnFromPrivacy()) return;
  if(view.name==='housenotes'){ go('house', view.param); return; }
  const to = ({house:'houses', note:'notes', search:'todo', privacy:'settings', support:'settings'})[view.name] || 'todo';
  go(to);
}

/* ============================================================
   EGS CORE — SUPPORT SECTION · v2
   Copy this block verbatim into every new EGS app. Do not edit
   the copy below — only PAYMENT_CONFIG and SHARE_APP_LINE (both

   carry that app's real payment links and its own pitch line.

   v2 — adds share-the-app: EGS_SHARE_GLYPH, appShareUrl(),
        doShareApp(), and the Share section inside
        egsSupportCoreHtml(). Hosts supply APP_NAME and
        SHARE_APP_LINE, and may place a second entry point (a
        header icon) that calls doShareApp() and draws
        EGS_SHARE_GLYPH — one handler, one glyph, no drift.
   v1 — every existing unversioned copy: support blurb, privacy
        row, payment tabs, footer. Roadside, KEPT, Stagger and
        WFD are all still v1 as of this edit.
   ============================================================ */

/* Feather "share-2", the glyph WFD uses — same path data, stroked
   currentColor so it takes the host app's icon colour. */
const EGS_SHARE_GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';

function appShareUrl(){
  /* the app's own directory URL, never a deep link into any state */
  return location.origin + location.pathname.replace(/[^/]*$/, '');
}
/* The ONE share handler. Every entry point calls this. It can only ever send
   the public app link: no project, photo, note, setting or vault state is
   reachable from here, and keeping that true is the point. */
async function doShareApp(){
  const url=appShareUrl();
  if(navigator.share){
    try{
      await navigator.share({ title:APP_NAME, text:SHARE_APP_LINE, url });
      return;                                     /* the OS sheet said its piece */
    }catch(err){
      if(err && err.name==='AbortError') return;  /* user backed out — say nothing */
      /* anything else: fall through to the clipboard rather than swallow it */
    }
  }
  try{
    await navigator.clipboard.writeText(SHARE_APP_LINE+' '+url);
    toast('Link copied');
  }catch(e){
    /* clipboard refused (insecure context, permissions) — show it instead of
       swallowing it, so there is always a way to get the link out */
    sheet('<h2>Share '+esc(APP_NAME)+'</h2>'
      +'<div class="muted" style="font-size:13px;margin-bottom:10px">Copy this and send it on:</div>'
      +'<div class="card mono" style="font-size:12.5px;word-break:break-all;line-height:1.6">'
      +esc(SHARE_APP_LINE+' '+url)+'</div>'
      +'<button class="btn primary block" data-copy="'+esc(SHARE_APP_LINE+' '+url)+'" style="margin-top:10px">Copy</button>');
    bindCopyButtons($mr);
  }
}

function openEditTask(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const opts=pickableHouses(t.houseId).map(h=>`<option value="${h.id}" ${t.houseId===h.id?'selected':''}>${esc(h.name)}</option>`).join('');
  sheet(`<h2>Edit to-do</h2>
    <div class="field"><input class="input" id="t-text" value="${esc(vt(t.text))}"></div>
    <div class="field"><label>Project</label><select class="input" id="t-house"><option value="">— none —</option>${opts}</select></div>
    <div class="field"><label>Status</label><select class="input" id="t-status">${Object.keys(STATUS_LABEL).map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <button class="btn primary block" id="t-save">Save</button>
    <button class="btn danger block" id="t-del" style="margin-top:10px">${I.trash} Delete</button>`);
  $mr.querySelector('#t-save').onclick=async()=>{
    const txt=$mr.querySelector('#t-text').value.trim(); if(!txt)return;
    t.text=txt; t.houseId=$mr.querySelector('#t-house').value||null; t.status=$mr.querySelector('#t-status').value;
    t.doneAt=t.status==='done'?now():null; t.updatedAt=now();
    if(!(await vaultAlignRecord(t,['text'],t.houseId))){ toast('Unlock the vault to save that'); return; }
    persist.tasks(); closeSheet(); render();
  };
  $mr.querySelector('#t-del').onclick=()=>{ if(!confirm('Delete this to-do?'))return; tasks=tasks.filter(x=>x.id!==id); persist.tasks(); closeSheet(); render(); toast('Deleted'); };
}

async function doSaveNote(id){
  const title=$app.querySelector('#note-title').value.trim();
  const body=$app.querySelector('#note-body').value;
  const houseId=$app.querySelector('#note-house').value||null;
  const important=$app.querySelector('#note-important').checked;
  if(!title && !body.trim()){ go('notes'); return; }
  let rec;
  if(id==='new'){ rec={id:uid(),title,body,houseId,important,createdAt:now(),updatedAt:now()}; notes.push(rec); }
  else{ rec=notes.find(x=>x.id===id); if(rec){ rec.title=title; rec.body=body; rec.houseId=houseId; rec.important=important; rec.updatedAt=now(); } }
  /* VAULT_TOGGLE — align with wherever it now lives, then write. Moving a note
     into a protected project seals it; moving one out unseals it. */
  if(rec && !(await vaultAlignRecord(rec,['title','body'],houseId))){ toast('Unlock the vault to save that'); return; }
  persist.notes(); go(houseId&&isProtected(houseId)?'house':'notes', houseId&&isProtected(houseId)?houseId:null); toast('Saved');
}

async function handlePhoto(e,houseId){
  captureEnd();                                    /* VAULT_CAPTURE — the file landed */
  const files=e.target.files?Array.from(e.target.files):[];
  e.target.value='';
  if(!files.length) return;
  const h=houseById(houseId); if(!h) return;
  const multi=files.length>1;
  toast(multi?`Saving ${files.length} photos…`:'Saving photo…');
  h.photos=h.photos||[];
  let saved=0, failed=0, needKey=0;
  for(const file of files){
    let blob=null;
    try{ blob=await preparePhotoBlob(file, photoPresetKey(), false); }catch(err){ failed++; continue; }
    try{
      const id=uid();
      /* VAULT_ENVELOPE — written the instant it exists, whatever the lock
         state. Then the list is persisted immediately rather than at the end of
         the batch, so a death mid-batch strands at most one record — and the
         boot sweep re-attaches even that. */
      await photoPutFor(houseId,{id,blob,houseId,createdAt:now()});
      h.photos.push(id);
      if(!h.cover) h.cover=id;
      h.updatedAt=now(); persist.houses();
      saved++;
    }catch(err){
      if(String(err&&err.message)==='no capture key') needKey++; else failed++;
    }
  }
  render();
  if(needKey) toast('Unlock the vault once to turn on locked capture');
  else if(saved && failed) toast(`${saved} saved, ${failed} could not be read`);
  else if(failed) toast('Could not read those images');
  else if(saved) toast(multi?`${saved} photos saved`:'Photo saved');
}

/* ============================================================
   VAULT_CAMERA — in-app viewfinder
   ------------------------------------------------------------
   Android reclaims the browser process during the native-camera hand-off, so
   the file-input result never arrives and the photo is lost before any app
   code sees it. The cure is not to hand off: we never leave the app, so there
   is no window for the OS to kill. The shutter feeds the same envelope write
   path everything else uses.
   ============================================================ */
const $camera=document.getElementById('camera');
let cam={ open:false, houseId:null, stream:null, imageCapture:null,
          devices:[], deviceId:null, presetKey:'standard', shot:null, error:null };

function camStop(){
  /* Complete teardown: tracks stopped, srcObject cleared, references dropped.
     A live indicator light after leaving the viewfinder is not acceptable. */
  /* CAM_TORCH — the lamp goes out here, and therefore on every exit: close,
     cancel, lens switch, backgrounding and pagehide all arrive through this
     function. Not awaited, because this is synchronous and pagehide gives
     nothing to wait in; the t.stop() below is the hard guarantee, since a
     released track releases the lamp with it. */
  try{
    const _t=cam.stream && cam.stream.getVideoTracks && cam.stream.getVideoTracks()[0];
    if(_t && cam.torchOn){ try{ _t.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
  }catch(e){}
  cam.torchOn=false; cam.torchCap=false; cam.fillFlash=false; cam.flashMode='off';
  try{ if(cam.stream) cam.stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); }catch(e){}
  cam.stream=null; cam.imageCapture=null;
  const v=document.getElementById('cam-video');
  if(v){ try{ v.pause(); }catch(e){} try{ v.srcObject=null; }catch(e){} }
}
function camClose(){
  camStop();
  if(cam.shot && cam.shot.url){ try{ URL.revokeObjectURL(cam.shot.url); }catch(e){} }
  cam={ open:false, houseId:null, stream:null, imageCapture:null,
        devices:[], deviceId:null, presetKey:'standard', shot:null, error:null };
  $camera.classList.add('hidden'); $camera.innerHTML='';
  document.body.style.overflow='';
  render();
}

async function openCamera(houseId){
  const h=houseById(houseId); if(!h) return;
  cam={ open:true, houseId, stream:null, imageCapture:null, devices:[], deviceId:null,
        presetKey:photoPresetKey(), shot:null, error:null };
  document.body.style.overflow='hidden';
  $camera.classList.remove('hidden');
  if(!settings.camIntroSeen){ camDrawIntro(); return; }
  camDrawLoading();
  await camStart();
}
