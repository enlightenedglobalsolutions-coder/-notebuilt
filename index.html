    copy:'Your PIN keeps casual hands out of the app. It does not encrypt anything \u2014 '
        +'your <b>vault passphrase</b> does, and that is the way back in. Enter it to set a new PIN.',
    field:'<div class="field">'+pwField('r-vp','Vault passphrase','current-password')+'</div>',
    go:'Continue', onBack:back });
  bindPwEyes($lock);
  setTimeout(()=>{ const el=$lock.querySelector('#r-vp'); if(el) el.focus(); },60);
  const run=async()=>{
    const inp=$lock.querySelector('#r-vp'), pass=inp.value; if(!pass) return;
    ui.go.setAttribute('disabled',''); ui.go.textContent='Checking\u2026';
    /* Checked and dropped. Resetting a PIN does not widen into vault access. */
    const key=await vaultKeyFor(pass, settings.vault);
    if(key){ newPinAfterRecovery(false); return; }
    await new Promise(r=>setTimeout(r,1000));
    ui.go.removeAttribute('disabled'); ui.go.textContent='Continue';
    ui.err.textContent='That is not your vault passphrase.';
  };
  ui.go.onclick=run;
  $lock.querySelector('#r-vp').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
}

function forgotViaCode(back){
  const ui=lockPrompt({
    title:'Forgot PIN',
    copy:'Enter the recovery code you wrote down. Dashes and capitals do not matter. '
        +'It works <b>once</b> \u2014 a fresh one is issued straight after.',
    field:'<div class="field"><label>Recovery code</label>'
         +'<input class="input" id="r-code" autocomplete="off" autocapitalize="characters" '
         +'autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX"></div>',
    go:'Continue', onBack:back });
  setTimeout(()=>{ const el=$lock.querySelector('#r-code'); if(el) el.focus(); },60);
  const run=async()=>{
    const inp=$lock.querySelector('#r-code'); if(!recoveryNormalize(inp.value)) return;
    ui.go.setAttribute('disabled',''); ui.go.textContent='Checking\u2026';
    if(await recoveryVerify(inp.value)){ newPinAfterRecovery(true); return; }
    await new Promise(r=>setTimeout(r,1000));
    ui.go.removeAttribute('disabled'); ui.go.textContent='Continue';
    ui.err.textContent='That code does not match. Check for a mistyped letter.';
  };
  ui.go.onclick=run;
  $lock.querySelector('#r-code').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
}

/* The honest answer. No vault, no code, no way through — and no pretending. */
function forgotDeadEnd(back){
  lockPrompt({
    title:'Forgot PIN',
    copy:'Nothing was set up on this device to get back in, so there is no way past this '
        +'screen \u2014 not by me, not by anyone.<br><br>Your projects are still on the phone and '
        +'still intact. If you have a backup file, install the app fresh and restore it: a backup '
        +'is not protected by the PIN, and restoring it lets you set a new one.',
    onBack:back, back:'Back to the keypad' });
}

function recoveryCodeHtml(code, spent){
  return '<div class="lock-copy">'+(spent
      ? 'That code is spent. Here is your new one \u2014 <b>write it down before you continue</b>.'
      : '<b>Write this down</b> and keep it somewhere safe. It is how you get back into the app if you forget your PIN.')
    +'</div><div class="reco-code">'+esc(code)+'</div>'
    +'<div class="lock-copy" style="font-size:12.5px;margin-top:10px">Only a hash of it is stored, so it can never be shown again. '
    +'Lose it and you can issue a new one from Settings.</div>';
}
function showRecoveryCode(code, spent, onDone){
  $lock.classList.remove('hidden');
  $lock.innerHTML='<div class="mark">'+MARK+'</div><div class="name">Recovery code</div>'
    +recoveryCodeHtml(code, spent)
    +'<div class="lock-actions"><button type="button" class="btn primary block" data-done>I have written it down</button></div>';
  $lock.querySelector('[data-done]').onclick=onDone;
}
function recoveryCodeSheet(code, spent){
  sheet('<h2>Recovery code</h2>'+recoveryCodeHtml(code, spent)
    +'<button class="btn primary block" style="margin-top:16px" data-done>I have written it down</button>');
  $mr.querySelector('[data-done]').onclick=()=>{ closeSheet(); render(); };
}

/* Confirm-twice, built once, same rules as the keypad it replaces. */
function newPinAfterRecovery(viaCode){
  let stage=1, first='', entry='', busy=false;
  $lock.classList.remove('hidden');
  $lock.innerHTML='<div class="mark">'+MARK+'</div><div class="name">Set a new PIN</div>'
    +'<div class="hint" data-pin-msg>Choose a 4-digit PIN</div>'
    +'<div class="dots">'+[0,1,2,3].map(()=>'<div class="d"></div>').join('')+'</div>'
    +'<div class="err"></div>'
    +'<div class="keypad">'+PIN_KEYPAD_HTML+'</div>';
  const $dots=[...$lock.querySelectorAll('.dots .d')];
  const $msg=$lock.querySelector('[data-pin-msg]'), $err=$lock.querySelector('.err');
  const paint=(msg,err)=>{
    $dots.forEach((d,i)=>d.classList.toggle('on', i<entry.length));
    if(msg!==undefined) $msg.textContent=msg;
    if(err!==undefined) $err.textContent=err||'';
  };
  const done=()=>{ $lock.classList.add('hidden'); $lock.innerHTML=''; showShell(true); render(); toast('New PIN set'); };
  $lock.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
    if(busy) return;
    const k=b.dataset.k;
    if(k==='del'){ entry=entry.slice(0,-1); paint(undefined,''); return; }
    if(entry.length>=4) return;
    entry+=k; paint(undefined,'');
    if(entry.length<4) return;
    if(stage===1){ first=entry; entry=''; stage=2; paint('Re-enter to confirm'); return; }
    if(entry!==first){ entry=''; stage=1; first=''; paint('Choose a 4-digit PIN','Did not match \u2014 start again'); return; }
    busy=true;
    const salt=randSalt(); settings.pinSalt=salt; settings.pinHash=await sha(first+salt);
    persist.settings();
    /* Single use: the code that opened this door is spent, so mint the next one
       before letting go of the screen that can show it. */
    if(viaCode){ const code=await recoverySet(); busy=false; showRecoveryCode(code, true, done); }
    else { busy=false; done(); }
  });
}

/* One offer, on one unlock, for installs that predate any of this. Recorded the
   moment it is SHOWN, not when it is answered — being asked twice is nagging. */
function maybeOfferRecoveryCode(){
  if(!settings.pinHash) return;
  if(vaultExists() || recoveryExists()) return;
  if(settings.recoveryOfferedAt) return;
  if($mr.innerHTML) return;                    /* something else already has the screen */
  settings.recoveryOfferedAt=now(); persist.settings();
  sheet('<h2>A way back into the app</h2>'
    +'<div class="muted" style="font-size:13.5px;line-height:1.62">'+esc(HELP_COPY['pin-recovery'])
    +'<br><br>But if you forget the PIN right now, there is no way back in. Generate a one-time '
    +'recovery code and write it down \u2014 you will only be asked this once.</div>'
    +'<div style="display:flex;gap:10px;margin-top:16px">'
    +'<button class="btn primary" style="flex:1" data-reco-go>Generate a code</button>'
    +'<button class="btn" style="flex:1" data-reco-no>Not now</button></div>');
  $mr.querySelector('[data-reco-no]').onclick=closeSheet;
  $mr.querySelector('[data-reco-go]').onclick=async()=>{ recoveryCodeSheet(await recoverySet(), false); };
}

/* PIN_STEADY — one keypad, both callers. type="button" because these
   defaulted to type="submit"; the blank cell is not a tab stop. */
const PIN_KEYPAD_HTML =
  [1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')
  + '<button type="button" class="blank" tabindex="-1" aria-hidden="true"></button>'
  + '<button type="button" data-k="0">0</button>'
  + '<button type="button" data-k="del" aria-label="Delete">\u232B</button>';

const $lock=document.getElementById('lock');
function showShell(show){ document.getElementById('app').classList.toggle('hidden',!show); $nav.classList.toggle('hidden',!show); }

function lockGate(){
  if(!settings.pinHash){ $lock.classList.add('hidden'); showShell(true); render(); maybeShowInstallPrompt(); maybeShowDataSafetyNudge(); return; }
  showShell(false); $fab.classList.add('hidden');
  let entry='';
  /* PIN_STEADY — built ONCE, on the way in.
     The old code re-assigned $lock.innerHTML on every digit: 27 nodes torn
     down and rebuilt, including the button still under the thumb, which held
     focus at that instant. Focus fell to <body> and iOS answered by scrolling
     the screen down. Desktop Chrome moved 0px for the same code, which is why
     it only ever showed up on the phone.
     A keypress now writes two things: four dot classes, and one line of text. */
  $lock.classList.remove('hidden');
  $lock.innerHTML=`<div class="mark">${MARK}</div><div class="name">${esc(APP_NAME)}</div>
      <div class="hint">Enter PIN</div>
      <div class="dots">${[0,1,2,3].map(()=>'<div class="d"></div>').join('')}</div>
      <div class="err"></div>
      <div class="keypad">${PIN_KEYPAD_HTML}</div>
      <button type="button" class="lock-link" data-forgot>Forgot PIN?</button>
      ${versionStamp()}`;
  $lock.querySelector('[data-forgot]').onclick=forgotPinFlow;   /* PIN_RECOVERY */
  const $dots=[...$lock.querySelectorAll('.dots .d')];
  const $err=$lock.querySelector('.err');
  /* The whole of what a keypress changes. No node is created or destroyed,
     so nothing can take focus, lose it, or be re-laid-out under a finger. */
  const paint=(err)=>{
    $dots.forEach((d,i)=>d.classList.toggle('on', i<entry.length));
    if(err!==undefined) $err.textContent=err||'';
  };
  let busy=false;
  $lock.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
    if(busy) return;
    const k=b.dataset.k;
    if(k==='del'){ entry=entry.slice(0,-1); paint(''); return; }
    if(entry.length>=4) return;
    entry+=k; paint('');
    if(entry.length===4){
      /* The hash is async, so the fourth dot is already painted and taps are
         held off until it answers — otherwise a fast fifth tap lands mid-check. */
      busy=true;
      const ok=(await sha(entry+settings.pinSalt))===settings.pinHash;
      busy=false;
      if(ok){ $lock.classList.add('hidden'); showShell(true); render(); maybeShowInstallPrompt(); maybeShowDataSafetyNudge(); maybeOfferRecoveryCode(); }
      else{ entry=''; paint('Wrong PIN'); }
    }
  });
}

function setupPin(){
  let stage=1, first='', entry='';
  /* PIN_STEADY — the sheet is built once. The old draw() called sheet() per
     digit, which rebuilt the scrim as well as the keypad and re-registered the
     scrim's click handler each time. This is the CHANGE-PIN path too.
     Confirm-twice is unchanged: stage 1 takes the PIN, stage 2 demands it
     again, and that is true whether the PIN is new or being changed. */
  sheet(`<h2>${settings.pinHash?'Change PIN':'Set a PIN'}</h2>
      <div class="muted" data-pin-msg style="text-align:center;margin-bottom:6px"></div>
      <div class="dots" style="justify-content:center">${[0,1,2,3].map(()=>'<div class="d"></div>').join('')}</div>
      <div class="keypad" style="margin:14px auto 4px">${PIN_KEYPAD_HTML}</div>`);
  const $dots=[...$mr.querySelectorAll('.dots .d')];
  const $msg=$mr.querySelector('[data-pin-msg]');
  const paint=(msg)=>{
    $dots.forEach((d,i)=>d.classList.toggle('on', i<entry.length));
    if(msg!==undefined) $msg.textContent=msg;
  };
  paint('Choose a 4-digit PIN');
  let busy=false;
  $mr.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
    if(busy) return;
    const k=b.dataset.k;
    if(k==='del'){ entry=entry.slice(0,-1); paint(); return; }
    if(entry.length>=4) return;
    entry+=k; paint();
    if(entry.length<4) return;
    if(stage===1){ first=entry; entry=''; stage=2; paint('Re-enter to confirm'); return; }
    if(entry===first){
      busy=true;
      const salt=randSalt(); settings.pinSalt=salt; settings.pinHash=await sha(first+salt);
      persist.settings(); busy=false;
      render(); toast('App lock on');
      /* PIN_RECOVERY — a PIN with no way back is a trap. With no vault passphrase
         to fall back on, the code is minted here, at the one moment the person is
         already thinking about how they get in. */
      if(!vaultExists() && !recoveryExists()){
        settings.recoveryOfferedAt=now();
        recoveryCodeSheet(await recoverySet(), false);
      } else closeSheet();
    } else {
      entry=''; stage=1; first=''; paint('Did not match \u2014 try again');
    }
  });
}

/* ============================================================
   VAULT_CEREMONY — setup, unlock, and the encrypt/decrypt progress overlay
   ============================================================ */
const $vault=document.getElementById('vault');

/* VAULT_EYE — every passphrase field can be revealed. Default hidden, one
   toggle per field, no global "show all". A hidden double-typo at creation is
   the worst thing this feature can do to someone, because there is no recovery
   and no way to find out until it is far too late. */
function pwField(id, placeholder, autocomplete){
  return '<span class="pw-wrap">'
    +'<input class="input" type="password" id="'+id+'"'
    +(placeholder?' placeholder="'+esc(placeholder)+'"':'')
    +' autocomplete="'+(autocomplete||'current-password')+'"'
    +' autocapitalize="off" autocorrect="off" spellcheck="false">'
    +'<button type="button" class="pw-eye" data-pw-eye="'+id+'"'
    +' aria-label="Show passphrase" aria-pressed="false">'+I.eye+'</button>'
    +'</span>';
}
function bindPwEyes(scope){
  scope.querySelectorAll('[data-pw-eye]').forEach(b=>b.onclick=()=>{
    const inp=scope.querySelector('#'+b.getAttribute('data-pw-eye')); if(!inp) return;
    const reveal = inp.type==='password';
    inp.type = reveal ? 'text' : 'password';
    b.setAttribute('aria-pressed', reveal?'true':'false');
    b.setAttribute('aria-label', reveal?'Hide passphrase':'Show passphrase');
    b.innerHTML = reveal ? I.eyeOff : I.eye;
    /* keep the caret where it was — retyping from scratch is the thing we are
       trying to avoid */
    const v=inp.value; inp.focus(); try{ inp.setSelectionRange(v.length,v.length); }catch(e){}
  });
}
function vaultOverlay(html){
  $vault.classList.remove('hidden');
  $vault.innerHTML=html;
  document.body.style.overflow='hidden';
}
function vaultCloseOverlay(){
  $vault.classList.add('hidden'); $vault.innerHTML='';
  document.body.style.overflow='';
}

/* ---------- progress overlay (driven by encrypt/decrypt-in-place) ---------- */
let _vaultBusyEl=null;
function vaultBusy(title, sub, pct){
  if(!_vaultBusyEl){
    _vaultBusyEl=document.createElement('div'); _vaultBusyEl.id='vault-busy';
    _vaultBusyEl.innerHTML='<div class="vb-t"></div><div class="vb-s"></div><div class="vb-bar"><div class="vb-fill"></div></div>';
    document.body.appendChild(_vaultBusyEl);
  }
  _vaultBusyEl.querySelector('.vb-t').textContent=title||'';
  _vaultBusyEl.querySelector('.vb-s').textContent=sub||'';
  const bar=_vaultBusyEl.querySelector('.vb-bar'), fill=_vaultBusyEl.querySelector('.vb-fill');
  if(pct==null) bar.style.display='none';
  else { bar.style.display=''; fill.style.width=Math.max(0,Math.min(100,pct))+'%'; }
  /* Yield so the bar actually paints between records. setTimeout, NOT
     requestAnimationFrame: rAF does not fire while the app is backgrounded, so
     an rAF-based yield stalls a whole encrypt/decrypt pass for as long as the
     app is out of sight. setTimeout keeps firing either way. */
  return new Promise(r=>setTimeout(r,0));
}
function vaultBusyDone(){ if(_vaultBusyEl){ _vaultBusyEl.remove(); _vaultBusyEl=null; } }

/* ---------- the setup ceremony: gates 1-3 ----------
   Resolves true once settings.vault exists and the key is in memory. */
function vaultRunCeremony(){
  return new Promise(resolve=>{
    const cancel=()=>{ vaultCloseOverlay(); resolve(false); };

    /* Gate 1 — the warning. Verbatim. This is the whole point of the ceremony. */
    const gate1=()=>{
      vaultOverlay('<div class="v-steps">Step 1 of 4 &middot; Read this</div>'
        +'<div class="v-mark">'+I.lock+'</div>'
        +'<h2>Before you protect anything</h2>'
        +'<div class="v-copy">This is where you keep your passwords and sensitive data. '
        +'Keep this passphrase in your mind <b>AND</b> written down in a safe place. '
        +'Treat it like your passport, like your gold bars.<br><br>'
        +'There is <b>NO recovery</b>. EGS cannot reset, recover, or bypass this &mdash; '
        +'not won\'t, <b>CAN\'T</b>.</div>'
        +'<div class="v-actions">'
        +'<button class="btn primary block" data-v-next>I understand &mdash; continue</button>'
        +'<button class="btn block" data-v-cancel>Cancel</button></div>');
      $vault.querySelector('[data-v-next]').onclick=()=>gate2();
      $vault.querySelector('[data-v-cancel]').onclick=cancel;
    };

    /* Gate 2 — the passphrase, twice. */
    const gate2=(err)=>{
      vaultOverlay('<div class="v-steps">Step 2 of 4 &middot; Choose a passphrase</div>'
        +'<h2>Your vault passphrase</h2>'
        +'<div class="v-copy">Separate from your app PIN, and not stored anywhere. '
        +'Longer beats clever &mdash; <b>a short sentence beats P@ss1</b>. '
        +'Minimum '+VAULT_MIN_PASS+' characters.</div>'
        +'<div class="field"><label>Passphrase</label>'+pwField('v-p1','','new-password')+'</div>'
        +'<div class="field"><label>Type it again</label>'+pwField('v-p2','','new-password')+'</div>'
        +'<div class="v-err">'+esc(err||'')+'</div>'
        +'<div class="v-actions">'
        +'<button class="btn primary block" data-v-next>Continue</button>'
        +'<button class="btn block" data-v-cancel>Cancel</button></div>');
      bindPwEyes($vault);
      setTimeout(()=>{ const el=$vault.querySelector('#v-p1'); if(el) el.focus(); },60);
      $vault.querySelector('[data-v-cancel]').onclick=cancel;
      $vault.querySelector('[data-v-next]').onclick=()=>{
        const p1=$vault.querySelector('#v-p1').value, p2=$vault.querySelector('#v-p2').value;
        if(p1.length<VAULT_MIN_PASS){ gate2('Use at least '+VAULT_MIN_PASS+' characters.'); return; }
        if(p1!==p2){ gate2('Those two do not match.'); return; }
        gate3(p1);
      };
    };

    /* Gate 3 — the forced acknowledgement. Continue stays dead until it's ticked. */
    const gate3=(pass)=>{
      vaultOverlay('<div class="v-steps">Step 3 of 4 &middot; Write it down</div>'
        +'<h2>Put it somewhere safe</h2>'
        +'<div class="v-copy">Now, before you go any further. Not in this app &mdash; on paper, '
        +'or wherever you keep the things you cannot afford to lose.</div>'
        +'<label class="v-check"><input type="checkbox" id="v-ack"><span>I have written my '
        +'passphrase down and stored it safely. I understand a lost passphrase means my '
        +'protected data is gone forever.</span></label>'
        +'<div class="v-actions">'
        +'<button class="btn primary block" data-v-next disabled>Continue</button>'
        +'<button class="btn block" data-v-cancel>Cancel</button></div>');
      const ack=$vault.querySelector('#v-ack'), next=$vault.querySelector('[data-v-next]');
      ack.onchange=()=>{ if(ack.checked) next.removeAttribute('disabled'); else next.setAttribute('disabled',''); };
      $vault.querySelector('[data-v-cancel]').onclick=cancel;
      next.onclick=()=>{ if(ack.checked) create(pass); };
    };

    /* Derive the key and store salt + verifier. The passphrase itself is never
       written down anywhere by us — only the ciphertext of a known string. */
    const create=async (pass)=>{
      await vaultBusy('Setting up your vault','Deriving your key — this takes a moment');
      try{
        const salt=b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
        _vaultKey=await vaultDeriveKey(pass, salt);
        const verifier=await vaultSealText(VAULT_VERIFIER_TEXT);
        settings.vault={ salt, verifier, migration:null };
        persist.settings();
        /* VAULT_ENVELOPE — the capture keypair exists from the very first
           moment the vault does, so a locked capture is never unsupported. */
        await vaultEnsureEnvelopeKeys();
        vaultTouch();
        vaultBusyDone(); vaultCloseOverlay(); resolve(true);
      }catch(e){
        _vaultKey=null; vaultBusyDone();
        gate2('Could not set up the vault — try again.');
      }
    };

    gate1();
  });
}

/* Gate 4 — the project is locked as of right now, and you open it once here
   before anything can go into it. No skip: proving the passphrase works is the
   entire reason this gate exists. */
function vaultVerificationGate(){
  return new Promise(resolve=>{
    vaultRelock(true);
    const draw=(err)=>{
      vaultOverlay('<div class="v-steps">Step 4 of 4 &middot; Prove it works</div>'
        +'<div class="v-mark">'+I.lock+'</div>'
        +'<h2>Unlock it once, now</h2>'
        +'<div class="v-copy">Your project is locked. Open it with the passphrase you just '
        +'wrote down &mdash; before you put anything in it. If what you wrote down doesn\'t '
        +'work, this is the moment to find out.</div>'
        +'<div class="field"><label>Vault passphrase</label>'+pwField('v-vp','','current-password')+'</div>'
        +'<div class="v-err">'+esc(err||'')+'</div>'
        +'<div class="v-actions"><button class="btn primary block" data-v-go>Unlock</button></div>');
      bindPwEyes($vault);
      setTimeout(()=>{ const el=$vault.querySelector('#v-vp'); if(el) el.focus(); },60);
      const go=async()=>{
        const btn=$vault.querySelector('[data-v-go]'), inp=$vault.querySelector('#v-vp');
        const pass=inp.value; if(!pass) return;
        btn.setAttribute('disabled',''); btn.textContent='Unlocking…';
        if(await vaultUnlock(pass)){ vaultCloseOverlay(); resolve(true); return; }
        await new Promise(r=>setTimeout(r,1000));
        draw('That is not the passphrase. Your data is untouched — try again.');
      };
      $vault.querySelector('[data-v-go]').onclick=go;
      $vault.querySelector('#v-vp').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    };
    draw();
  });
}

/* ---------- the everyday unlock ---------- */
function vaultUnlockSheet(opts){
  opts=opts||{};
  const draw=(err)=>{
    sheet('<h2>'+esc(opts.title||'Unlock protected projects')+'</h2>'
      +'<div class="muted" style="font-size:13px;margin-bottom:14px">'
      +esc(opts.body||'Enter your vault passphrase. This is not your app PIN.')+'</div>'
      +'<div class="field">'+pwField('v-up','Vault passphrase','current-password')+'</div>'
      +'<div class="v-err">'+esc(err||'')+'</div>'
      +'<button class="btn primary block" id="v-ugo">Unlock</button>');
    bindPwEyes($mr);
    setTimeout(()=>{ const el=$mr.querySelector('#v-up'); if(el) el.focus(); },60);
    const go=async()=>{
      const btn=$mr.querySelector('#v-ugo'), inp=$mr.querySelector('#v-up');
      const pass=inp.value; if(!pass) return;
      btn.setAttribute('disabled',''); btn.textContent='Unlocking…';
      if(await vaultUnlock(pass)){
        closeSheet();
        if(opts.onOpen) opts.onOpen(); else render();
        return;
      }
      /* Wrong passphrase costs a deliberate one-second pause. No lockout, no counter. */
      await new Promise(r=>setTimeout(r,1000));
      draw('That passphrase did not open the vault.');
    };
    $mr.querySelector('#v-ugo').onclick=go;
    $mr.querySelector('#v-up').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  };
  draw();
}

function vaultStatusLine(){
  if(!vaultExists()) return 'Not set up — nothing on this device is encrypted yet.';
  return vaultUnlocked()
    ? 'Unlocked. Relocks after 15 minutes idle, or the moment you leave the app.'
    : 'Locked. Your vault passphrase opens it.';
}
function protectedCount(){ return houses.filter(h=>h.protected).length; }

/* ============================================================
   VAULT_TOGGLE — protect on/off, encrypt-in-place, and the delete escape
   ============================================================ */
let _vaultMigrating=false;

/* Bring a record's fields into line with where it now lives: sealed inside a
   protected project, plain outside one. Handles a note being moved either way. */
async function vaultAlignRecord(rec, fields, houseId){
  const want=isProtected(houseId);
  if(!vaultUnlocked()){
    /* Nothing to do if it is already in the right shape; otherwise refuse
       rather than write the wrong thing. */
    return !fields.some(f=>isEnc(rec[f])!==want);
  }
  for(const f of fields){
    if(want){
      if(isEnc(rec[f])) continue;
      const plain=rec[f]==null?'':String(rec[f]);
      rec[f]=await vaultSealText(plain);
      _vaultCache.set(rec[f].iv, plain);      /* keep the open screen readable */
    }else{
      if(!isEnc(rec[f])) continue;
      rec[f]=await vaultOpenText(rec[f]);
    }
  }
  return true;
}

/* One record, one direction. Both vaultSealField and vaultOpenField are no-ops
   on a record that is already in the target state — that is what makes an
   interrupted run safe to simply re-run. */
async function vaultMigrateOne(h, job, seal){
  const conv = seal ? vaultSealField : vaultOpenField;
  if(job.kind==='house'){
    h.address=await conv(h.address); h.notes=await conv(h.notes); persist.houses(); return;
  }
  if(job.kind==='spec'){
    const s=(h.specs||[]).find(x=>x.id===job.id); if(!s) return;
    s.room=await conv(s.room); s.label=await conv(s.label);
    s.value=await conv(s.value); s.note=await conv(s.note); persist.houses(); return;
  }
  if(job.kind==='note'){
    const n=notes.find(x=>x.id===job.id); if(!n) return;
    n.title=await conv(n.title); n.body=await conv(n.body); persist.notes(); return;
  }
  if(job.kind==='task'){
    const t=tasks.find(x=>x.id===job.id); if(!t) return;
    t.text=await conv(t.text); persist.tasks(); return;
  }
  if(job.kind==='photo'){
    const rec=await photoGet(job.id); if(!rec) return;
    const stale=_objUrls.get(job.id);
    if(stale){ URL.revokeObjectURL(stale); _objUrls.delete(job.id); _vaultUrlIds.delete(job.id); }
    if(seal){
      if(isEncPhoto(rec)) return;                       /* already sealed — resume skips it */
      const sealed=await vaultSealBytes(new Uint8Array(await rec.blob.arrayBuffer()));
      const out={ id:rec.id, enc:1, iv:sealed.iv, ct:sealed.ct,
                  type:(rec.blob&&rec.blob.type)||'image/jpeg',
                  houseId:rec.houseId, createdAt:rec.createdAt };
      if(rec.cropped) out.cropped=true;
      await photoPut(out);
    }else{
      if(!isEncPhoto(rec)) return;                      /* already plain */
      const pt=await vaultOpenBytes(rec.iv, rec.ct);
      const out={ id:rec.id, blob:new Blob([pt],{type:rec.type||'image/jpeg'}),
                  houseId:rec.houseId, createdAt:rec.createdAt };
      if(rec.cropped) out.cropped=true;
      await photoPut(out);
    }
    return;
  }
}

/* The pass itself. Photos go last: they are the slow part, and the text records
   are cheap enough that the bar moves straight away. */
async function vaultRunMigration(houseId, dir){
  if(_vaultMigrating) return false;
  const h=houseById(houseId); if(!h) return false;
  if(!vaultUnlocked()) return false;
  const seal = dir==='on';
  _vaultMigrating=true;
  const jobs=[{kind:'house'}];
  (h.specs||[]).forEach(s=>jobs.push({kind:'spec',id:s.id}));
  notes.forEach(n=>{ if(n.houseId===houseId) jobs.push({kind:'note',id:n.id}); });
  tasks.forEach(t=>{ if(t.houseId===houseId) jobs.push({kind:'task',id:t.id}); });
  (h.photos||[]).forEach(pid=>jobs.push({kind:'photo',id:pid}));
  const total=jobs.length;
  const title=seal?('Protecting '+h.name):('Removing protection');
  const sub=seal?'Encrypting on this device':'Decrypting on this device';
  try{
    await vaultBusy(title, sub, 0);
    for(let i=0;i<jobs.length;i++){
      await vaultMigrateOne(h, jobs[i], seal);
      await vaultBusy(title, sub+' — '+(i+1)+' of '+total, Math.round(((i+1)/total)*100));
    }
    /* Cleared LAST, for the same reason it was set first. */
    if(!seal) h.protected=false;
    h.updatedAt=now(); persist.houses();
    if(settings.vault) settings.vault.migration=null;
    persist.settings();
    _vaultCache.clear();
    vaultBusyDone(); _vaultMigrating=false;
    return true;
  }catch(err){
    vaultBusyDone(); _vaultMigrating=false;
    /* The journal stays put. The project stays protected and renders locked, and
       reopening it picks up exactly where this stopped. Nothing is lost.
       Losing the key mid-pass (the app was backgrounded) is the expected case,
       not a fault, so say so plainly rather than reporting a failure. */
    alert(vaultUnlocked()
      ? 'That did not finish.\n\nNothing was lost — open the project again and it will carry on from where it stopped.'
      : 'The vault locked before that finished.\n\nNothing was lost — unlock the project again and it will carry on from where it stopped.');
    return false;
  }
}

/* An interrupted pass finishes itself the next time the vault opens. */
async function vaultResumeMigration(){
  const m=settings.vault&&settings.vault.migration;
  if(!m || !vaultUnlocked() || _vaultMigrating) return;
  const h=houseById(m.houseId);
  if(!h){ settings.vault.migration=null; persist.settings(); return; }
  if(await vaultRunMigration(m.houseId, m.dir)){ render(); toast('Finished where it left off'); }
}

async function vaultProtectOn(houseId){
  const h=houseById(houseId); if(!h || h.protected) return;
  let firstEver=false;
  if(!vaultExists()){
    if(!(await vaultRunCeremony())) return;      /* gates 1-3 are the confirmation */
    firstEver=true;
  }else if(!vaultUnlocked()){
    vaultUnlockSheet({ title:'Unlock to protect', body:'Enter your vault passphrase to put another project behind it.',
                       onOpen:()=>vaultProtectOn(houseId) });
    return;
  }else if(!confirm('Protect "'+h.name+'"?\n\nIts notes, to-dos, specs and photos will be encrypted on this device. Without your vault passphrase nobody can read them — including EGS.')){
    return;
  }
  /* Set FIRST, journal BEFORE the first record: from here on, an interruption
     leaves a project that reads as protected and renders locked. */
  h.protected=true; h.updatedAt=now(); persist.houses();
  settings.vault.migration={ houseId, dir:'on', startedAt:now() }; persist.settings();
  if(!(await vaultRunMigration(houseId,'on'))) { render(); return; }
  /* Gate 4 — only the first time, when the passphrase is new and unproven. */
  if(firstEver) await vaultVerificationGate();
  go('house',houseId);
  toast('Protected');
}

async function vaultProtectOff(houseId){
  const h=houseById(houseId); if(!h || !h.protected) return;
  if(!vaultUnlocked()){
    vaultUnlockSheet({ title:'Unlock to remove protection', body:'Enter your vault passphrase.',
                       onOpen:()=>vaultProtectOff(houseId) });
    return;
  }
  if(!confirm('Remove protection from "'+h.name+'"?\n\nIts notes, to-dos, specs and photos go back to being stored unencrypted on this device — readable by anything that can read this app\'s storage.')) return;
  settings.vault.migration={ houseId, dir:'off', startedAt:now() }; persist.settings();
  if(await vaultRunMigration(houseId,'off')){ render(); toast('Protection removed'); }
  else render();
}

/* The forgot-passphrase escape. Deleting is the only thing that can be done to
   a locked project without the passphrase, so it has to be possible — and hard
   to do by accident. Notes and to-dos are deleted rather than unlinked: leaving
   ciphertext nobody can ever read floating around is not a kindness. */
async function vaultDeleteLocked(houseId){
  const h=houseById(houseId); if(!h) return;
  const nSpecs=(h.specs||[]).length, nPhotos=(h.photos||[]).length;
  const nNotes=notes.filter(n=>n.houseId===houseId).length;
  const nTasks=tasks.filter(t=>t.houseId===houseId).length;
  const total=nSpecs+nPhotos+nNotes+nTasks;
  const pl=(n,w)=>n+' '+w+(n===1?'':'s');
  if(!confirm('Delete "'+h.name+'" and everything in it?\n\n'
    +pl(nNotes,'note')+', '+pl(nTasks,'to-do')+', '+pl(nSpecs,'spec')+', '+pl(nPhotos,'photo')+'.\n\n'
    +'This data cannot be recovered. Deleting is the only option without the passphrase.')) return;
  if(!confirm('Last check.\n\nAll '+pl(total,'item')+' in "'+h.name+'" will be gone permanently. There is no undo, and no copy anywhere else.\n\nDelete it?')) return;
  for(const pid of (h.photos||[])){ await photoDel(pid).catch(()=>{}); }
  notes=notes.filter(n=>n.houseId!==houseId);
  tasks=tasks.filter(t=>t.houseId!==houseId);
  houses=houses.filter(x=>x.id!==houseId);
  if(settings.vault && settings.vault.migration && settings.vault.migration.houseId===houseId){
    settings.vault.migration=null; persist.settings();
  }
  persist.houses(); persist.notes(); persist.tasks();
  go('houses'); toast('Project deleted');
}

   ============================================================ */
/* EGS standard PWA registration — update banner + version stamp.
   VAULT_SW_GATE (notebuilt only): a finished update normally activates the
   instant it's installed. Here, if the vault is busy (unlocked, or a photo
   capture is mid-flight — see swUpdateBlocked() above) the waiting worker is
   held instead: the banner still shows, but no SKIP_WAITING message is sent
   until vaultRelock() or captureEnd() confirms it's safe. Locked-and-idle —
   the normal state — is unaffected: it applies the instant it's ready, same
   as every other EGS app. */
(function(){
  window.egsApplyPendingUpdateIfReady=function(){};   /* no-op unless SW support wires the real one in below */
  if(!('serviceWorker' in navigator)) return;
  var reg=null, pendingUpdate=false;
  function applyWaiting(){ if(reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }
  window.egsApplyPendingUpdateIfReady=function(){
    if(!pendingUpdate || swUpdateBlocked()) return;
    pendingUpdate=false;
    applyWaiting();
  };
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').then(function(r){
      reg=r;
      /* A worker can already be sitting in 'waiting' from an earlier session
         (e.g. the tab closed before it ever unlocked or relocked, so nothing
         ever told it to go) — 'updatefound' won't fire again for it, so check
         directly or it would wait forever. */
      if(reg.waiting){ egsUpdateBanner(); if(swUpdateBlocked()) pendingUpdate=true; else applyWaiting(); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            egsUpdateBanner();
            if(swUpdateBlocked()) pendingUpdate=true; else applyWaiting();
          }
        });
      });
    }).catch(function(){});
    var refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshing) return; refreshing=true; location.reload();
    });
  });
  function egsUpdateBanner(){
    if(document.getElementById('egs-update')) return;
    var b=document.createElement('div'); b.id='egs-update';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#C9A227;color:#15181D;font:600 15px -apple-system,Segoe UI,Roboto,sans-serif;padding:13px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px';
    b.innerHTML='<span style="flex:1">A new version is ready.</span><button id="egs-upd-btn" style="background:#15181D;color:#fff;border:0;border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer">Refresh</button>';
    document.body.appendChild(b);
    document.getElementById('egs-upd-btn').onclick=function(){
      this.disabled=true; this.textContent='Updating…';   /* the tap itself had no feedback before */
      location.reload();
    };
  }
})();
/* CHUNK18_INSTALL_PROMPT */
let deferredInstallPrompt=null;
let installPromptShown=false;
function isStandaloneApp(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
function isIOSDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function appUnlocked(){ return $lock.classList.contains('hidden'); }

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  maybeShowInstallPrompt();
});
if(isIOSDevice()) setTimeout(maybeShowInstallPrompt,1200);

function maybeShowInstallPrompt(){
  if(installPromptShown||isStandaloneApp()||localStorage.getItem('notebuilt.installPromptDismissed')||!appUnlocked()) return;
  if(document.getElementById('backup-banner')) return;
  if(deferredInstallPrompt) showInstallBanner('android');
  else if(isIOSDevice()) showInstallBanner('ios');
}

/* CHUNK21_BACKUP_NUDGE — quiet, infrequent, never a modal */
async function maybeShowDataSafetyNudge(){
  if(!appUnlocked()) return;
  if(document.getElementById('install-banner')||document.getElementById('backup-banner')) return;
  if(!houses.length) return;
  const snoozeUntil=parseInt(localStorage.getItem('notebuilt.backupNudgeSnoozeUntil')||'0',10);
  if(Date.now()<snoozeUntil) return;

  const last=settings.lastBackupAt||0;
  const daysSince=last?(Date.now()-last)/86400000:Infinity;
  const backupDue=daysSince>=21;

  let notPersistent=false;
  if(navigator.storage&&navigator.storage.persisted){
    try{ notPersistent=!(await navigator.storage.persisted()); }catch(e){}
  }

  if(!backupDue&&!notPersistent) return;
  showDataSafetyBanner(!last, notPersistent);
}
function showDataSafetyBanner(neverBackedUp, notPersistent){
  if(document.getElementById('backup-banner')||document.getElementById('install-banner')) return;
  let msg;
  if(neverBackedUp&&notPersistent) msg="You haven't backed up yet, and this browser hasn't confirmed your data is protected from being cleared.";
  else if(neverBackedUp) msg="You haven't exported a backup yet. Keep a copy somewhere safe.";
  else if(notPersistent) msg="It's been a while since your last backup, and this browser hasn't confirmed your data is protected from being cleared.";
  else msg="It's been a while since your last backup. Keep a copy somewhere safe.";
  const el=document.createElement('div');
  el.id='backup-banner';
  el.innerHTML=`<div class="txt"><b>Back up your projects</b>${msg}</div>
    <button class="btn primary sm" id="backup-go">Back up now</button>
    <button class="icon-btn" id="backup-x" aria-label="Not now" style="width:36px;height:36px;flex:none">${I.x}</button>`;
  document.body.appendChild(el);
  document.getElementById('backup-go').onclick=async()=>{
    await exportData();
    dismissBackupBanner();
  };
  document.getElementById('backup-x').onclick=()=>{
    localStorage.setItem('notebuilt.backupNudgeSnoozeUntil', String(Date.now()+7*86400000));
    dismissBackupBanner();
  };
}
function dismissBackupBanner(){
  const el=document.getElementById('backup-banner'); if(el) el.remove();
}
function showInstallBanner(mode){
  if(installPromptShown) return;
  installPromptShown=true;
  const el=document.createElement('div');
  el.id='install-banner';
  el.innerHTML = mode==='android'
    ? `<div class="txt"><b>Add ${esc(APP_NAME)} to your home screen</b>Quick, quiet access \u2014 no app store needed.</div>
       <button class="btn primary sm" id="install-go">Add</button>
       <button class="icon-btn" id="install-x" aria-label="Dismiss" style="width:36px;height:36px;flex:none">${I.x}</button>`
    : `<div class="txt"><b>Add ${esc(APP_NAME)} to your home screen</b>Tap Share, then "Add to Home Screen."</div>
       <button class="icon-btn" id="install-x" aria-label="Dismiss" style="width:36px;height:36px;flex:none">${I.x}</button>`;
  document.body.appendChild(el);
  if(mode==='android'){
    document.getElementById('install-go').onclick=async()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt=null;
      dismissInstallBanner();
    };
  }
  document.getElementById('install-x').onclick=dismissInstallBanner;
}
function dismissInstallBanner(){
  const el=document.getElementById('install-banner'); if(el) el.remove();
  localStorage.setItem('notebuilt.installPromptDismissed','1');
}
