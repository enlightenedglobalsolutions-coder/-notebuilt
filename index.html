/* Say what went wrong and offer the native path as an explicit choice, with the
   risk stated. Never a silent fallback. */
function camDrawError(err){
  const name=(err&&err.name)||'';
  let why;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    why='This browser does not offer in-app camera access.';
  else if(name==='NotAllowedError'||name==='SecurityError')
    why='Camera permission was refused, so the viewfinder cannot open. You can change that in your browser\'s site settings for this app.';
  else if(name==='NotFoundError'||name==='OverconstrainedError')
    why='No camera was found on this device.';
  else if(name==='NotReadableError')
    why='The camera is in use by another app, or the system would not release it.';
  else
    why='The camera could not be started'+(name?' ('+name+')':'')+'.';
  $camera.innerHTML='<div class="cam-top">'
    +'<button class="icon-btn" data-cam-close aria-label="Close">'+I.x+'</button>'
    +'<span class="cam-title">Camera unavailable</span><span style="width:46px"></span></div>'
    +'<div class="cam-stage" style="align-items:flex-start"><div class="cam-msg">'
    +'<b>The in-app camera did not open</b>'+esc(why)
    +'<div class="cam-warn">You can still use the phone\'s own camera app, but be aware of '
    +'what that risks: Android can reclaim Notebuilt while the camera app is in front, and '
    +'when that happens the photo is lost before it ever reaches this app. That is the exact '
    +'failure the in-app camera exists to avoid.</div>'
    +'</div></div>'
    +'<div class="cam-controls">'
    +'<label class="btn block" style="display:flex;align-items:center;justify-content:center;gap:8px">'
    +I.camera+' Use the phone camera anyway'
    +'<input type="file" accept="image/*" capture="environment" hidden data-cam-native></label>'
    +'<button class="btn block" data-cam-close style="margin-top:8px">Cancel</button></div>';
  camBind();
}

async function camStart(deviceId){
  /* CAM_TORCH — read the wish before camStop() clears it, so switching lens
     can carry the lamp over. Backgrounding deliberately does not: camStop
     runs on its own there, the flag is already false by the time we return,
     and the torch comes back off. */
  const wantMode=camFlashMode();
  camStop();
  const base={ width:{ideal:4096}, height:{ideal:4096} };
  const video = deviceId ? Object.assign({deviceId:{exact:deviceId}}, base)
                         : Object.assign({facingMode:{ideal:'environment'}}, base);
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
    cam.stream=await navigator.mediaDevices.getUserMedia({video, audio:false});
  }catch(err){
    /* an exact deviceId that the phone will not honour: fall back to any camera
       rather than dead-ending on a lens choice */
    if(deviceId){ return camStart(null); }
    cam.error=err; camDrawError(err); return;
  }
  settings.camIntroSeen=true; persist.settings();
  const track=cam.stream.getVideoTracks()[0];
  cam.deviceId = track && track.getSettings ? (track.getSettings().deviceId||null) : null;
  /* ImageCapture can pull full sensor resolution, past whatever the preview
     stream carries. Only worth it at Max. */
  cam.imageCapture=null;
  try{ if(window.ImageCapture && track) cam.imageCapture=new ImageCapture(track); }catch(e){}
  /* CAM_TORCH — capability belongs to THIS track. Front cameras and several
     rear lenses have no lamp; the button is absent for those rather than
     greyed, because a disabled flash button invites a tap that cannot work. */
  cam.torchCap=false; cam.fillFlash=false;
  try{ const caps=(track && track.getCapabilities) ? track.getCapabilities() : null;
       cam.torchCap=!!(caps && caps.torch); }catch(e){}
  /* A capability probe is not worth a viewfinder that never opens: raced,
     because a promise that neither resolves nor rejects is exactly how
     2026.08.12-1407 hung this app on launch. */
  try{
    if(cam.imageCapture && cam.imageCapture.getPhotoCapabilities){
      const pc=await Promise.race([
        cam.imageCapture.getPhotoCapabilities().catch(()=>null),
        new Promise(r=>setTimeout(()=>r(null),800))
      ]);
      const modes=pc && pc.fillLightMode;
      cam.fillFlash=!!(modes && modes.indexOf && modes.indexOf('flash')>=0);
    }
  }catch(e){ cam.fillFlash=false; }
  /* CAM_FLASH — a new track carries none of the old constraints. Put the mode
     back on it, or drop to OFF where this lens has no lamp to put it on. */
  if(!cam.torchCap) cam.flashMode='off';
  else if(wantMode!=='off') await camSetFlashMode(wantMode);
  await camListDevices();
  camDrawLive();
}

/* CAM_TORCH — the only writer of cam.torchOn while a track is live. A refusal
   leaves the flag false, so the button always describes the lamp rather than
   the request. */
/* CAM_FLASH — the gap between striking the lamp and reading the sensor.
   Too short and the frame is dark, or blown as auto-exposure over-corrects
   after the fact. The brief's band is 250-400ms; this is the middle of it and
   is expected to be tuned on a real device. */
const FLASH_SETTLE_MS=300;

/* off -> flash -> torch -> off */
const FLASH_MODES=['off','flash','torch'];
function camFlashMode(){ return cam.flashMode||'off'; }

async function camSetTorch(on){
  const track=cam.stream && cam.stream.getVideoTracks ? cam.stream.getVideoTracks()[0] : null;
  if(!track || !cam.torchCap) return false;
  try{
    await track.applyConstraints({advanced:[{torch:!!on}]});
    cam.torchOn=!!on;
    return true;
  }catch(e){
    cam.torchOn=false;
    return false;
  }
}

/* CAM_FLASH — the mode, and the framing light that follows from it. Only
   TORCH lights the viewfinder; FLASH stays dark until the shutter, which is
   the whole difference between the two. A lens with no lamp cannot hold a
   mode at all. */
async function camSetFlashMode(mode){
  if(!cam.torchCap){ cam.flashMode='off'; return false; }
  cam.flashMode=mode;
  const wantLit=(mode==='torch');
  if(wantLit!==!!cam.torchOn){
    const ok=await camSetTorch(wantLit);
    /* Asked for light and refused: say off, because that is what is true. */
    if(!ok && wantLit){ cam.flashMode='off'; return false; }
  }
  return true;
}

/* Only what the device genuinely exposes. Labels are blank until permission has
   been granted, which is why this runs after getUserMedia. */
async function camListDevices(){
  cam.devices=[];
  try{
    const all=await navigator.mediaDevices.enumerateDevices();
    cam.devices=all.filter(d=>d.kind==='videoinput');
  }catch(e){}
}

function camDrawLive(){
  const multi=cam.devices.length>1;
  const lensRow = multi
    ? '<div class="cam-row">'+cam.devices.map((d,i)=>
        '<button class="cam-chip'+(d.deviceId===cam.deviceId?' on':'')+'" data-cam-lens="'+esc(d.deviceId)+'">'
        +esc(d.label||('Camera '+(i+1)))+'</button>').join('')+'</div>'
    : '';
  const presetRow='<div class="cam-row">'
    +Object.keys(PHOTO_PRESETS).map(k=>
      '<button class="cam-chip'+(k===cam.presetKey?' on':'')+'" data-cam-preset="'+k+'">'
      +esc(PHOTO_PRESETS[k].label)+'</button>').join('')
    +'<span class="cam-chip" style="border:none;background:none;color:var(--paper-faint)">'
    +esc(PHOTO_PRESETS[cam.presetKey].hint)+'</span></div>';
  $camera.innerHTML='<div class="cam-top">'
    +'<button class="icon-btn" data-cam-close aria-label="Close">'+I.x+'</button>'
    +'<span class="cam-title">'+esc((houseById(cam.houseId)||{}).name||'Camera')+'</span>'
    +'<span style="width:46px"></span></div>'
    +'<div class="cam-stage"><video id="cam-video" playsinline autoplay muted></video></div>'
    +'<div class="cam-controls">'+lensRow+presetRow
    +'<div class="cam-shutter-row">'
    +(cam.torchCap
        ? (function(){
            const m=camFlashMode();
            const cls = m==='torch' ? ' on torch' : (m==='flash' ? ' on' : '');
            const gly = m==='torch' ? I.torchOn : (m==='flash' ? I.bolt : I.boltOff);
            const lab = m==='off'   ? 'Flash off \u2014 tap for flash'
                      : m==='flash' ? 'Flash on \u2014 tap for torch'
                      :               'Torch on \u2014 tap to turn off';
            return '<button class="cam-flash'+cls+'" data-cam-torch aria-label="'+lab+'" title="'+lab+'">'+gly+'</button>';
          })()
        : '')
    +'<button class="cam-shutter" data-cam-shoot aria-label="Take photo"></button>'
    +(cam.torchCap?'<span style="width:46px;flex:none"></span>':'')
    +'</div>'
    +'<div class="cam-hint">'+(cam.kept?cam.kept+(cam.kept===1?' photo':' photos')+' saved · ':'')
    +(multi?'Pick a lens · ':'')+'Tap Max for full resolution</div>'
    +'</div>';
  const v=document.getElementById('cam-video');
  if(v && cam.stream){ v.srcObject=cam.stream; v.play().catch(()=>{}); }
  camBind();
}

function camDrawReview(){
  $camera.innerHTML='<div class="cam-top">'
    +'<button class="icon-btn" data-cam-close aria-label="Close">'+I.x+'</button>'
    +'<span class="cam-title">Keep this one?</span><span style="width:46px"></span></div>'
    +'<div class="cam-stage"><img class="cam-still" src="'+cam.shot.url+'" alt="Captured photo"></div>'
    +'<div class="cam-controls">'
    +'<div class="cam-hint" style="padding-bottom:10px">'
    +esc(cam.shot.w+' × '+cam.shot.h+' · '+PHOTO_PRESETS[cam.presetKey].label)
    +(cam.kept?' · '+cam.kept+' saved so far':'')+'</div>'
    /* Said, not swallowed: Max asked the sensor and the sensor declined, so
       this frame is the preview's size. The chip stays on Max for the next
       one, which may well succeed. */
    +(cam.shot.maxMissed
        ? '<div class="cam-warn" style="margin-bottom:10px">Max was not available for this shot, so it was taken at viewfinder resolution. Max is still selected for the next one.</div>'
        : '')
    +'<button class="btn primary block" data-cam-keep-more>Keep &amp; take another</button>'
    +'<div class="row" style="gap:10px;margin-top:10px">'
    +'<button class="btn" style="flex:1" data-cam-retake>Retake</button>'
    +'<button class="btn" style="flex:1" data-cam-keep-done>Keep &amp; done</button></div></div>';
  camBind();
}

async function camGrabFrame(){
  const v=document.getElementById('cam-video'); if(!v) return null;
  const w=v.videoWidth, h=v.videoHeight; if(!w||!h) return null;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',PHOTO_PRESETS[cam.presetKey].quality));
}

async function camShoot(){
  /* CAM_MULTISHOT — one shot in flight at a time. Without this a second tap
     while the still is being prepared produces a second record for a frame
     the person only took once. */
  if(cam.saving || cam.shot) return;
  const btn=$camera.querySelector('[data-cam-shoot]'); if(btn) btn.setAttribute('disabled','');
  let blob=null;
  const wantedMax=(cam.presetKey==='max');
  let gotMax=false;
  /* CAM_FLASH — a real burst is better than anything done by hand: no settle
     delay, no lamp to remember to extinguish. Only worth it at Max, through a
     genuine ImageCapture, on a device that advertises it. */
  const useBurst=(wantedMax && cam.imageCapture && camFlashMode()==='flash' && cam.fillFlash);
  /* Did THIS shot strike the lamp? Only then may it put it out — a capture
     taken under TORCH must never darken the light it was taken under. */
  let litForShot=false;
  try{
    if(camFlashMode()==='flash' && !useBurst){
      litForShot=await camSetTorch(true);
      /* Read the sensor before the lamp arrives and the frame is dark, or
         blown once auto-exposure catches up. */
      if(litForShot) await new Promise(r=>setTimeout(r,FLASH_SETTLE_MS));
    }
    if(wantedMax && cam.imageCapture){
      /* full sensor resolution where the browser offers it. */
      const opts=useBurst ? {fillLightMode:'flash'} : null;
      try{ blob=await (opts ? cam.imageCapture.takePhoto(opts) : cam.imageCapture.takePhoto());
           gotMax=!!blob; }catch(e){ blob=null; }
    }
    /* The fallback is a canvas grab of the PREVIEW — viewfinder resolution,
       not sensor resolution. It used to happen silently, so Max could quietly
       deliver a Standard-sized frame. The review screen now says so. */
    if(!blob) blob=await camGrabFrame();
  } catch(err){
    /* A capture that throws used to leave the function with the shutter still
       disabled, so the camera looked frozen until it was closed and reopened.
       Say what happened and let the person try again. */
    blob=null;
    toast('Could not capture that frame');
  } finally {
    /* The point of the wrapper: a capture that throws still puts the light
       out. A phone left burning is worse than a photo not taken. The shutter
       belongs here for the same reason — it is state that must be released
       whether or not the capture worked. */
    if(litForShot) await camSetTorch(false);
    if(btn) btn.removeAttribute('disabled');
  }
  if(!blob){ if(btn) btn.removeAttribute('disabled'); toast('Could not capture that frame'); return; }
  const url=URL.createObjectURL(blob);
  const dims=await new Promise(res=>{ const im=new Image();
    im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight}); im.onerror=()=>res({w:0,h:0}); im.src=url; });
  cam.shot={ blob, url, w:dims.w, h:dims.h, maxMissed:(wantedMax && !gotMax) };
  camDrawReview();
}

function camRetake(){
  if(cam.shot && cam.shot.url){ try{ URL.revokeObjectURL(cam.shot.url); }catch(e){} }
  cam.shot=null;
  camDrawLive();
}

/* The captured frame goes down the SAME write path as everything else:
   photoPutFor() seals it symmetrically when unlocked and envelopes it when
   not, and the list is persisted immediately after. */
async function camKeep(andAnother){
  /* CAM_MULTISHOT — the latch, not the button state, is what guarantees one
     record per shot. Disabling the buttons is cosmetic; a second call that
     arrives anyway finds cam.saving already true and does nothing. */
  if(!cam.shot || cam.saving) return;
  const houseId=cam.houseId, h=houseById(houseId);
  if(!h){ camClose(); return; }
  cam.saving=true;
  $camera.querySelectorAll('[data-cam-keep-more],[data-cam-keep-done],[data-cam-retake]')
         .forEach(b=>b.setAttribute('disabled',''));
  const pressed=$camera.querySelector(andAnother?'[data-cam-keep-more]':'[data-cam-keep-done]');
  if(pressed) pressed.textContent='Saving\u2026';
  try{
    /* Unchanged from single-shot: sealed symmetrically when unlocked,
       enveloped when not, and the list persisted before anything else
       happens. On disk before the viewfinder returns — nothing is carried. */
    const blob=await preparePhotoBlob(cam.shot.blob, cam.presetKey, true);
    const id=uid();
    await photoPutFor(houseId,{id,blob,houseId,createdAt:now()});
    h.photos=h.photos||[]; h.photos.push(id);
    if(!h.cover) h.cover=id;
    h.updatedAt=now(); persist.houses();
    if(cam.shot.url){ try{ URL.revokeObjectURL(cam.shot.url); }catch(e){} }
    cam.shot=null; cam.saving=false;
    cam.kept=(cam.kept||0)+1;            /* a count, never the photos */
    if(andAnother){
      toast(cam.kept===1?'Photo saved':cam.kept+' photos saved');
      camDrawLive();                     /* same stream, no re-acquire */
    } else {
      camClose();                        /* teardown on exit, as before */
    }
  }catch(err){
    /* Redraw rather than hand-restore labels: the shot is still here, and
       the review screen is the one true description of that state. */
    cam.saving=false;
    camDrawReview();
    toast(String(err&&err.message)==='no capture key'
      ? 'Unlock the vault once to turn on locked capture'
      : 'Could not save that photo');
  }
}

function camBind(){
  $camera.querySelectorAll('[data-cam-close]').forEach(b=>b.onclick=camClose);
  const allow=$camera.querySelector('[data-cam-allow]');
  if(allow) allow.onclick=async()=>{ camDrawLoading(); await camStart(); };
  const shoot=$camera.querySelector('[data-cam-shoot]'); if(shoot) shoot.onclick=camShoot;
  const torch=$camera.querySelector('[data-cam-torch]');
  if(torch) torch.onclick=async()=>{
    const next=FLASH_MODES[(FLASH_MODES.indexOf(camFlashMode())+1)%FLASH_MODES.length];
    const ok=await camSetFlashMode(next);
    if(!ok) toast('This lens would not turn its flash on');
    camDrawLive();                        /* redraw from the lamp, not the wish */
  };
  const retake=$camera.querySelector('[data-cam-retake]'); if(retake) retake.onclick=camRetake;
  /* Arrows, not bare references: `onclick=camKeep` would pass the click
     event as andAnother, and an event object is truthy. */
  const keepMore=$camera.querySelector('[data-cam-keep-more]'); if(keepMore) keepMore.onclick=()=>camKeep(true);
  const keepDone=$camera.querySelector('[data-cam-keep-done]'); if(keepDone) keepDone.onclick=()=>camKeep(false);
  $camera.querySelectorAll('[data-cam-lens]').forEach(b=>b.onclick=async()=>{
    camDrawLoading(); await camStart(b.getAttribute('data-cam-lens'));
  });
  $camera.querySelectorAll('[data-cam-preset]').forEach(b=>b.onclick=()=>{
    cam.presetKey=b.getAttribute('data-cam-preset'); camDrawLive();
  });
  const native=$camera.querySelector('[data-cam-native]');
  if(native) native.onchange=async e=>{
    const hid=cam.houseId;
    camClose();
    captureBegin();                      /* the hand-off risk, now chosen knowingly */
    await handlePhoto(e,hid);
  };
}

/* Release the camera if the app goes out of sight, and pick it back up on
   return. Leaving a live stream running behind a hidden page is not on. */
document.addEventListener('visibilitychange',()=>{
  if(!cam.open) return;
  if(document.visibilityState==='hidden') camStop();
  else if(!cam.stream && !cam.shot && !cam.error) camStart(cam.deviceId);
});
window.addEventListener('pagehide',()=>{ if(cam.open) camStop(); });

/* ===== SORTED ENGINE START =====
   Sorted - reusable media-sorting engine, shared across EGS apps (Notebuilt, Kept, standalone Sorted).
   The engine never touches storage: the host passes media-item refs plus a resolve() that turns a
   ref into a displayable URL, and receives the user's choice via callback. The host owns persistence.
   First feature built on it: the cover-photo picker below. Later features (dedupe, corruption
   detection, integrity manifest) reuse this same list + resolve + grid spine. */
const Sorted=(function(){
  /* Open a picker sheet: a grid of media thumbnails, the current pick starred, tap to choose.
     opts = { items:[ref,...], resolve:ref=>Promise<url|null>, current:ref|null, title, onPick:ref=>void } */
  function pickGrid(opts){
    const items=(opts.items||[]);
    if(!items.length){ toast('No photos to choose from yet'); return; }
    const cur=opts.current;
    const cells=items.map(ref=>`<button class="sorted-cell${ref===cur?' is-current':''}" data-sorted-pick="${esc(ref)}" data-sorted-thumb="${esc(ref)}" aria-label="Choose photo">${ref===cur?`<span class="sorted-star">${I.star}</span>`:''}</button>`).join('');
    sheet(`<h2>${esc(opts.title||'Choose photo')}</h2><div class="sorted-grid">${cells}</div>`);
    $mr.querySelectorAll('[data-sorted-thumb]').forEach(async el=>{
      const u=await opts.resolve(el.getAttribute('data-sorted-thumb'));
      if(u) el.style.backgroundImage=`url(${u})`;
    });
    $mr.querySelectorAll('[data-sorted-pick]').forEach(el=>el.onclick=()=>{
      const ref=el.getAttribute('data-sorted-pick');
      closeSheet();
      if(opts.onPick) opts.onPick(ref);
    });
  }
  return { pickGrid };
})();

/* Cover-photo picker (first feature on the Sorted engine) */
function openCoverPicker(houseId){
  const h=houseById(houseId); if(!h) return;
  const pickable=photosFor(houseId,houseId);
  if(!pickable.length){ toast('Add photos to this project first'); return; }
  Sorted.pickGrid({
    items:pickable,
    resolve:photoURL,
    current:h.cover,
    title:'Choose a photo to crop',
    onPick:(pid)=>{ openCropEditor(houseId, pid); }
  });
}

/* ---------- CROP EDITOR: frame a square region, save it as the cover ---------- */
async function openCropEditor(houseId, photoId){
  const url=await photoURL(photoId); if(!url){ toast('Could not open that photo'); return; }
  const $mr=document.getElementById('modal-root');
  $mr.innerHTML=`<div class="scrim" data-crop-scrim>
    <div class="sheet" role="dialog" aria-modal="true" style="max-width:520px">
      <div class="grab"></div>
      <h2>Crop cover</h2>
      <p class="muted" style="font-size:13px;margin:0 0 12px">Drag to move, pinch or use the slider to zoom. The square is what shows as the cover.</p>
      <div id="crop-stage" style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:var(--radius);background:#000;touch-action:none">
        <img id="crop-img" src="${url}" style="position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none" draggable="false">
        <div style="position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);pointer-events:none"></div>
      </div>
      <div class="field" style="margin-top:12px"><label>Zoom</label>
        <input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1" style="width:100%;accent-color:var(--brass)"></div>
      <div class="crow" style="margin-top:4px">
        <button class="btn" data-crop-cancel>Cancel</button>
        <button class="btn primary" data-crop-save>Use as cover</button>
      </div>
    </div></div>`;

  const stage=document.getElementById('crop-stage');
  const img=document.getElementById('crop-img');
  const zoom=document.getElementById('crop-zoom');
  const st={scale:1,minScale:1,x:0,y:0,natW:0,natH:0,box:0};

  function layout(){
    st.box=stage.clientWidth;
    // cover-fit: min scale fills the square
    const cover=st.box/Math.min(st.natW,st.natH);
    st.minScale=cover; zoom.min=cover.toFixed(3); zoom.max=(cover*4).toFixed(3);
    if(st.scale<cover) st.scale=cover;
    img.style.width=st.natW+'px'; img.style.height=st.natH+'px';
    center(); apply();
  }
  function center(){ st.x=(st.box-st.natW*st.scale)/2; st.y=(st.box-st.natH*st.scale)/2; }
  function clamp(){
    const w=st.natW*st.scale, h=st.natH*st.scale;
    st.x=Math.min(0,Math.max(st.box-w,st.x));
    st.y=Math.min(0,Math.max(st.box-h,st.y));
  }
  function apply(){ clamp(); img.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.scale})`; zoom.value=st.scale; }

  const im=new Image();
  im.onload=()=>{ st.natW=im.naturalWidth; st.natH=im.naturalHeight; layout(); };
  im.src=url;

  // drag
  let drag=null;
  stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y}; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove',e=>{ if(!drag)return; st.x=drag.ox+(e.clientX-drag.x); st.y=drag.oy+(e.clientY-drag.y); apply(); });
  stage.addEventListener('pointerup',()=>{ drag=null; });
  stage.addEventListener('pointercancel',()=>{ drag=null; });
  // pinch
  let pts=new Map(), pinch=null;
  stage.addEventListener('pointerdown',e=>pts.set(e.pointerId,e));
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
    if(pts.size===2){
      const [a,b]=[...pts.values()]; const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      const cx=(a.clientX+b.clientX)/2-stage.getBoundingClientRect().left, cy=(a.clientY+b.clientY)/2-stage.getBoundingClientRect().top;
      if(pinch){ const ns=Math.max(st.minScale,Math.min(st.minScale*4, st.scale*dist/pinch.dist));
        // zoom around pinch center
        const k=ns/st.scale; st.x=cx-(cx-st.x)*k; st.y=cy-(cy-st.y)*k; st.scale=ns; apply(); }
      pinch={dist};
    }
  });
  stage.addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(pts.size<2)pinch=null; });
  stage.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); if(pts.size<2)pinch=null; });
  // slider zoom (around center)
  zoom.oninput=()=>{ const ns=parseFloat(zoom.value); const c=st.box/2; const k=ns/st.scale; st.x=c-(c-st.x)*k; st.y=c-(c-st.y)*k; st.scale=ns; apply(); };

  $mr.querySelector('[data-crop-cancel]').onclick=()=>{ $mr.innerHTML=''; };
  $mr.querySelector('[data-crop-scrim]').addEventListener('click',e=>{ if(e.target.hasAttribute('data-crop-scrim')) $mr.innerHTML=''; });
  $mr.querySelector('[data-crop-save]').onclick=async ()=>{
    try{
      const out=800; const canvas=document.createElement('canvas'); canvas.width=out; canvas.height=out;
      const ctx=canvas.getContext('2d');
      // map the visible square back into source pixels
      const scaleFactor=out/st.box;
      const srcX=-st.x/st.scale, srcY=-st.y/st.scale, srcSize=st.box/st.scale;
      ctx.drawImage(im, srcX, srcY, srcSize, srcSize, 0, 0, out, out);
      const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.85));
      const h=houseById(houseId); const id=uid();
      await photoPutFor(houseId,{id,blob,houseId,createdAt:now(),cropped:true});
      h.photos=h.photos||[]; h.photos.push(id); h.cover=id; h.updatedAt=now(); persist.houses();
      $mr.innerHTML=''; render(); toast('Cover cropped & set');
    }catch(err){ toast('Could not save crop'); }
  };
}

}

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ _leavingView={name:view.name,param:view.param}; autosaveOpenNote(); } });

/* ============================================================
   VAULT_CAPTURE — the app sending you to the camera is not the app being left
   ------------------------------------------------------------
   Tapping Camera backgrounds the PWA. Without this, the background relock
   wipes the key and the returning photo has nothing to seal it — the photo is
   lost. So a capture WE started defers the background trigger, and only that
   trigger: the idle timer keeps running, and a hard ceiling relocks anyway if
   nobody comes back.
   ============================================================ */
/* VAULT_ENVELOPE — demoted to convenience. It saves you retyping a passphrase
   after taking a photo, and nothing more: no photo's survival depends on this
   window, on this timer, or on the page still being alive when you get back. */
const VAULT_CAPTURE_GRACE_MS = 120000;   /* 2 min ceiling — drop to ~5000 to test */
let _captureAt = 0;        /* 0 = no capture in flight */
let _captureTimer = null;
let _captureSettle = null;

function captureActive(){ return _captureAt !== 0; }
/* VAULT_SW_GATE — a live derived key or an in-flight envelope capture write
   both count as "busy": neither may be interrupted by a service-worker
   activation, which reloads the page and drops whatever's in memory. Read by
   the BOOT registration below, and re-checked at the two places that can end
   a busy spell: vaultRelock() and captureEnd().
   Named swUpdateBlocked(), NOT vaultBusy() — vaultBusy(title,sub,pct) already
   exists below as the encrypt/decrypt progress overlay. Two same-named
   top-level function declarations don't error or warn; the later one silently
   wins for every caller via hoisting. That collision was shipped 2026-08-22:
   every gate check below was actually invoking the overlay with no args —
   painting a full-screen #vault-busy shade on every update check, and always
   evaluating truthy (a Promise), so the update never applied even when
   locked. Keep this name distinct. */
function swUpdateBlocked(){ return vaultUnlocked() || captureActive(); }
function captureBegin(){
  _captureAt = now();
  clearTimeout(_captureTimer);
  /* Wandered off mid-capture: lock exactly as if the grace had never applied. */
  _captureTimer = setTimeout(()=>{ _captureAt=0; _captureTimer=null; vaultRelock(true); },
                             VAULT_CAPTURE_GRACE_MS);
}
function captureEnd(){
  _captureAt = 0;
  clearTimeout(_captureTimer); _captureTimer = null;
  clearTimeout(_captureSettle); _captureSettle = null;
  window.egsApplyPendingUpdateIfReady();   /* VAULT_SW_GATE — capture finishing may be the last thing blocking a deferred update */
}

/* VAULT_ENVELOPE — the memory-hold that used to live here is gone. Nothing is
   ever kept in memory awaiting a key: photoPutFor() writes every capture the
   moment it exists, envelope-sealed when the vault is shut. */

/* VAULT_CORE — the key never survives the app going out of sight. Autosave
   above runs first, so an open protected note is sealed before we drop the key. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    /* VAULT_CAPTURE — deferred only while a capture we started is in flight. */
    if(!captureActive()) vaultRelock(true);
    return;
  }
  /* Back in the foreground. If a capture was in flight, give the change event a
     moment to land; if nothing arrives it was cancelled, so just clear the flag
     and leave everything else exactly as it was. */
  if(captureActive()){
    clearTimeout(_captureSettle);
    _captureSettle=setTimeout(()=>{ if(captureActive()) captureEnd(); }, 2500);
  }
  if(view.name==='house' && isProtected(view.param)) render();
});
window.addEventListener('pagehide',()=>{ if(!captureActive()) vaultRelock(true); });
['pointerdown','keydown','touchstart'].forEach(ev=>
  document.addEventListener(ev,()=>{ if(_vaultKey) vaultTouch(); },{passive:true}));

/* VAULT_RENDER — which project owns this photo? Answered from the plaintext
   photos[] arrays, so it still works with the vault locked. */
function vaultPhotoPaintable(pid, scopeHouseId){
  const owner=houses.find(h=>(h.photos||[]).indexOf(pid)>=0);
  if(!owner) return true;                       /* orphan: nothing protects it */
  return photoAllowedFor(owner.id, scopeHouseId);
}

/* fill in any cover/photo backgrounds from IndexedDB after render.
   The renderers already gate on photoAllowedFor(); this re-derives the answer
   from the screen we are actually on, so a stray data-cover or data-photo can
   never paint a protected photo even if a renderer is changed carelessly. */
async function hydratePhotos(){
  const scope = view.name==='house' ? view.param : null;
  for(const el of $app.querySelectorAll('[data-cover]')){
    const pid=el.getAttribute('data-cover');
    if(!vaultPhotoPaintable(pid,scope)) continue;
    const u=await photoURL(pid); if(u){ el.style.backgroundImage=`url(${u})`; el.innerHTML=''; }
  }
  for(const el of $app.querySelectorAll('[data-photo]')){
    const pid=el.getAttribute('data-photo');
    if(!vaultPhotoPaintable(pid,scope)) continue;
    const u=await photoURL(pid); if(u) el.style.backgroundImage=`url(${u})`;
  }
}

/* ============================================================
   PHOTO VIEWER — full-screen, pinch-zoom, swipe, delete
   CHUNK3_PHOTO_VIEWER
   ============================================================ */
const $viewer=document.getElementById('viewer');
let vw={houseId:null,photos:[],index:0,scale:1,tx:0,ty:0};

function openViewer(houseId,photoId){

function closeViewer(){

}
async function renderViewerFrame(){

  vw.scale=1; vw.tx=0; vw.ty=0;
  $viewer.innerHTML=`
    <div class="v-top">
      <button class="icon-btn" data-v-close aria-label="Close">${I.x}</button>
      <span class="v-count">${vw.index+1} of ${vw.photos.length}</span>
      <div class="v-actions">
        <button class="icon-btn" data-v-cover aria-label="Set as project cover">${I.star}</button>
        <button class="icon-btn" data-v-rotate aria-label="Rotate photo">${I.rotate}</button>
        <button class="icon-btn" data-v-markup aria-label="Add markup">${I.edit}</button>
        <button class="icon-btn" data-v-send aria-label="Share or save photo">${I.share}</button>
        <button class="icon-btn danger" data-v-del aria-label="Delete photo">${I.trash}</button>
      </div>
    </div>
    <div class="v-stage" id="v-stage"><img id="v-img" alt="Photo"></div>
    <div class="v-hint">${vw.photos.length>1?'Swipe to browse \u00b7 pinch or double-tap to zoom':'Pinch or double-tap to zoom'}</div>`;
  $viewer.querySelector('[data-v-close]').onclick=closeViewer;
  $viewer.querySelector('[data-v-del]').onclick=deleteViewerPhoto;
  $viewer.querySelector('[data-v-rotate]').onclick=rotatePhoto;
  $viewer.querySelector('[data-v-markup]').onclick=openAnnotate;
  $viewer.querySelector('[data-v-cover]').onclick=setViewerCover;
  $viewer.querySelector('[data-v-send]').onclick=openPhotoSendSheet;
  const img=$viewer.querySelector('#v-img');
  const url=await photoURL(pid); if(url) img.src=url;
  bindViewerGestures();
}

/* PHOTO_SHARE — one sheet, because the two sentences that have to be read
   before a photo leaves the app need somewhere to live, and because six
   icon buttons do not fit the viewer's top row on a phone. */
function openPhotoSendSheet(){
  const pid=vw.photos[vw.index]; if(!pid) return;
  const h=houseById(vw.houseId);
  const prot=!!(h && h.protected);
  sheet('<h2>Send this photo</h2>'
    +(prot?'<div class="card" style="background:var(--ink-2);margin-bottom:12px"><div class="muted" style="font-size:13px;line-height:1.6">'
        +'This project is protected. Sharing or saving sends an <b style="color:var(--paper)">unprotected copy out of the vault</b> \u2014 whatever receives it holds a plain photo that Notebuilt no longer controls.'
        +'</div></div>':'')
    +'<div class="muted" data-help="photo-send" style="font-size:13px;line-height:1.6;margin-bottom:12px">'
    +'Share, hands the image to another app on this phone. Save, puts it in your <b style="color:var(--paper)">Downloads</b> folder \u2014 not the camera roll.'
    +'</div>'
    +'<button class="btn primary block" data-ph-share>'+I.share+' Share\u2026</button>'
    +'<button class="btn block" style="margin-top:10px" data-ph-save>'+I.download+' Save to device</button>'
    +'<button class="btn block" style="margin-top:10px" data-ph-cancel>Cancel</button>','photo-send');
  $mr.querySelector('[data-ph-cancel]').onclick=closeSheet;
  $mr.querySelector('[data-ph-share]').onclick=()=>sendViewerPhoto(true);
  $mr.querySelector('[data-ph-save]').onclick=()=>sendViewerPhoto(false);
}

async function sendViewerPhoto(wantShare){
  const pid=vw.photos[vw.index]; if(!pid) return;
  const h=houseById(vw.houseId);
  const prot=!!(h && h.protected);
  /* Said once, plainly, and confirmed — an unprotected copy in another app
     cannot be called back. */
  if(prot && !confirm('Send an unprotected copy out of the vault?\n\n'
      +'The photo leaves encrypted storage as an ordinary image. Whatever receives it keeps it.')) return;
  const blob=await photoBlobFor(pid);
  if(!blob){
    closeSheet();
    toast(prot?'Unlock the vault to send this photo':'Could not read that photo');
    return;
  }
  const file=new File([blob], photoOutName(), {type:blob.type||'image/jpeg'});
  if(wantShare && navigator.canShare && navigator.share){
    let ok=false;
    try{ ok=navigator.canShare({files:[file]}); }catch(e){ ok=false; }
    if(ok){
      closeSheet();
      /* SHARE_PAYLOAD — the image and nothing else. No title, no text, no
         url: none of them are the photo, and all of them would carry
         something about where it came from. */
      try{ await navigator.share({files:[file]}); }
      catch(err){ if(!(err && err.name==='AbortError')) toast('Could not share that photo'); }
      return;
    }
    toast('Sharing files is not available here \u2014 saving instead');
  }
  closeSheet();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} },1000);
  toast('Saved to your Downloads folder');
}

async function deleteViewerPhoto(){
  if(!confirm('Delete this photo?'))return;
  const pid=vw.photos[vw.index], h=houseById(vw.houseId);
  await photoDel(pid).catch(()=>{});
  if(h){ h.photos=(h.photos||[]).filter(x=>x!==pid); if(h.cover===pid) h.cover=h.photos[0]||null; h.updatedAt=now(); persist.houses(); }
  vw.photos=vw.photos.filter(x=>x!==pid);
  if(view.name==='house') render();
  if(!vw.photos.length){ closeViewer(); toast('Photo deleted'); return; }
  if(vw.index>=vw.photos.length) vw.index=vw.photos.length-1;
  renderViewerFrame(); toast('Photo deleted');
}

/* CHUNK4_ROTATE_PHOTO — rotate the stored image 90deg clockwise and re-save it */
async function rotatePhoto(){
  const pid=vw.photos[vw.index]; if(!pid)return;
  toast('Rotating…');
  try{
    const rec=await photoGet(pid); if(!rec) throw new Error('missing photo');
    /* VAULT_TOGGLE — a sealed record has no .blob to read; photoURL() decrypts it. */
    const url=await photoURL(pid); if(!url) throw new Error('cannot open photo');
    const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const c=document.createElement('canvas'); c.width=img.height; c.height=img.width;
    const ctx=c.getContext('2d');
    ctx.translate(c.width/2,c.height/2); ctx.rotate(Math.PI/2); ctx.drawImage(img,-img.width/2,-img.height/2);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.9));
    if(!blob) throw new Error('encode failed');
    /* photoPutFor() revokes and drops the stale object URL for this id. */
    await photoPutFor(rec.houseId,{id:pid,blob,houseId:rec.houseId,createdAt:rec.createdAt});
    vw.scale=1; vw.tx=0; vw.ty=0;
    const freshUrl=await photoURL(pid);
    const vimg=$viewer.querySelector('#v-img');
    if(vimg){ vimg.style.transform='translate(0px,0px) scale(1)'; vimg.src=freshUrl; }
    if(view.name==='house') render();
    toast('Rotated');
  }catch(err){ toast('Could not rotate photo'); }
}

function viewerNav(dir){
  const n=vw.photos.length; if(n<2)return;
  vw.index=(vw.index+dir+n)%n;
  renderViewerFrame();
}

function bindViewerGestures(){
  const stage=document.getElementById('v-stage'), img=document.getElementById('v-img');
  let mode=null;
  let startDist=0, startScale=1, startMidX=0, startMidY=0, startTx=0, startTy=0;
  let startX=0, startY=0, dragDX=0, dragDY=0;
  let lastTapT=0, lastTapX=0, lastTapY=0;

  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});

  function apply(){ img.style.transform=`translate(${vw.tx}px,${vw.ty}px) scale(${vw.scale})`; }
  function clampPan(){
    const r=stage.getBoundingClientRect();
    const maxX=Math.max(0,(r.width*(vw.scale-1))/2);
    const maxY=Math.max(0,(r.height*(vw.scale-1))/2);
    vw.tx=Math.max(-maxX,Math.min(maxX,vw.tx));
    vw.ty=Math.max(-maxY,Math.min(maxY,vw.ty));
  }

  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      mode='pinch';
      startDist=dist(e.touches); startScale=vw.scale;
      const r=stage.getBoundingClientRect(); const m=mid(e.touches);
      startMidX=m.x-r.left-r.width/2; startMidY=m.y-r.top-r.height/2;
      startTx=vw.tx; startTy=vw.ty;
    }else if(e.touches.length===1){
      const t=e.touches[0]; startX=t.clientX; startY=t.clientY; dragDX=0; dragDY=0;
      startTx=vw.tx; startTy=vw.ty;
      mode=vw.scale>1.02?'pan':'swipe';
    }
  },{passive:true});

  stage.addEventListener('touchmove',e=>{
    if(mode==='pinch'&&e.touches.length===2){
      e.preventDefault();
      const r=dist(e.touches)/startDist;
      vw.scale=Math.max(1,Math.min(4,startScale*r));
      vw.tx=startMidX-vw.scale*(startMidX-startTx)/startScale;
      vw.ty=startMidY-vw.scale*(startMidY-startTy)/startScale;
      clampPan(); apply();
    }else if(mode==='pan'&&e.touches.length===1){
      e.preventDefault();
      const t=e.touches[0];
      vw.tx=startTx+(t.clientX-startX); vw.ty=startTy+(t.clientY-startY);
      clampPan(); apply();
    }else if(mode==='swipe'&&e.touches.length===1){
      const t=e.touches[0]; dragDX=t.clientX-startX; dragDY=t.clientY-startY;
      if(Math.abs(dragDX)>Math.abs(dragDY)) e.preventDefault();
      img.style.transform=`translate(${dragDX}px,0px) scale(1)`;
    }
  },{passive:false});

  stage.addEventListener('touchend',()=>{
    if(mode==='pinch'){
      if(vw.scale<1.02){ vw.scale=1; vw.tx=0; vw.ty=0; apply(); }
      mode=null; return;
    }
    if(mode==='pan'){ mode=null; return; }
    if(mode==='swipe'){
      if(Math.abs(dragDX)>60&&Math.abs(dragDX)>Math.abs(dragDY)){
        viewerNav(dragDX<0?1:-1);
      }else{
        img.style.transform=`translate(0px,0px) scale(1)`;
        const t0=Date.now(), dx=startX-lastTapX, dy=startY-lastTapY;
        if(t0-lastTapT<320&&Math.hypot(dx,dy)<30){
          const r=stage.getBoundingClientRect();
          const ox=startX-r.left-r.width/2, oy=startY-r.top-r.height/2;
          if(vw.scale>1){ vw.scale=1; vw.tx=0; vw.ty=0; }
          else{ vw.scale=2.5; vw.tx=ox*(1-vw.scale); vw.ty=oy*(1-vw.scale); clampPan(); }
          apply(); lastTapT=0;
        }else{ lastTapT=t0; lastTapX=startX; lastTapY=startY; }
      }
      mode=null;
    }
  });

  stage.addEventListener('touchcancel',()=>{ mode=null; });
}

/* ============================================================
   PHOTO MARKUP — freehand draw + text labels, saved as a new photo
   CHUNK6_PHOTO_ANNOTATE
   ============================================================ */
const $annotate=document.getElementById('annotate');
let an={houseId:null,srcId:null,shape:'circle',color:'#D7A94B'};
let anUndo=[];
let anPending=null; /* {box,shape} once a shape is drawn and we're waiting for the note tap */

async function openAnnotate(){
  const pid=vw.photos[vw.index]; if(!pid)return;
  an={houseId:vw.houseId,srcId:pid,shape:'circle',color:'#D7A94B'};
  anUndo=[]; anPending=null;
  $annotate.classList.remove('hidden');
  await renderAnnotateFrame();
}
function closeAnnotate(){
  $annotate.classList.add('hidden'); $annotate.innerHTML=''; anUndo=[]; anPending=null;
}
function cancelAnnotate(){
  if(anUndo.length){ if(!confirm('Discard this markup?')) return; }
  closeAnnotate();
}

function annotateHintText(){
  return anPending ? 'Tap where the note should go' : 'Drag around the area to flag \u2014 add as many as you like';
}
function updateAnnotateHint(){
  const el=document.getElementById('a-hint'); if(el) el.textContent=annotateHintText();
}

async function renderAnnotateFrame(){
  $annotate.innerHTML=`
    <div class="a-top">
      <button class="icon-btn" data-a-cancel aria-label="Cancel">${I.x}</button>
      <span class="a-title">Callout</span>
      <button class="btn primary sm" data-a-save>Save</button>
    </div>
    <div class="a-tools">
      <span class="a-shapes">
        <button class="a-tool active" data-a-shape="circle" aria-label="Circle">◯</button>
        <button class="a-tool" data-a-shape="box" aria-label="Box">▭</button>
      </span>
      <span class="a-swatches">
        <button class="a-swatch" data-a-color="#C8654B" style="background:#C8654B" aria-label="Red"></button>
        <button class="a-swatch active" data-a-color="#D7A94B" style="background:#D7A94B" aria-label="Brass"></button>
        <button class="a-swatch" data-a-color="#FFFFFF" style="background:#FFFFFF" aria-label="White"></button>
      </span>
      <button class="icon-btn" data-a-undo aria-label="Undo">${I.undo}</button>
    </div>
    <div class="a-stage" id="a-stage"><canvas id="a-canvas"></canvas></div>
    <div class="a-hint" id="a-hint">${annotateHintText()}</div>`;
  $annotate.querySelector('[data-a-cancel]').onclick=cancelAnnotate;
  $annotate.querySelector('[data-a-save]').onclick=saveAnnotation;
  $annotate.querySelectorAll('[data-a-shape]').forEach(b=>b.onclick=()=>{
    an.shape=b.dataset.aShape;
    $annotate.querySelectorAll('[data-a-shape]').forEach(x=>x.classList.toggle('active',x===b));
  });
  $annotate.querySelectorAll('[data-a-color]').forEach(b=>b.onclick=()=>{
    an.color=b.dataset.aColor;
    $annotate.querySelectorAll('[data-a-color]').forEach(x=>x.classList.toggle('active',x===b));
  });
  $annotate.querySelector('[data-a-undo]').onclick=()=>{ annotateUndo(); updateAnnotateHint(); };

  const stage=document.getElementById('a-stage'), canvas=document.getElementById('a-canvas');
  const url=await photoURL(an.srcId); if(!url){ toast('Could not load photo'); cancelAnnotate(); return; }
  const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const natW=img.naturalWidth||img.width, natH=img.naturalHeight||img.height;
  canvas.width=natW; canvas.height=natH;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,natW,natH);
  fitAnnotateCanvas(canvas,stage,natW,natH);
  bindAnnotateGestures(canvas,stage,ctx);
}

function fitAnnotateCanvas(canvas,stage,natW,natH){
  const r=stage.getBoundingClientRect();
  const availW=Math.max(60,r.width-32), availH=Math.max(60,r.height-32);
  const scale=Math.min(availW/natW, availH/natH);
  canvas.style.width=Math.round(natW*scale)+'px';
  canvas.style.height=Math.round(natH*scale)+'px';
}

function pushAnnotateUndoSnap(snap){
  if(anUndo.length>=15) anUndo.shift();
  anUndo.push(snap);
}
function annotateUndo(){
  const canvas=document.getElementById('a-canvas'); if(!canvas||!anUndo.length)return;
  const ctx=canvas.getContext('2d');
  const snap=anUndo.pop();
  ctx.putImageData(snap,0,0);
  anPending=null;
  const stage=document.getElementById('a-stage');
  const existing=stage&&stage.querySelector('.a-textinput'); if(existing) existing.remove();
}

function shapeBoundsFromPts(p0,p1){
  return { x0:Math.min(p0.x,p1.x), y0:Math.min(p0.y,p1.y), x1:Math.max(p0.x,p1.x), y1:Math.max(p0.y,p1.y) };
}
function drawShapePreview(ctx,base,box,shape,color,lineWidth){
  ctx.putImageData(base,0,0);
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=lineWidth; ctx.lineJoin='round';
  if(shape==='circle'){
    const cx=(box.x0+box.x1)/2, cy=(box.y0+box.y1)/2, rx=(box.x1-box.x0)/2, ry=(box.y1-box.y0)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(rx,4),Math.max(ry,4),0,0,Math.PI*2); ctx.stroke();
  }else{
    ctx.strokeRect(box.x0,box.y0,box.x1-box.x0,box.y1-box.y0);
  }
  ctx.restore();
}
function drawArrowhead(ctx,tipX,tipY,dirAngle,color,size){
  ctx.save();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(tipX-size*Math.cos(dirAngle-0.45),tipY-size*Math.sin(dirAngle-0.45));
  ctx.lineTo(tipX-size*Math.cos(dirAngle+0.45),tipY-size*Math.sin(dirAngle+0.45));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function bindAnnotateGestures(canvas,stage,ctx){
  let dragging=false, dragStart=null, lastPt=null, preDragSnap=null;
  let rafPending=false;
  const ptFromEvent=(clientX,clientY)=>{
    const r=canvas.getBoundingClientRect();
    return { x:(clientX-r.left)*(canvas.width/r.width), y:(clientY-r.top)*(canvas.height/r.height) };
  };
  const shapeLineW=()=>Math.max(4,canvas.width*0.007);
  const minDragPx=()=>Math.max(18,canvas.width*0.02);

  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.touches[0]; const pt=ptFromEvent(t.clientX,t.clientY);
    if(anPending){
      placeAnnotateNote(t.clientX,t.clientY,pt,canvas,stage,ctx);
      return;
    }
    dragging=true; dragStart=pt; lastPt=pt;
    preDragSnap=ctx.getImageData(0,0,canvas.width,canvas.height);
  },{passive:false});

  canvas.addEventListener('touchmove',e=>{
    if(!dragging||anPending)return;
    e.preventDefault();
    const t=e.touches[0]; lastPt=ptFromEvent(t.clientX,t.clientY);
    if(!rafPending){
      rafPending=true;
      requestAnimationFrame(()=>{
        rafPending=false;
        if(dragging&&!anPending) drawShapePreview(ctx,preDragSnap,shapeBoundsFromPts(dragStart,lastPt),an.shape,an.color,shapeLineW());
      });
    }
  },{passive:false});

  canvas.addEventListener('touchend',()=>{
    if(!dragging||anPending){ dragging=false; return; }
    dragging=false;
    const dist=Math.hypot(lastPt.x-dragStart.x,lastPt.y-dragStart.y);
    if(dist<minDragPx()){
      ctx.putImageData(preDragSnap,0,0);
      return;
    }
    const box=shapeBoundsFromPts(dragStart,lastPt);
    drawShapePreview(ctx,preDragSnap,box,an.shape,an.color,shapeLineW());
    pushAnnotateUndoSnap(preDragSnap);
    anPending={ box, shape:an.shape };
    updateAnnotateHint();
  });
  canvas.addEventListener('touchcancel',()=>{
    if(dragging&&preDragSnap) ctx.putImageData(preDragSnap,0,0);
    dragging=false;
  });
}

function placeAnnotateNote(clientX,clientY,canvasPt,canvas,stage,ctx){
  const pending=anPending; if(!pending)return;
  const box=pending.box, color=an.color;

  /* CHUNK9_NOTE_EDGE_CLAMP — the arrow is now drawn at commit time, once we
     know the note text and can keep it fully inside the photo. */
  const existing=stage.querySelector('.a-textinput'); if(existing) existing.remove();
  const r=stage.getBoundingClientRect();
  const dispScale=canvas.getBoundingClientRect().width/canvas.width;
  const fontCanvasPx=Math.max(26,canvas.width*0.04);

  const inp=document.createElement('input');
  inp.type='text'; inp.className='a-textinput';
  inp.placeholder='Note\u2026';
  const inputW=Math.min(220,Math.round(r.width*0.7));
  let leftPx=clientX-r.left;
  if(leftPx+inputW>r.width-8) leftPx=Math.max(8,r.width-8-inputW);
  const topPx=clientY-r.top;
  inp.style.cssText='position:absolute;left:'+leftPx+'px;top:'+topPx+'px;transform:translateY(-50%);'+
    'width:'+inputW+'px;background:rgba(0,0,0,.55);border:1px dashed '+color+';color:'+color+';'+
    'font-size:'+Math.round(fontCanvasPx*dispScale)+'px;padding:3px 7px;border-radius:4px;outline:none;';
  stage.appendChild(inp); inp.focus();

  let done=false;
  const commit=()=>{
    if(done)return; done=true;
    const val=inp.value.trim(); inp.remove();
    if(!val){ anPending=null; updateAnnotateHint(); return; }

    ctx.font='700 '+fontCanvasPx+'px system-ui,-apple-system,sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='left';
    const textW=ctx.measureText(val).width;
    const margin=Math.max(10,canvas.width*0.012);
    let tx=canvasPt.x, ty=canvasPt.y;
    if(tx+textW+margin>canvas.width) tx=canvas.width-textW-margin;
    if(tx<margin) tx=margin;
    const halfH=fontCanvasPx*0.6;
    if(ty-halfH<margin) ty=margin+halfH;
    if(ty+halfH>canvas.height-margin) ty=canvas.height-halfH-margin;

    const cx=(box.x0+box.x1)/2, cy=(box.y0+box.y1)/2;
    const halfSpan=Math.max(box.x1-box.x0,box.y1-box.y0)/2;
    const dx=cx-tx, dy=cy-ty;
    const dist=Math.hypot(dx,dy)||1;
    const reach=Math.min(halfSpan*0.95, dist*0.9);
    const t=Math.max(0,(dist-reach)/dist);
    const tipX=tx+dx*t, tipY=ty+dy*t;
    const angle=Math.atan2(tipY-ty,tipX-tx);
    const lineWd=Math.max(3,canvas.width*0.005);
    ctx.save();
    ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=lineWd+3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tipX,tipY); ctx.stroke();
    ctx.strokeStyle=color; ctx.lineWidth=lineWd;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tipX,tipY); ctx.stroke();
    ctx.restore();
    drawArrowhead(ctx,tipX,tipY,angle,color,Math.max(10,canvas.width*0.016));

    ctx.font='700 '+fontCanvasPx+'px system-ui,-apple-system,sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.lineWidth=Math.max(3,fontCanvasPx*0.12); ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.strokeText(val,tx,ty);
    ctx.fillStyle=color; ctx.fillText(val,tx,ty);

    anPending=null;
    updateAnnotateHint();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
}

async function saveAnnotation(){
  const canvas=document.getElementById('a-canvas'); if(!canvas)return;
  toast('Saving markup…');
  try{
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.9));
    if(!blob) throw new Error('encode failed');
    const h=houseById(an.houseId); if(!h) throw new Error('no house');
    const newId=uid();
    await photoPutFor(an.houseId,{id:newId,blob,houseId:an.houseId,createdAt:now()});
    h.photos=h.photos||[]; h.photos.push(newId);
    if(!h.cover) h.cover=newId;
    h.updatedAt=now(); persist.houses();
    closeAnnotate();
    if(view.name==='house') render();
    toast('Annotated photo saved');
    openViewer(an.houseId,newId);
  }catch(err){ toast('Could not save markup'); }
}

/* ============================================================
   BACKUP — export / import (photos as base64)
   ============================================================ */
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
function b64ToBlob(b64,type='image/jpeg'){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type}); }

/* ============================================================
   IMPORT_SAFE — a file is not a trusted input, whoever sent it.
   Everything below runs on data that arrived from disk: a full backup, or
   a shared project from another person. Escaping at the sinks is the
   defence; this is the second layer, and the place where the thirty-odd
   `data-*="${...id}"` attributes get covered once instead of thirty times.
   Ids are REFERENTIAL — h.photos[], h.cover, t.houseId, n.houseId all
   point at them — so a hostile id is refused, never rewritten: rewriting
   would break the very references it appears in. Every id this app mints
   is uid() or a short literal, so a real file always passes.
   ============================================================ */
const IMPORT_ID_RE     = /^[A-Za-z0-9._:-]{1,64}$/;
const IMPORT_STATUS_RE = /^[a-z]{1,16}$/;
function importOkId(v){ return typeof v==='string' && IMPORT_ID_RE.test(v); }
function importOkStatus(v){ return v==null || v==='' || (typeof v==='string' && IMPORT_STATUS_RE.test(v)); }
function importCap(v,max){ return String(v==null?'':v).slice(0,max); }

/* Returns a human phrase naming the first bad value, or null when clean. */
function importUnsafeField(d){
  for(const c of (Array.isArray(d.categories)?d.categories:[])){
    if(!c || typeof c!=='object' || !importOkId(c.id)) return 'a category id';
  }
  for(const h of (Array.isArray(d.houses)?d.houses:[])){
    if(!h || typeof h!=='object' || !importOkId(h.id)) return 'a project id';
    if(!importOkStatus(h.status)) return 'a project status';
    if(h.cover!=null && !importOkId(h.cover)) return 'a cover photo id';
    for(const pid of (Array.isArray(h.photos)?h.photos:[])) if(!importOkId(pid)) return 'a photo id';
    for(const s of (Array.isArray(h.specs)?h.specs:[])){
      if(!s || typeof s!=='object' || !importOkId(s.id)) return 'a spec id';
    }
  }
  for(const t of (Array.isArray(d.tasks)?d.tasks:[])){
    if(!t || typeof t!=='object' || !importOkId(t.id)) return 'a to-do id';
    if(!importOkStatus(t.status)) return 'a to-do status';
  }
  for(const n of (Array.isArray(d.notes)?d.notes:[])){
    if(!n || typeof n!=='object' || !importOkId(n.id)) return 'a note id';
  }
  for(const pid of Object.keys(d.photos||{})) if(!importOkId(pid)) return 'a photo id';
  return null;
}

/* Ids are already proven safe by the time this runs; this coerces the two
   free-text fields. The icon cap matches the in-app maxlength=4 exactly.
   The label cap is deliberately loose — the in-app label field has no
   maxlength, so a tight cap would silently truncate a legitimate name and
   break byte-identical restore. Length is a sanity bound here, not the
   defence; esc() at every sink is the defence. Key order is preserved so
   a legitimate file still round-trips byte-for-byte. */
function importSanitizeCategories(arr){
  return arr.map(c=>({
    id:    c.id,
    label: importCap(c.label,200),
    icon:  importCap(c.icon,4)
  }));
}

/* CHUNK22_IMPORT_SHARED_PROJECT */
async function importSharedProject(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  try{
    const text=await file.text(); const d=JSON.parse(text);
    if(d.app!=='notebuilt-project-share') throw new Error('Not a shared Notebuilt project file');
    const p=d.project||{};
    if(!p.name) throw new Error('Missing project name');
    const newId=uid();
    const category=(typeof categoryById==='function'&&categoryById('construction'))?'construction':null;
    const nh={
      /* IMPORT_SAFE — the ids here are all freshly minted below, so the risk
         is the free-text and the status, which arrive verbatim from whoever
         sent the file. status lands in a class attribute; anything that is
         not a plain lowercase word is not a status. */
      id:newId, name:importCap(p.name,200), category,
      status:importOkStatus(p.status)&&p.status?p.status:'active', jobType:importCap(p.jobType,40),
      address:p.address||'', notes:p.notes||'',
      specs:(p.specs||[]).map(s=>({id:uid(),category:s.category,room:s.room,label:s.label,value:s.value,note:s.note,createdAt:now()})),
      photos:[], cover:null, createdAt:now(), updatedAt:now()
    };
    houses.push(nh);
    if(Array.isArray(p.tasks)&&p.tasks.length){
      p.tasks.forEach(t=>{
        tasks.push({id:uid(),text:t.text,status:t.status||'todo',houseId:newId,createdAt:now(),updatedAt:now(),doneAt:null,dueDate:null});
      });
      persist.tasks();
    }
    if(p.photos){
      for(const [oldPid,pd] of Object.entries(p.photos)){
        try{
          const newPid=uid();
          const blob=b64ToBlob(pd.b64);
          await photoPut({id:newPid,blob,houseId:newId,createdAt:pd.createdAt||now()});
          nh.photos.push(newPid);
          if(!nh.cover) nh.cover=newPid;
        }catch(err){}
      }
    }
    persist.houses();
    e.target.value='';
    go('house',newId);
    toast('Project imported');
  }catch(err){
    e.target.value='';
    alert('Could not import: '+(err.message||'that file doesn\'t look like a shared Notebuilt project'));
  }
}

async function exportData(){
  toast('Building backup…');
  const photos=await photoAll();
  const photoData={};
  for(const p of photos){
    /* VAULT_BACKUP — a sealed photo is exported exactly as it sits in storage:
       ciphertext and its IV. The file never holds a readable copy. */
    if(isEncPhoto(p)) photoData[p.id]={ enc:1, iv:p.iv, type:p.type||'image/jpeg',
                                        houseId:p.houseId, createdAt:p.createdAt, b64:b64FromBytes(p.ct) };
    /* VAULT_ENVELOPE — a capture taken while locked and not yet resealed. It
       travels as it sits, wrapped key and all; the vault block carries the
       private half that opens it. */
    else if(isEnvPhoto(p)) photoData[p.id]={ env:1, ek:p.ek, iv:p.iv, type:p.type||'image/jpeg',
                                        houseId:p.houseId, createdAt:p.createdAt, b64:b64FromBytes(p.ct) };
    else photoData[p.id]={houseId:p.houseId,createdAt:p.createdAt,b64:await blobToB64(p.blob)};
    /* BACKUP_V3 — the cover-crop flag is part of the photo, and every backup
       written before now dropped it on the floor. */
    if(p.cropped) photoData[p.id].cropped=true;
  }
  /* CHUNK13_RENAME_BACKUP */
  /* The salt and verifier have to travel with the data, or a restored protected
     project could never be opened again by anyone. The passphrase itself is not
     in here and cannot be — nothing derived from it is stored anywhere. */
  /* BACKUP_V3 — categories and the whole settings object travel too. Until
     version 3 they did not, so every restore quietly landed on defaults with
     none of your custom categories, and the file said nothing about it. The
     contents block is that missing sentence: what this file holds, in its own
     words, readable without running anything. */
  /* SCHEMA — `version:3` here is the EXPORT FORMAT of this file and nothing
     else. The device's stored-shape number rides inside `settings` below,
     as `schemaVersion`. Two systems, two jobs: this one tells a reader
     what the FILE holds, that one tells a load what shape the DEVICE is
     in. They are never compared. */
  const dump={ app:'notebuilt', version:3, exportedAt:now(), houses, tasks, notes, photos:photoData,
               vault: settings.vault || null,
               categories: categories,
               settings: settings,
               contents:{ projects:houses.length, tasks:tasks.length, notes:notes.length,
                          photos:Object.keys(photoData).length,
                          categories:(categories||[]).length,
                          settings:true, vault:!!settings.vault } };
  const blob=new Blob([JSON.stringify(dump)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`notebuilt-backup-${todayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Backup downloaded');
  settings.lastBackupAt=now(); persist.settings();
}
/* BACKUP_V3 — what the file says it holds. A version 3 file carries its own
   manifest; anything older is counted from the arrays, and the difference
   between the two is exactly what the reader needs to be told about. */
function backupManifest(d){
  const c = d.contents || {};
  const num = (v, fallback)=> (typeof v==='number' ? v : fallback);
  return {
    /* the FILE's export format (2 or 3), never the device's storage
       schemaVersion — that one travels inside d.settings. */
    version:    d.version || 1,
    projects:   num(c.projects, (d.houses||[]).length),
    tasks:      num(c.tasks,    (d.tasks||[]).length),
    notes:      num(c.notes,    (d.notes||[]).length),
    photos:     num(c.photos,   Object.keys(d.photos||{}).length),
    categories: Array.isArray(d.categories) ? d.categories.length : 0,
    hasCategories: Array.isArray(d.categories) && d.categories.length>0,
    hasSettings:   !!(d.settings && typeof d.settings==='object'),
    hasVault:      !!(d.vault && d.vault.salt && d.vault.verifier)
  };
}
function backupManifestText(m){
  const n=(count,word)=> '  \u2022 '+count+' '+word+(count===1?'':'s')+'\n';
  const missing=[];
  if(!m.hasCategories) missing.push('your custom categories');
  if(!m.hasSettings)   missing.push('your app settings');
  return 'This backup contains:\n'
    + n(m.projects,'project') + n(m.tasks,'to-do') + n(m.notes,'note') + n(m.photos,'photo')
    + (m.hasCategories ? '  \u2022 '+m.categories+' custom categor'+(m.categories===1?'y':'ies')+'\n' : '')
    + (m.hasSettings   ? '  \u2022 your app settings\n' : '')
    + (m.hasVault      ? '  \u2022 a vault \u2014 protected projects, still encrypted\n' : '')
    + (missing.length
        ? '\nIt does NOT contain '+missing.join(' or ')+'.\nThis is an older backup (version '
          +m.version+'), written before those were included. What is on this device stays as it is.\n'
        : '');
}

/* BACKUP_V3 — prove the backup can be opened BEFORE this device is touched.
   A restore that lands data nobody can read is worse than no restore at all,
   because by then the readable copy is gone. */
function backupAskPass(opts){
  return new Promise(resolve=>{
    const draw=(err)=>{
      vaultOverlay('<div class="v-steps">'+esc(opts.step||'')+'</div>'
        +'<div class="v-mark">'+I.lock+'</div>'
        +'<h2>'+esc(opts.title)+'</h2>'
        +'<div class="v-copy">'+opts.body+'</div>'
        +'<div class="field"><label>Vault passphrase</label>'+pwField('b-vp','','current-password')+'</div>'
        +'<div class="v-err">'+esc(err||'')+'</div>'
        +'<div class="v-actions"><button class="btn primary block" data-b-go>Continue</button>'
        +'<button class="btn block" data-b-cancel>Cancel restore</button></div>');
      bindPwEyes($vault);
      setTimeout(()=>{ const el=$vault.querySelector('#b-vp'); if(el) el.focus(); },60);
      const go=async()=>{
        const btn=$vault.querySelector('[data-b-go]'), inp=$vault.querySelector('#b-vp');
        const pass=inp.value; if(!pass) return;
        btn.setAttribute('disabled',''); btn.textContent='Checking\u2026';
        const key=await vaultKeyFor(pass, opts.block);
        if(key){ vaultCloseOverlay(); resolve({key:key, pass:pass}); return; }
        /* Same deliberate one-second cost as every other wrong passphrase. */
        await new Promise(r=>setTimeout(r,1000));
        draw(opts.err||'That passphrase does not open this vault \u2014 retry or cancel.');
      };
      $vault.querySelector('[data-b-go]').onclick=go;
      $vault.querySelector('[data-b-cancel]').onclick=()=>{ vaultCloseOverlay(); resolve(null); };
      $vault.querySelector('#b-vp').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    };
    draw();
  });
}

/* BACKUP_V3 — RE-SEAL.
   Every protected value in a backup — text field and photo alike — is AES-GCM
   directly under PBKDF2(that backup's passphrase, that backup's salt). The RSA
   keypair covers one case only: a capture taken while the vault was locked. So
   re-wrapping the keypair would change nothing; the only honest re-seal is to
   open every sealed value with the backup's key and seal it again with this
   device's, normalising envelope captures to the ordinary sealed shape on the
   way through — exactly what an unlock on the source device would have done.

   This runs on the parsed file, in memory, BEFORE anything is committed. One
   record that will not open aborts the whole restore and the device is left
   exactly as it was. There is no half-re-sealed state to be stranded in. */
async function backupReseal(d, fromKey, toKey){
  const photoIds = Object.keys(d.photos||{});
  const total = (d.houses||[]).length + (d.tasks||[]).length + (d.notes||[]).length + photoIds.length;
  let done = 0;
  const tick = async ()=>{
    done++;
    if(done%4===0 || done===total)
      await vaultBusy('Re-sealing the restore','under this device\u2019s passphrase',
                      total ? Math.round(done/total*100) : 100);
  };
  const move = async v => isEnc(v) ? vaultSealTextWith(toKey, await vaultOpenTextWith(fromKey, v)) : v;

  for(const h of d.houses||[]){
    h.address = await move(h.address);
    h.notes   = await move(h.notes);
    for(const s of h.specs||[]){
      s.room  = await move(s.room);  s.label = await move(s.label);
      s.value = await move(s.value); s.note  = await move(s.note);
    }
    await tick();
  }
  for(const t of d.tasks||[]){ t.text=await move(t.text); await tick(); }
  for(const nt of d.notes||[]){ nt.title=await move(nt.title); nt.body=await move(nt.body); await tick(); }

  let priv=null;
  for(const id of photoIds){
    const p=d.photos[id];
    if(p.enc===1){
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytesFromB64(p.iv)}, fromKey, bytesFromB64(p.b64));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, toKey, pt);
      p.iv=b64FromBytes(iv); p.b64=b64FromBytes(ct);
    } else if(p.env===1){
      if(!priv){
        if(!(d.vault && d.vault.priv)) throw new Error('this backup holds a photo that only its own vault could open');
        priv = await vaultImportPriv(await vaultOpenTextWith(fromKey, d.vault.priv));
      }
      const dek = await crypto.subtle.unwrapKey('raw', bytesFromB64(p.ek), priv,
                    {name:'RSA-OAEP'}, {name:'AES-GCM',length:256}, false, ['decrypt']);
      const pt  = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytesFromB64(p.iv)}, dek, bytesFromB64(p.b64));
      const iv  = crypto.getRandomValues(new Uint8Array(12));
      const ct  = await crypto.subtle.encrypt({name:'AES-GCM', iv}, toKey, pt);
      delete p.env; delete p.ek;
      p.enc=1; p.iv=b64FromBytes(iv); p.b64=b64FromBytes(ct);
    }
    await tick();
  }
}

async function importData(e){
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const reset=()=>{ try{ e.target.value=''; }catch(err){} };

  /* Read and understand the file first. Nothing is replaced until the person
     doing it has been told, in counts, what they are replacing it with. */
  let d;
  try{
    d=JSON.parse(await file.text());
    if(d.app!=='notebuilt' && d.app!=='punchlist') throw new Error('Not a Notebuilt backup');
  }catch(err){ reset(); alert('Could not restore: '+err.message); return; }

  /* IMPORT_SAFE — refuse a hostile value before the manifest is even shown,
     so nothing on this device is touched and no passphrase is asked for. */
  const badField=importUnsafeField(d);
  if(badField){
    reset();
    alert('Could not restore: this file contains '+badField+' that is not a valid value.\n\n'
         +'Nothing on this device was touched.');
    return;
  }
  const m=backupManifest(d);
  if(!confirm(backupManifestText(m)
      +'\nRestore REPLACES everything currently in the app with what is listed above.\n'
      +(m.hasVault
          ? '\nThe backup carries a vault. You will be asked for its passphrase before anything here is replaced.\n'
          : (vaultExists()
              ? '\nThis device has a vault and this backup does not. Restoring removes it, along with everything it protected.\n'
              : ''))
      +'\nContinue?')){ reset(); return; }

  /* ---- the gate: the backup's own salt and verifier, before any commit ---- */
  let keepVault=null;
  if(m.hasVault){
    const got=await backupAskPass({
      step:'Restore \u00b7 the backup\u2019s vault',
      title:'The backup\u2019s passphrase',
      body:'This backup contains protected projects. Enter the vault passphrase '
          +'<b>the backup was made with</b>. It is checked against the file itself \u2014 '
          +'nothing on this device is touched until it opens.',
      block:d.vault,
      err:'This backup uses a different passphrase \u2014 retry or cancel.'});
    if(!got){ reset(); toast('Restore cancelled \u2014 nothing changed'); return; }

    /* Would that same passphrase also open the vault already on this device?
       If not, restoring as-is leaves the device answering to the backup's
       passphrase instead of the one in daily use. Offer the swap. */
    if(vaultExists() && !(await vaultKeyFor(got.pass, settings.vault))){
      if(confirm('This device\u2019s vault uses a different passphrase than the backup.\n\n'
        +'OK \u2014 RE-SEAL: everything is re-encrypted under this device\u2019s current '
        +'passphrase, and that is the one that opens it afterwards.\n\n'
        +'Cancel \u2014 restore as-is: the backup\u2019s passphrase becomes the one that opens the vault.')){
        const cur=await backupAskPass({
          step:'Restore \u00b7 this device\u2019s vault',
          title:'This device\u2019s passphrase',
          body:'The one you use on this phone now. Everything in the backup is re-sealed '
              +'under it in memory, before the restore commits \u2014 if any part of it will '
              +'not open, nothing is restored and this device is left as it is.',
          block:settings.vault,
          err:'That is not this device\u2019s vault passphrase \u2014 retry or cancel.'});
        if(!cur){ reset(); toast('Restore cancelled \u2014 nothing changed'); return; }
        keepVault=settings.vault;
        try{
          await vaultBusy('Re-sealing the restore','reading the backup',0);
          await backupReseal(d, got.key, cur.key);
          vaultBusyDone();
        }catch(err){
          vaultBusyDone(); reset();
          /* BACKUP_V3_RESEAL_COPY — WebCrypto's whole message for a record that
             will not open is "OperationError", which is no use to anyone
             standing there holding the phone. */
          const why = (err && err.name==='OperationError')
            ? 'a protected record in the backup would not open \u2014 the file may be damaged'
            : (err.message||err);
          alert('Re-seal failed, so nothing was restored and this device is untouched:\n\n'+why);
          return;
        }
      }
    }
  }

  try{
    /* VAULT_BACKUP — the salt and verifier come back with the data, and the key
       in memory goes: whatever is on screen belongs to the old data set. */
    vaultRelock(true);
    houses=d.houses||[]; tasks=d.tasks||[]; notes=d.notes||[];
    /* SCHEMA — restored data climbs the same ladder a load would put it
       on, before any of it is written down. The number read is the FILE's
       STORED-SHAPE number, which travels inside its settings block; a file
       with no settings block predates the schema entirely and reads as v1.
       Do NOT read `d.version` here — that is the file's EXPORT FORMAT, a
       different system with its own numbering, and conflating the two is
       exactly the bug this comment exists to prevent. */
    nbApplySchema((d.settings && typeof d.settings==='object') ? nbSchemaOf(d.settings) : 1);
    persist.houses(); persist.tasks(); persist.notes();

    /* BACKUP_V3 — a version 3 file carries these; a version 2 file does not,
       and what is on this device is then left exactly where it is. */
    if(Array.isArray(d.categories) && d.categories.length){ categories=importSanitizeCategories(d.categories); persist.categories(); }
    const vaultBlock = keepVault || d.vault || null;
    if(d.settings && typeof d.settings==='object'){
      const next=Object.assign({}, d.settings);
      /* The PIN is not cryptographic and belongs to the phone in your hand,
         not to the file. Keep the one already set here; take the backup's only
         on a device that has none. */
      if(settings.pinHash){
        next.pinHash=settings.pinHash; next.pinSalt=settings.pinSalt;
        /* PIN_RECOVERY — the recovery credential is the way into THIS phone and
           belongs to the PIN it was issued alongside. Taking the backup's code
           while keeping the device's PIN would silently change which written-down
           code opens the door. On a fresh install both come from the file. */
        next.recovery=settings.recovery||null;
        next.recoveryOfferedAt=settings.recoveryOfferedAt||null;
      }
      settings=next;
    }
    settings.vault=vaultBlock;
    if(!settings.sortHouses) settings.sortHouses='updated';
    if(!settings.units) settings.units='imperial';
    /* The data is as old as the moment the file was written, and the backup
       nudge should say so. Never the restored value, never now(). */
    settings.lastBackupAt=d.exportedAt||now();
    /* UNLOCK — a backup written before the cap existed carries no standing
       of its own, and every project inside it is pre-cap by definition. Take
       the restored count as the stamp, so the person who made that work is
       met with the words they are owed instead of a pitch for a limit that
       arrived after it.

       The test is on the FILE, not on the merged settings: this device
       stamped itself at load — 0 on a fresh phone — and a v2 backup carries
       no settings block to overwrite that, so asking whether the field
       exists here only ever describes the phone. Asking `d` describes the
       backup, which is the thing being judged. A file that brought its own
       standing has already merged it and is left alone. */
    if(!(d.settings && typeof d.settings.priorProjects==='number')) settings.priorProjects=houses.length;
    persist.settings();

    /* photos */
    const existing=await photoAll(); for(const p of existing) await photoDel(p.id).catch(()=>{});
    _objUrls.clear(); _vaultUrlIds.clear(); _vaultCache.clear();
    for(const [id,p] of Object.entries(d.photos||{})){
      let rec;
      if(p.enc===1) rec={id, enc:1, iv:p.iv, ct:bytesFromB64(p.b64).buffer,
                         type:p.type||'image/jpeg', houseId:p.houseId, createdAt:p.createdAt};
      else if(p.env===1) rec={id, env:1, ek:p.ek, iv:p.iv, ct:bytesFromB64(p.b64).buffer,
                         type:p.type||'image/jpeg', houseId:p.houseId, createdAt:p.createdAt};
      else rec={id, blob:b64ToBlob(p.b64), houseId:p.houseId, createdAt:p.createdAt};
      if(p.cropped) rec.cropped=true;
      await photoPut(rec);
    }
    reset();
    go('houses');
    toast(houses.some(h=>h.protected)?'Restored — protected projects are locked':'Backup restored');
  }catch(err){ reset(); alert('Could not restore: '+err.message); }
}

/* ============================================================
   APP LOCK (PIN, hashed with SHA-256 + salt)
   ============================================================ */
async function sha(text){ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function randSalt(){ return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join(''); }

/* ============================================================
   PIN_RECOVERY — getting back in when the PIN is gone
   The PIN is a privacy gate, not a lock on the data: nothing is encrypted
   under it. That cuts both ways — it is why forgetting it must not cost you
   the app, and why a way back is not a hole in anything. Where a vault exists
   its passphrase is already the stronger credential, so it is the way back.
   Where there is none, a one-time code written down at setup stands in.
   ============================================================ */
/* No I, O, 0 or 1 — this gets copied off a screen onto paper and back again.
   32 symbols divides 256 exactly, so the modulo below is unbiased. */
const RECOVERY_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const RECOVERY_LEN=16;   /* 16 chars from 32 symbols = 80 bits */

/* PIN_RECOVERY — the copy that stood here has moved into the
   EGS-STD:infomode block, with the rest of it. Info mode inherited it,
   which is what the note here always said would happen. maybeOfferRecoveryCode()
   below still reads HELP_COPY['pin-recovery']; nothing about that changed. */

function recoveryGenerate(){
  const bytes=crypto.getRandomValues(new Uint8Array(RECOVERY_LEN));
  let s='';
  for(let i=0;i<RECOVERY_LEN;i++) s+=RECOVERY_ALPHABET[bytes[i]%RECOVERY_ALPHABET.length];
  return s.replace(/(.{4})(?=.)/g,'$1-');
}
/* Dashes, spaces and case are how a human writes it down. None of them count. */
function recoveryNormalize(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function recoveryExists(){ return !!(settings.recovery && settings.recovery.hash && settings.recovery.salt); }
async function recoverySet(){
  const code=recoveryGenerate(), salt=randSalt();
  settings.recovery={ salt:salt, hash:await sha(recoveryNormalize(code)+salt), createdAt:now() };
  persist.settings();
  return code;                      /* the only moment the plain code exists */
}
async function recoveryVerify(input){
  if(!recoveryExists()) return false;
  const norm=recoveryNormalize(input);
  if(!norm) return false;
  return (await sha(norm+settings.recovery.salt))===settings.recovery.hash;
}

/* One screen shape for all three answers to "forgot PIN". */
function lockPrompt(o){
  $lock.classList.remove('hidden');
  $lock.innerHTML='<div class="mark">'+MARK+'</div>'
    +'<div class="name">'+esc(o.title)+'</div>'
    +'<div class="lock-copy" style="margin:12px 0 14px">'+o.copy+'</div>'
    +(o.field?'<div class="lock-field">'+o.field+'</div>':'')
    +'<div class="err"></div>'
    +'<div class="lock-actions">'
      +(o.go?'<button type="button" class="btn primary block" data-go>'+esc(o.go)+'</button>':'')
      +'<button type="button" class="btn block" data-back>'+esc(o.back||'Back')+'</button>'
    +'</div>'
    +versionStamp();
  $lock.querySelector('[data-back]').onclick=o.onBack;
  return { err:$lock.querySelector('.err'), go:$lock.querySelector('[data-go]') };
}

function forgotPinFlow(){
  const back=()=>lockGate();
  if(vaultExists())    return forgotViaVault(back);
  if(recoveryExists()) return forgotViaCode(back);
  return forgotDeadEnd(back);
}

function forgotViaVault(back){
  const ui=lockPrompt({
    title:'Forgot PIN',
